<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Whale Tracker</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { 
    font-family: 'Courier New', monospace;
    background: #000;
    color: #0f0; 
    padding: 10px;
    font-size: 12px;
    line-height: 1.2;
}
.header {
    border: 2px solid #333;
    padding: 8px;
    margin-bottom: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #111;
    box-shadow: 0 0 10px #0f0;
}
.header span {
    margin-right: 15px;
}
.status { color: #333; }
.status.on { color: #0f0; text-shadow: 0 0 5px #0f0; }

input { 
    width: 100%;
    background: #000;
    border: 2px solid #333;
    color: #0f0;
    padding: 6px;
    font-family: 'Courier New', monospace;
    font-size: 12px;
    margin-bottom: 10px;
}
input:focus {
    outline: none;
    border-color: #0f0;
    box-shadow: 0 0 5px #0f0;
}

table {
    width: 100%;
    border-collapse: collapse;
    border: 2px solid #333;
    background: #000;
    margin-bottom: 15px;
    box-shadow: 0 0 10px rgba(0,255,0,0.1);
}
th {
    background: #111;
    color: #0f0;
    padding: 8px;
    text-align: left;
    border: 1px solid #333;
    font-weight: bold;
    border-bottom: 2px solid #333;
}
td {
    padding: 6px 8px;
    border: 1px solid #222;
    color: #0f0;
}
tr:hover td {
    background: #1a1a1a;
}
.buy { color: #0f0; font-weight: bold; text-shadow: 0 0 3px #0f0; }
.sell { color: #f00; font-weight: bold; text-shadow: 0 0 3px #f00; }
.total-row {
    background: #111;
    font-weight: bold;
    border-top: 2px solid #333;
}
.total-row td {
    border-top: 2px solid #333;
}
.gray { color: #333; }
.new-row {
    animation: highlight 1s ease;
}
@keyframes highlight {
    0% { background: #1a2a1a; }
    100% { background: transparent; }
}

/* Retro çizgiler */
table { position: relative; }
table::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    border: 1px solid #0f0;
    pointer-events: none;
    opacity: 0.1;
}
</style>
</head>
<body>

<div class="header">
    <div>
        <span><strong>WHALE TRACKER</strong></span>
        <span class="status" id="wsStatus">⬤ WS</span>
        <span class="status" id="apiStatus">⬤ API</span>
    </div>
    <div>
        <span>F&G: <span id="fear">--</span></span>
        <span>Total: <span id="total">0</span></span>
        <span>4H: <span id="hourly">0</span></span>
    </div>
</div>

<input type="text" id="filter" placeholder="Filter: BTC, ETH, SOL...">

<table id="summaryTable">
    <thead>
        <tr>
            <th>COIN</th>
            <th>BUY</th>
            <th>SELL</th>
            <th>BUY USD</th>
            <th>SELL USD</th>
            <th>TOTAL USD</th>
        </tr>
    </thead>
    <tbody id="summaryBody">
        <tr><td colspan="6" class="gray" style="text-align:center;">Loading...</td></tr>
    </tbody>
</table>

<table id="tradesTable">
    <thead>
        <tr>
            <th>TIME</th>
            <th>COIN</th>
            <th>SIDE</th>
            <th>AMOUNT</th>
            <th>PRICE</th>
            <th>TOTAL USD</th>
        </tr>
    </thead>
    <tbody id="tradesBody">
        <tr><td colspan="6" class="gray" style="text-align:center;">Connecting...</td></tr>
    </tbody>
</table>

<script>
(function() {
'use strict';

// Eşik değerleri önemli ölçüde artırıldı (3-5x)
var THRESHOLDS = {
    btcusdt: 20,          // 6 → 20
    ethusdt: 300,         // 90 → 300
    bnbusdt: 2000,        // 600 → 2000
    solusdt: 8000,        // 2400 → 8000
    xrpusdt: 400000,      // 120K → 400K
    adausdt: 800000,      // 240K → 800K
    dogeusdt: 8000000,    // 2.4M → 8M
    dotusdt: 80000,       // 24K → 80K
    maticusdt: 800000,    // 240K → 800K
    linkusdt: 80000,      // 24K → 80K
    avaxusdt: 40000,      // 12K → 40K
    ltcusdt: 20000,       // 6K → 20K
    bchusdt: 12000,       // 3.6K → 12K
    uniusdt: 40000,       // 12K → 40K
    atomusdt: 40000,      // 12K → 40K
    etcusdt: 200000,      // 60K → 200K
    nearusdt: 80000,      // 24K → 80K
    aptusdt: 40000,       // 12K → 40K
    arbusdt: 400000,      // 120K → 400K
    opusdt: 120000,       // 36K → 120K
    ldousdt: 200000,      // 60K → 200K
    injusdt: 20000,       // 6K → 20K
    stxusdt: 200000,      // 60K → 200K
    filusdt: 40000,       // 12K → 40K
    suiusdt: 120000,      // 36K → 120K
    imxusdt: 120000,      // 36K → 120K
    tiausdt: 40000,       // 12K → 40K
    seiusdt: 200000,      // 60K → 200K
    hbarusdt: 800000,     // 240K → 800K
    rndrusdt: 40000,      // 12K → 40K
    fetusdt: 200000,      // 60K → 200K
    taousdt: 4000,        // 1.2K → 4K
    arusdt: 80000,        // 24K → 80K
    wldusdt: 120000,      // 36K → 120K
    flokiusdt: 8000000,   // 2.4M → 8M
    pepeusdt: 40000000000, // 12B → 40B
    shibusdt: 1200000000, // 360M → 1.2B
    wifusdt: 200000,      // 60K → 200K
    bonkusdt: 8000000000, // 2.4B → 8B
    jupusdt: 200000,      // 60K → 200K
    pythusdt: 400000,     // 120K → 400K
    trbusdt: 8000,        // 2.4K → 8K
    icpusdt: 40000,       // 12K → 40K
    runeusdt: 40000,      // 12K → 40K
    aaveusdt: 4000,       // 1.2K → 4K
    mkrusdt: 800,         // 240 → 800
    grtusdt: 800000,      // 240K → 800K
    ftmusdt: 200000,      // 60K → 200K
    algousdt: 400000,     // 120K → 400K
    qntusdt: 2000,        // 600 → 2000
    sandusdt: 400000,     // 120K → 400K
    manausdt: 400000,     // 120K → 400K
    axsusdt: 80000,       // 24K → 80K
    galausdt: 800000,     // 240K → 800K
    chzusdt: 800000,      // 240K → 800K
    apeusdt: 120000,      // 36K → 120K
    gmxusdt: 8000,        // 2.4K → 8K
    blurusdt: 120000,     // 36K → 120K
    pendleusdt: 80000     // 24K → 80K
};

var trades = [];
var totalCount = 0;
var connectedWS = 0;
var filterText = '';
var websockets = [];

var summaryBody = document.getElementById('summaryBody');
var tradesBody = document.getElementById('tradesBody');
var totalEl = document.getElementById('total');
var hourlyEl = document.getElementById('hourly');
var fearEl = document.getElementById('fear');
var wsStatus = document.getElementById('wsStatus');
var apiStatus = document.getElementById('apiStatus');
var filterEl = document.getElementById('filter');

function formatNum(n) {
    if (n >= 1000000) return (n/1000000).toFixed(2) + 'M';
    if (n >= 1000) return (n/1000).toFixed(2) + 'K';
    return n.toFixed(2);
}

function updateSummary() {
    var coins = {};
    trades.forEach(function(t) {
        if (!coins[t.coin]) coins[t.coin] = {buy:0, sell:0, buyUSD:0, sellUSD:0};
        if (t.side === 'BUY') {
            coins[t.coin].buy += t.amount;
            coins[t.coin].buyUSD += t.usd;
        } else {
            coins[t.coin].sell += t.amount;
            coins[t.coin].sellUSD += t.usd;
        }
    });
    
    var arr = Object.keys(coins).map(function(c) {
        return {
            coin: c,
            buy: coins[c].buy,
            sell: coins[c].sell,
            buyUSD: coins[c].buyUSD,
            sellUSD: coins[c].sellUSD,
            totalUSD: coins[c].buyUSD + coins[c].sellUSD
        };
    }).sort(function(a,b) { return b.totalUSD - a.totalUSD; });
    
    if (filterText) {
        arr = arr.filter(function(x) { return x.coin.indexOf(filterText) !== -1; });
    }
    
    var html = '';
    var totBuy = 0, totSell = 0, totBuyUSD = 0, totSellUSD = 0, totUSD = 0;
    
    arr.forEach(function(x) {
        totBuy += x.buy;
        totSell += x.sell;
        totBuyUSD += x.buyUSD;
        totSellUSD += x.sellUSD;
        totUSD += x.totalUSD;
        
        html += '<tr>' +
            '<td><strong>' + x.coin + '</strong></td>' +
            '<td class="buy">' + formatNum(x.buy) + '</td>' +
            '<td class="sell">' + formatNum(x.sell) + '</td>' +
            '<td class="buy">$' + formatNum(x.buyUSD) + '</td>' +
            '<td class="sell">$' + formatNum(x.sellUSD) + '</td>' +
            '<td><strong>$' + formatNum(x.totalUSD) + '</strong></td>' +
            '</tr>';
    });
    
    html += '<tr class="total-row">' +
        '<td><strong>TOTAL</strong></td>' +
        '<td class="buy">' + formatNum(totBuy) + '</td>' +
        '<td class="sell">' + formatNum(totSell) + '</td>' +
        '<td class="buy">$' + formatNum(totBuyUSD) + '</td>' +
        '<td class="sell">$' + formatNum(totSellUSD) + '</td>' +
        '<td><strong>$' + formatNum(totUSD) + '</strong></td>' +
        '</tr>';
    
    summaryBody.innerHTML = html || '<tr><td colspan="6" class="gray" style="text-align:center;">No data</td></tr>';
}

function updateTrades() {
    totalEl.textContent = totalCount;
    var recent = trades.filter(function(t) { return t.timestamp > Date.now() - 14400000; });
    hourlyEl.textContent = recent.length;
    
    var filtered = filterText ? trades.filter(function(t) { return t.coin.indexOf(filterText) !== -1; }) : trades;
    
    if (filtered.length === 0) {
        tradesBody.innerHTML = '<tr><td colspan="6" class="gray" style="text-align:center;">' + 
            (filterText ? 'No matches for: ' + filterText : 'Waiting for trades...') + '</td></tr>';
        return;
    }
    
    var html = '';
    filtered.slice(0, 50).forEach(function(t, i) {
        html += '<tr' + (i === 0 ? ' class="new-row"' : '') + '>' +
            '<td class="gray">' + t.time + '</td>' +
            '<td><strong>' + t.coin + '</strong></td>' +
            '<td class="' + (t.side === 'BUY' ? 'buy' : 'sell') + '">' + t.side + '</td>' +
            '<td>' + formatNum(t.amount) + '</td>' +
            '<td>$' + formatNum(t.price) + '</td>' +
            '<td><strong>$' + formatNum(t.usd) + '</strong></td>' +
            '</tr>';
    });
    
    tradesBody.innerHTML = html;
}

function addTrade(coin, side, amount, price) {
    trades.unshift({
        coin: coin,
        side: side,
        amount: amount,
        price: price,
        usd: amount * price,
        time: new Date().toLocaleTimeString('tr-TR'),
        timestamp: Date.now()
    });
    
    if (trades.length > 100) trades.pop();
    totalCount++;
    updateTrades();
    updateSummary();
}

function connectWS(symbol, threshold) {
    var ws = new WebSocket('wss://fstream.binance.com/ws/' + symbol + '@aggTrade');
    
    ws.onopen = function() {
        connectedWS++;
        if (connectedWS === 1) wsStatus.classList.add('on');
        updateTrades();
    };
    
    ws.onmessage = function(e) {
        try {
            var data = JSON.parse(e.data);
            var qty = parseFloat(data.q);
            var price = parseFloat(data.p);
            if (qty >= threshold) {
                addTrade(symbol.replace('usdt','').toUpperCase(), data.m ? 'SELL' : 'BUY', qty, price);
            }
        } catch(err) {}
    };
    
    ws.onclose = function() {
        connectedWS--;
        if (connectedWS === 0) wsStatus.classList.remove('on');
        setTimeout(function() { connectWS(symbol, threshold); }, 3000);
    };
    
    websockets.push(ws);
}

function fetchFear() {
    fetch('https://api.alternative.me/fng/?limit=1')
        .then(function(r) { return r.json(); })
        .then(function(d) {
            apiStatus.classList.add('on');
            if (d && d.data && d.data[0]) {
                fearEl.textContent = d.data[0].value;
            }
        })
        .catch(function() {
            apiStatus.classList.remove('on');
        });
}

function cleanOld() {
    trades = trades.filter(function(t) { return t.timestamp > Date.now() - 14400000; });
    updateTrades();
    updateSummary();
}

filterEl.addEventListener('input', function(e) {
    filterText = e.target.value.toUpperCase().trim();
    updateSummary();
    updateTrades();
});

Object.keys(THRESHOLDS).forEach(function(s) { connectWS(s, THRESHOLDS[s]); });
fetchFear();
setInterval(fetchFear, 300000);
setInterval(cleanOld, 60000);

})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>T&S - Time & Sales</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: #fff;
            overflow: hidden;
            height: 100vh;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 10px;
        }

        .header {
            text-align: center;
            padding: 15px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            margin-bottom: 10px;
        }

        .header h1 {
            font-size: 32px;
            letter-spacing: 8px;
            font-weight: bold;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            background: rgba(255, 255, 255, 0.1);
            padding: 10px;
            border-radius: 8px;
        }

        .symbol-selector {
            flex: 1;
            padding: 10px;
            background: rgba(100, 150, 255, 0.3);
            border: none;
            border-radius: 5px;
            color: white;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }

        .status {
            padding: 10px 20px;
            background: rgba(0, 255, 0, 0.2);
            border-radius: 5px;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #00ff00;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .table-header {
            display: grid;
            grid-template-columns: 2fr 1.5fr 1fr;
            gap: 10px;
            padding: 12px 15px;
            background: rgba(100, 150, 255, 0.4);
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 5px;
        }

        .trades-container {
            flex: 1;
            overflow-y: auto;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            padding: 5px;
        }

        .trades-container::-webkit-scrollbar {
            width: 8px;
        }

        .trades-container::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        .trades-container::-webkit-scrollbar-thumb {
            background: rgba(100, 150, 255, 0.5);
            border-radius: 10px;
        }

        .trade-row {
            display: grid;
            grid-template-columns: 2fr 1.5fr 1fr;
            gap: 10px;
            padding: 10px 15px;
            margin-bottom: 2px;
            border-radius: 5px;
            animation: slideIn 0.3s ease;
            font-size: 14px;
        }

        @keyframes slideIn {
            from {
                transform: translateY(-10px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .trade-row.buy {
            background: rgba(0, 255, 150, 0.15);
            color: #00ffaa;
        }

        .trade-row.sell {
            background: rgba(255, 50, 100, 0.15);
            color: #ff6b9d;
        }

        .trade-row.large {
            border: 2px solid rgba(255, 255, 0, 0.5);
            font-weight: bold;
        }

        .time {
            font-family: 'Courier New', monospace;
        }

        .price {
            font-weight: bold;
            font-size: 15px;
        }

        .size {
            text-align: right;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>T&S</h1>
        </div>

        <div class="controls">
            <select class="symbol-selector" id="symbolSelector">
                <option value="BTCUSDT">BTC/USDT</option>
                <option value="ETHUSDT">ETH/USDT</option>
                <option value="BNBUSDT">BNB/USDT</option>
                <option value="SOLUSDT">SOL/USDT</option>
                <option value="XRPUSDT">XRP/USDT</option>
            </select>
            <div class="status">
                <div class="status-dot"></div>
                <span id="statusText">LIVE</span>
            </div>
        </div>

        <div class="table-header">
            <div>Time</div>
            <div>Price</div>
            <div style="text-align: right;">Size</div>
        </div>

        <div class="trades-container" id="tradesContainer"></div>
    </div>

    <script>
        let ws = null;
        let trades = [];
        const maxTrades = 100;
        let currentSymbol = 'BTCUSDT';

        const tradesContainer = document.getElementById('tradesContainer');
        const symbolSelector = document.getElementById('symbolSelector');
        const statusText = document.getElementById('statusText');

        // Sembol değiştiğinde
        symbolSelector.addEventListener('change', (e) => {
            currentSymbol = e.target.value;
            trades = [];
            tradesContainer.innerHTML = '';
            connectWebSocket();
        });

        // WebSocket bağlantısı
        function connectWebSocket() {
            if (ws) {
                ws.close();
            }

            const symbol = currentSymbol.toLowerCase();
            ws = new WebSocket(`wss://stream.binance.com:9443/ws/${symbol}@trade`);

            ws.onopen = () => {
                console.log('WebSocket bağlandı:', currentSymbol);
                statusText.textContent = 'LIVE';
            };

            ws.onmessage = (event) => {
                const trade = JSON.parse(event.data);
                addTrade(trade);
            };

            ws.onerror = (error) => {
                console.error('WebSocket hatası:', error);
                statusText.textContent = 'ERROR';
            };

            ws.onclose = () => {
                console.log('WebSocket kapandı');
                statusText.textContent = 'DISCONNECTED';
                // 3 saniye sonra yeniden bağlan
                setTimeout(connectWebSocket, 3000);
            };
        }

        // Minimum BTC miktarını hesaplama
        function getMinBTCAmount() {
            // BTC için 10 BTC, diğer coinler için eşdeğer USD değeri
            const minBTC = 10;
            
            // Eğer BTCUSDT ise direkt BTC miktarını kontrol et
            if (currentSymbol === 'BTCUSDT') {
                return minBTC;
            }
            
            // Diğer coinler için 10 BTC'lik USD değerini hesapla (yaklaşık $950,000)
            return minBTC * 95000; // 10 BTC ≈ $950,000
        }

        // Trade ekleme
        function addTrade(trade) {
            const time = new Date(trade.T);
            const hours = String(time.getHours()).padStart(2, '0');
            const minutes = String(time.getMinutes()).padStart(2, '0');
            const seconds = String(time.getSeconds()).padStart(2, '0');
            const milliseconds = String(time.getMilliseconds()).padStart(3, '0');
            
            const formattedTime = `${hours}:${minutes}:${seconds}:${milliseconds}`;
            const price = parseFloat(trade.p).toFixed(2);
            const quantity = parseFloat(trade.q);
            const quantityFormatted = quantity.toFixed(4);
            const isBuyerMaker = trade.m;

            // Büyük emir kontrolü
            let isLarge = false;
            const minAmount = getMinBTCAmount();
            
            if (currentSymbol === 'BTCUSDT') {
                // BTC için direkt miktar kontrolü
                isLarge = quantity >= minAmount;
            } else {
                // Diğer coinler için USD değeri kontrolü
                const tradeValue = quantity * parseFloat(trade.p);
                isLarge = tradeValue >= minAmount;
            }

            // Trade objesini diziye ekle
            trades.unshift({
                time: formattedTime,
                price: price,
                quantity: quantityFormatted,
                isBuy: !isBuyerMaker,
                isLarge: isLarge
            });

            // Maksimum trade sayısını sınırla
            if (trades.length > maxTrades) {
                trades.pop();
            }

            // Ekranı güncelle
            renderTrades();
        }

        // Trade'leri ekrana render etme
        function renderTrades() {
            tradesContainer.innerHTML = '';
            
            trades.forEach(trade => {
                const tradeRow = document.createElement('div');
                tradeRow.className = `trade-row ${trade.isBuy ? 'buy' : 'sell'} ${trade.isLarge ? 'large' : ''}`;
                
                tradeRow.innerHTML = `
                    <div class="time">${trade.time}</div>
                    <div class="price">${trade.price}</div>
                    <div class="size">${trade.quantity}</div>
                `;
                
                tradesContainer.appendChild(tradeRow);
            });
        }

        // Sayfa yüklendiğinde başlat
        window.addEventListener('load', () => {
            connectWebSocket();
        });

        // Sayfa kapatılırken WebSocket'i kapat
        window.addEventListener('beforeunload', () => {
            if (ws) {
                ws.close();
            }
        });
    </script>
</body>
</html>

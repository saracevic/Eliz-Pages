<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Whale Hunter Pro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
    :root {
        --bg: #0b1120;
        --card-bg: rgba(30, 41, 59, 0.7);
        --border: rgba(255, 255, 255, 0.08);
        --green: #10b981;
        --red: #ef4444;
        --blue: #3b82f6;
        --text: #f1f5f9;
        --text-dim: #94a3b8;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
        background: var(--bg);
        color: var(--text);
        font-family: 'Inter', sans-serif;
        font-size: 13px;
        padding-bottom: 30px;
        overflow-x: hidden;
    }

    /* Arkaplan Efekti */
    body::before {
        content: '';
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background: radial-gradient(circle at 50% 0%, rgba(59, 130, 246, 0.15), transparent 40%);
        pointer-events: none;
        z-index: -1;
    }

    .container { max-width: 800px; margin: 0 auto; padding: 10px; }

    /* TOP BAR - Nasdaq, Fear Index, TR Saati */
    .top-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: var(--card-bg);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 10px 15px;
        margin-bottom: 15px;
        font-family: 'JetBrains Mono', monospace;
        font-size: 11px;
    }

    .nasdaq-info {
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .nasdaq-status {
        padding: 3px 8px;
        border-radius: 6px;
        font-weight: 600;
        font-size: 10px;
    }

    .nasdaq-status.open { background: var(--green); color: #000; }
    .nasdaq-status.closed { background: var(--red); color: #fff; }
    .nasdaq-status.weekend { background: #f59e0b; color: #000; }

    .fear-index {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 4px 10px;
        border-radius: 8px;
        background: rgba(0,0,0,0.3);
        border: 1px solid var(--border);
    }

    .fear-value {
        font-weight: 700;
        font-size: 12px;
    }

    .fear-value.extreme-fear { color: var(--red); }
    .fear-value.fear { color: #f59e0b; }
    .fear-value.neutral { color: #94a3b8; }
    .fear-value.greed { color: #10b981; }
    .fear-value.extreme-greed { color: #22c55e; }

    .tr-time {
        color: var(--text);
        font-weight: 600;
    }

    /* HEADER */
    .header {
        background: var(--card-bg);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 15px;
        margin-bottom: 15px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    }

    .brand { font-size: 18px; font-weight: 800; letter-spacing: -0.5px; background: linear-gradient(to right, #fff, #94a3b8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    
    .status-badge {
        font-family: 'JetBrains Mono', monospace;
        font-size: 10px;
        padding: 4px 8px;
        border-radius: 6px;
        background: rgba(0,0,0,0.3);
        border: 1px solid var(--border);
        display: flex;
        align-items: center;
        gap: 6px;
    }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: #475569; transition: 0.3s; }
    .dot.active { background: var(--green); box-shadow: 0 0 8px var(--green); }

    /* RIGHT SIDEBAR - Fibo ve Hacim Panelleri */
    .right-sidebar {
        position: fixed;
        top: 10px;
        right: 10px;
        width: 600px;
        z-index: 1000;
        display: flex;
        flex-direction: column;
        gap: 10px;
    }

    .sidebar-panel {
        background: var(--card-bg);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 10px;
        box-shadow: 0 8px 25px rgba(0,0,0,0.3);
        max-height: 80vh;
        overflow-y: auto;
    }

    .panel-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 8px;
        padding-bottom: 6px;
        border-bottom: 1px solid var(--border);
    }

    .panel-title {
        font-size: 11px;
        font-weight: 700;
        color: var(--text);
        display: flex;
        align-items: center;
        gap: 4px;
    }

    .panel-refresh {
        background: rgba(59, 130, 246, 0.2);
        border: 1px solid rgba(59, 130, 246, 0.4);
        color: var(--blue);
        padding: 3px 6px;
        border-radius: 4px;
        font-size: 9px;
        cursor: pointer;
        transition: 0.2s;
    }

    .panel-refresh:hover {
        background: rgba(59, 130, 246, 0.3);
    }

    .panel-refresh.loading {
        opacity: 0.6;
        pointer-events: none;
    }

    /* FIBO GRID */
    .fibo-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
    }

    .fibo-section {
        background: rgba(0,0,0,0.2);
        border-radius: 6px;
        padding: 6px;
        border: 1px solid rgba(255,255,255,0.05);
    }

    .fibo-section-title {
        font-size: 9px;
        color: var(--text-dim);
        text-align: center;
        margin-bottom: 4px;
        font-weight: 600;
        padding-bottom: 2px;
        border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    .fibo-coin {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 3px 0;
        border-bottom: 1px solid rgba(255,255,255,0.03);
        font-family: 'JetBrains Mono', monospace;
        font-size: 9px;
        min-height: 18px;
    }

    .fibo-coin:last-child {
        border-bottom: none;
    }

    .fibo-symbol {
        font-weight: 600;
        color: var(--text);
        font-size: 9px;
        min-width: 35px;
    }

    .fibo-details {
        display: flex;
        align-items: center;
        gap: 4px;
        flex-wrap: nowrap;
    }

    .fibo-percent {
        font-weight: 700;
        font-size: 8px;
        min-width: 30px;
        text-align: right;
    }

    .fibo-position {
        font-size: 7px;
        padding: 1px 2px;
        border-radius: 2px;
        font-weight: 600;
        min-width: 40px;
        text-align: center;
    }

    .fibo-position.support {
        background: rgba(16, 185, 129, 0.2);
        color: var(--green);
        border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .fibo-position.resistance {
        background: rgba(239, 68, 68, 0.2);
        color: var(--red);
        border: 1px solid rgba(239, 68, 68, 0.3);
    }

    .fibo-type {
        font-size: 6px;
        color: var(--text-dim);
        background: rgba(59, 130, 246, 0.1);
        padding: 1px 2px;
        border-radius: 2px;
        border: 1px solid rgba(59, 130, 246, 0.3);
    }

    .fibo-percent.close { color: var(--green); }
    .fibo-percent.medium { color: #f59e0b; }
    .fibo-percent.far { color: var(--text-dim); }

    .fibo-loading {
        text-align: center;
        color: var(--text-dim);
        font-size: 9px;
        padding: 8px 0;
        grid-column: 1 / -1;
    }

    .fibo-error {
        text-align: center;
        color: var(--red);
        font-size: 9px;
        padding: 6px 0;
        grid-column: 1 / -1;
    }

    .fibo-stats {
        font-size: 8px;
        color: var(--text-dim);
        text-align: center;
        margin-top: 4px;
        padding-top: 4px;
        border-top: 1px solid var(--border);
        grid-column: 1 / -1;
    }

    /* VOLUME TABLE */
    .volume-table {
        width: 100%;
        border-collapse: collapse;
        font-family: 'JetBrains Mono', monospace;
        font-size: 9px;
    }

    .volume-table th {
        background: rgba(0,0,0,0.3);
        padding: 4px 6px;
        text-align: left;
        font-weight: 600;
        color: var(--text-dim);
        border-bottom: 1px solid var(--border);
        font-size: 8px;
    }

    .volume-table td {
        padding: 3px 6px;
        border-bottom: 1px solid rgba(255,255,255,0.05);
        color: var(--text);
    }

    .volume-table tr:last-child td {
        border-bottom: none;
    }

    .volume-coin {
        font-family: 'Inter';
        font-weight: 600;
        color: #fff;
        font-size: 9px;
    }

    .volume-positive {
        color: var(--green);
        font-weight: 700;
    }

    .volume-negative {
        color: var(--red);
        font-weight: 700;
    }

    .volume-loading {
        text-align: center;
        color: var(--text-dim);
        font-size: 9px;
        padding: 20px 0;
    }

    /* CONTROLS */
    .controls { display: flex; gap: 8px; margin-bottom: 15px; overflow-x: auto; padding-bottom: 5px; }
    .btn {
        background: var(--card-bg); border: 1px solid var(--border); color: var(--text-dim);
        padding: 8px 14px; border-radius: 8px; font-size: 11px; font-weight: 600; cursor: pointer;
        transition: 0.2s; white-space: nowrap;
    }
    .btn.active { background: rgba(59, 130, 246, 0.15); color: var(--blue); border-color: rgba(59, 130, 246, 0.4); }

    /* TABLES */
    .section-title { font-size: 11px; font-weight: 700; color: var(--text-dim); text-transform: uppercase; margin-bottom: 8px; margin-left: 4px; letter-spacing: 0.5px; }
    
    .table-card {
        background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; margin-bottom: 20px;
    }

    table { width: 100%; border-collapse: collapse; }
    th { text-align: left; padding: 10px 12px; font-size: 10px; color: var(--text-dim); background: rgba(0,0,0,0.2); border-bottom: 1px solid var(--border); }
    td { padding: 8px 12px; font-family: 'JetBrains Mono'; font-size: 11px; border-bottom: 1px solid var(--border); color: #e2e8f0; }
    tr:last-child td { border-bottom: none; }
    
    .col-coin { font-family: 'Inter'; font-weight: 600; color: #fff; }
    .text-green { color: var(--green); }
    .text-red { color: var(--red); }
    
    .flash-green { animation: flashG 0.8s; }
    .flash-red { animation: flashR 0.8s; }
    
    @keyframes flashG { 0% { background: rgba(16, 185, 129, 0.2); } 100% { background: transparent; } }
    @keyframes flashR { 0% { background: rgba(239, 68, 68, 0.2); } 100% { background: transparent; } }

    /* 🔔 NOTIFICATION TOASTS (Sağ Üst) */
    .toast-container {
        position: fixed;
        top: 10px;
        right: 620px; /* Sidebar için yer aç */
        z-index: 9999;
        display: flex;
        flex-direction: column;
        gap: 8px;
        pointer-events: none;
    }

    .toast {
        background: rgba(15, 23, 42, 0.95);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid var(--border);
        border-left: 4px solid;
        padding: 10px 14px;
        border-radius: 8px;
        width: 220px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        transform: translateX(120%);
        transition: transform 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.28);
        display: flex;
        flex-direction: column;
    }

    .toast.show { transform: translateX(0); }
    .toast.buy { border-left-color: var(--green); }
    .toast.sell { border-left-color: var(--red); }

    .toast-header { display: flex; justify-content: space-between; margin-bottom: 2px; font-size: 11px; font-weight: 700; }
    .toast-body { display: flex; justify-content: space-between; font-family: 'JetBrains Mono'; font-size: 12px; }

    /* Responsive */
    @media (max-width: 1200px) {
        .right-sidebar {
            position: relative;
            width: 100%;
            max-width: 800px;
            margin: 0 auto 15px auto;
            top: auto;
            right: auto;
        }
        .toast-container {
            right: 10px;
        }
    }

    @media (max-width: 768px) {
        .top-bar {
            flex-direction: column;
            gap: 8px;
            text-align: center;
        }
        .fibo-grid {
            grid-template-columns: 1fr;
        }
    }

</style>
</head>
<body>

<!-- Right Sidebar - Fibo ve Hacim Panelleri -->
<div class="right-sidebar">
    <!-- Fibo Panel -->
    <div class="sidebar-panel">
        <div class="panel-header">
            <div class="panel-title">
                <span>📊 FIBO 0.72</span>
                <span style="color:var(--text-dim); font-size:9px;">1 Aylık</span>
            </div>
            <div class="panel-refresh" id="fiboRefresh">🔄</div>
        </div>
        <div class="fibo-grid" id="fiboContent">
            <div class="fibo-loading">100 coin analiz ediliyor...</div>
        </div>
        <div class="fibo-stats" id="fiboStats"></div>
    </div>

    <!-- Hacim Panel -->
    <div class="sidebar-panel">
        <div class="panel-header">
            <div class="panel-title">
                <span>📈 En Çok Hacim</span>
                <span style="color:var(--text-dim); font-size:9px;">Son 1 Saat</span>
            </div>
        </div>
        <div id="volumeContent">
            <div class="volume-loading">Hacim verileri bekleniyor...</div>
        </div>
    </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<div class="container">
    <!-- TOP BAR: Nasdaq, Fear Index, TR Saati -->
    <div class="top-bar" id="topBar">
        <div class="nasdaq-info">
            <span>NASDAQ:</span>
            <div class="nasdaq-status" id="nasdaqStatus">Yükleniyor...</div>
            <span id="nasdaqCountdown"></span>
        </div>
        <div class="fear-index">
            <span>Korku & Açgözlülük:</span>
            <span class="fear-value" id="fearIndex">-</span>
        </div>
        <div class="tr-time" id="trTime">--:--:--</div>
    </div>

    <div class="header">
        <div>
            <div class="brand">WHALE HUNTER</div>
            <div style="font-size:10px; color: var(--text-dim); margin-top:2px;">Threshold: >$200.000</div>
        </div>
        <div class="status-badge">
            <div class="dot" id="wsDot"></div> LIVE
        </div>
    </div>

    <div class="controls">
        <div class="btn active" id="btnSound">🔔 Ses</div>
        <div class="btn active" id="btnVib">📳 Titreşim</div>
        <div class="btn active" id="btnNotify">💬 Bildirim</div>
    </div>

    <div class="section-title">Canlı Akış (Whales Only)</div>
    <div class="table-card">
        <div style="overflow-x:auto;">
            <table>
                <thead><tr><th>Saat</th><th>Coin</th><th>Yön</th><th>Adet</th><th>Net ($)</th></tr></thead>
                <tbody id="tradesBody">
                    <tr><td colspan="5" style="text-align:center; padding:20px; color:var(--text-dim)">Balinalar bekleniyor...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
(function() {
    'use strict';

    // --- AYARLAR ---
    const MIN_USD = 2000000;
    const COINS = [
        'btcusdt','ethusdt','bnbusdt','solusdt','xrpusdt','adausdt','dogeusdt','avaxusdt',
        'linkusdt','dotusdt','maticusdt','ltcusdt','shibusdt','pepeusdt','bonkusdt',
        'wifusdt','fetusdt','rndrusdt','nearusdt','filusdt','aptusdt','suiusdt','arbusdt',
        'opusdt','tiausdt','injusdt','imxusdt','ftmusdt','flokusdt','seiust','enaust',
        'algousdt','atomusdt','bchusdt','batusdt','compusdt','crvusdt','dashusdt','enjusdt',
        'eosusdt','etcusdt','icpusdt','ksmusdt','lrcusdt','lskusdt','manausdt','neousdt',
        'omgusdt','ontusdt','qtumusdt','rvnusdt','scusdt','snxusdt','storjusdt','sxpusdt',
        'tfuelusdt','thetausdt','vetusdt','wavesusdt','xlmusdt','xtzusdt','zecusdt','zilusdt',
        '1inchusdt','aaveusdt','achusdt','adausdt','akrousdt','alphausdt','ankrusdt','apeusdt',
        'axsusdt','balusdt','bandusdt','blzusdt','celousdt','celrusdt','chzusdt','cotiusdt',
        'cvxusdt','dgbusdt','dydxusdt','egldusdt','ensusdt','fiousdt','flowusdt','galaust',
        'glmusdt','grtusdt','hbarusdt','hotusdt','ilusdt','iostusdt','iotxusdt','jstusdt',
        'kncusdt','ksmusdt','litusdt','loomusdt','lptusdt','lunausdt','manskusdt','mirust'
    ].slice(0, 100); // İlk 100 coin

    // --- TOP BAR SİSTEMİ ---
    
    // TR Saati Güncelleme
    function updateTRTime() {
        const now = new Date();
        const trTime = now.toLocaleTimeString('tr-TR', {
            timeZone: 'Europe/Istanbul',
            hour: '2-digit',
            minute: '2-digit',
            second: '2-digit'
        });
        document.getElementById('trTime').textContent = trTime;
    }

    // Nasdaq Durumu
    function updateNasdaqStatus() {
        const now = new Date();
        const day = now.getDay(); // 0: Pazar, 1: Pazartesi, ..., 6: Cumartesi
        const hour = now.getHours();
        const minute = now.getMinutes();
        
        const statusEl = document.getElementById('nasdaqStatus');
        const countdownEl = document.getElementById('nasdaqCountdown');
        
        // Nasdaq çalışma saatleri: PST timezone (TR'den 10 saat geri)
        // Açılış: 09:30 PST (19:30 TR) - Kapanış: 16:00 PST (02:00 TR ertesi gün)
        let trHour = hour;
        
        // Haftasonu kontrolü
        if (day === 0 || day === 6) {
            statusEl.textContent = 'HAFTA SONU TATİL';
            statusEl.className = 'nasdaq-status weekend';
            countdownEl.textContent = '';
            return;
        }
        
        // Çalışma saatleri kontrolü
        const isOpen = (day >= 1 && day <= 5) && 
                      ((trHour >= 19 && trHour < 24) || (trHour >= 0 && trHour < 2));
        
        if (isOpen) {
            statusEl.textContent = 'AÇIK';
            statusEl.className = 'nasdaq-status open';
            
            // Kapanışa kalan süre hesapla (02:00 TR)
            let hoursLeft = (trHour < 2) ? 1 - trHour : 24 - trHour + 2;
            let minutesLeft = 60 - minute;
            
            if (minutesLeft === 60) {
                minutesLeft = 0;
                hoursLeft++;
            }
            
            countdownEl.textContent = `Kapanış: ${hoursLeft}s ${minutesLeft}d`;
        } else {
            statusEl.textContent = 'KAPALI';
            statusEl.className = 'nasdaq-status closed';
            
            // Açılışa kalan süre hesapla (19:30 TR)
            let hoursLeft, minutesLeft;
            
            if (trHour < 19) {
                hoursLeft = 18 - trHour;
                minutesLeft = 60 - minute;
            } else {
                hoursLeft = 24 - trHour + 18;
                minutesLeft = 60 - minute;
            }
            
            if (minutesLeft === 60) {
                minutesLeft = 0;
                hoursLeft++;
            }
            
            countdownEl.textContent = `Açılış: ${hoursLeft}s ${minutesLeft}d`;
        }
    }

    // Fear & Greed Index
    async function updateFearIndex() {
        try {
            const response = await fetch('https://api.alternative.me/fng/');
            const data = await response.json();
            const fearValue = parseInt(data.data[0].value);
            const fearText = data.data[0].value_classification;
            
            const fearEl = document.getElementById('fearIndex');
            fearEl.textContent = fearValue;
            
            // Renk sınıflarını güncelle
            fearEl.className = 'fear-value';
            if (fearValue <= 25) fearEl.classList.add('extreme-fear');
            else if (fearValue <= 45) fearEl.classList.add('fear');
            else if (fearValue <= 55) fearEl.classList.add('neutral');
            else if (fearValue <= 75) fearEl.classList.add('greed');
            else fearEl.classList.add('extreme-greed');
            
        } catch (error) {
            console.error('Fear index hatası:', error);
            document.getElementById('fearIndex').textContent = 'Hata';
        }
    }

    // --- FIBONACCI SİSTEMİ ---
    let isAnalyzing = false;

    async function fetchFiboData() {
        if (isAnalyzing) return;
        
        isAnalyzing = true;
        const fiboContent = document.getElementById('fiboContent');
        const fiboRefresh = document.getElementById('fiboRefresh');
        const fiboStats = document.getElementById('fiboStats');
        
        fiboRefresh.classList.add('loading');
        fiboContent.innerHTML = '<div class="fibo-loading">100 coin analiz ediliyor...<br><small>Bu biraz zaman alabilir</small></div>';

        try {
            const normalResults = [];
            const reverseResults = [];
            let analyzedCount = 0;
            let errorCount = 0;

            for (let i = 0; i < COINS.length; i += 5) {
                const coinGroup = COINS.slice(i, i + 5);
                
                const promises = coinGroup.map(async (symbol) => {
                    try {
                        // 1 aylık veri (30 gün)
                        const monthlyResponse = await fetch(`https://api.binance.com/api/v3/klines?symbol=${symbol.toUpperCase()}&interval=1d&limit=30`);
                        const monthlyKlines = await monthlyResponse.json();

                        if (monthlyKlines.length > 0) {
                            const monthlyHighs = monthlyKlines.map(k => parseFloat(k[2]));
                            const monthlyLows = monthlyKlines.map(k => parseFloat(k[3]));
                            const monthlyCurrentPrice = parseFloat(monthlyKlines[monthlyKlines.length - 1][4]);
                            
                            const monthlyAth = Math.max(...monthlyHighs);
                            const monthlyLowest = Math.min(...monthlyLows);
                            
                            // NORMAL FIBO: ATH'den en düşüğe
                            const normalFibo72 = monthlyLowest + (monthlyAth - monthlyLowest) * 0.72;
                            const normalDistancePercent = Math.abs((monthlyCurrentPrice - normalFibo72) / normalFibo72) * 100;
                            const normalPosition = monthlyCurrentPrice >= normalFibo72 ? 'resistance' : 'support';
                            
                            // REVERSE FIBO: En düşükten ATH'ye (karşıt fibo)
                            const reverseFibo72 = monthlyAth - (monthlyAth - monthlyLowest) * 0.72;
                            const reverseDistancePercent = Math.abs((monthlyCurrentPrice - reverseFibo72) / reverseFibo72) * 100;
                            const reversePosition = monthlyCurrentPrice >= reverseFibo72 ? 'resistance' : 'support';
                            
                            analyzedCount++;
                            
                            return {
                                symbol: symbol.replace('usdt', '').toUpperCase(),
                                normal: {
                                    fibo72: normalFibo72,
                                    distancePercent: normalDistancePercent,
                                    position: normalPosition,
                                    type: 'normal'
                                },
                                reverse: {
                                    fibo72: reverseFibo72,
                                    distancePercent: reverseDistancePercent,
                                    position: reversePosition,
                                    type: 'reverse'
                                }
                            };
                        }
                    } catch (error) {
                        errorCount++;
                        console.log(`Hata: ${symbol}`, error);
                        return null;
                    }
                });

                const groupResults = await Promise.all(promises);
                const validResults = groupResults.filter(result => result !== null);
                
                validResults.forEach(result => {
                    normalResults.push({
                        symbol: result.symbol,
                        ...result.normal
                    });
                    reverseResults.push({
                        symbol: result.symbol,
                        ...result.reverse
                    });
                });
                
                fiboContent.innerHTML = `<div class="fibo-loading">${analyzedCount}/${COINS.length} coin analiz edildi...<br><small>Lütfen bekleyin</small></div>`;
                
                await new Promise(resolve => setTimeout(resolve, 800));
            }

            // Normal ve reverse sonuçları ayrı ayrı sırala
            normalResults.sort((a, b) => a.distancePercent - b.distancePercent);
            reverseResults.sort((a, b) => a.distancePercent - b.distancePercent);
            
            // En yakın 5 coin'i al
            const topNormal = normalResults.slice(0, 5);
            const topReverse = reverseResults.slice(0, 5);
            
            if (topNormal.length > 0 || topReverse.length > 0) {
                let html = '';
                
                // Normal Fibo Bölümü
                html += `
                    <div class="fibo-section">
                        <div class="fibo-section-title">NORMAL FIBO</div>
                `;
                
                if (topNormal.length > 0) {
                    topNormal.forEach(coin => {
                        let percentClass = 'far';
                        if (coin.distancePercent <= 2) percentClass = 'close';
                        else if (coin.distancePercent <= 5) percentClass = 'medium';
                        
                        html += `
                            <div class="fibo-coin">
                                <span class="fibo-symbol">${coin.symbol}</span>
                                <div class="fibo-details">
                                    <span class="fibo-percent ${percentClass}">%${coin.distancePercent.toFixed(2)}</span>
                                    <span class="fibo-position ${coin.position}">
                                        ${coin.position === 'support' ? 'DESTEK' : 'DİRENÇ'}
                                    </span>
                                </div>
                            </div>
                        `;
                    });
                } else {
                    html += `<div style="text-align:center; color:var(--text-dim); font-size:8px; padding:6px 0;">Veri yok</div>`;
                }
                
                html += `</div>`;
                
                // Reverse Fibo Bölümü
                html += `
                    <div class="fibo-section">
                        <div class="fibo-section-title">KARŞIT FIBO</div>
                `;
                
                if (topReverse.length > 0) {
                    topReverse.forEach(coin => {
                        let percentClass = 'far';
                        if (coin.distancePercent <= 2) percentClass = 'close';
                        else if (coin.distancePercent <= 5) percentClass = 'medium';
                        
                        html += `
                            <div class="fibo-coin">
                                <span class="fibo-symbol">${coin.symbol}</span>
                                <div class="fibo-details">
                                    <span class="fibo-percent ${percentClass}">%${coin.distancePercent.toFixed(2)}</span>
                                    <span class="fibo-position ${coin.position}">
                                        ${coin.position === 'support' ? 'DESTEK' : 'DİRENÇ'}
                                    </span>
                                </div>
                            </div>
                        `;
                    });
                } else {
                    html += `<div style="text-align:center; color:var(--text-dim); font-size:8px; padding:6px 0;">Veri yok</div>`;
                }
                
                html += `</div>`;
                
                fiboContent.innerHTML = html;
                fiboStats.innerHTML = `${analyzedCount} coin tarandı • ${errorCount} hata`;
            } else {
                fiboContent.innerHTML = '<div class="fibo-error">Analiz edilecek coin bulunamadı</div>';
            }
            
        } catch (error) {
            fiboContent.innerHTML = '<div class="fibo-error">Hata: Veri çekilemedi</div>';
            console.error('Fibonacci veri hatası:', error);
        } finally {
            isAnalyzing = false;
            fiboRefresh.classList.remove('loading');
        }
    }

    // Fibonacci panelini yenile
    document.getElementById('fiboRefresh').addEventListener('click', fetchFiboData);

    // --- HACİM TABLOSU GÜNCELLEME ---
    function updateVolumeTable() {
        const volumeContent = document.getElementById('volumeContent');
        
        if (Object.keys(summary).length === 0) {
            volumeContent.innerHTML = '<div class="volume-loading">İşlem bekleniyor...</div>';
            return;
        }

        const sorted = Object.entries(summary)
            .sort((a, b) => Math.abs(b[1].net) - Math.abs(a[1].net))
            .slice(0, 8);

        let html = '<table class="volume-table">';
        html += '<thead><tr><th>Coin</th><th>Net ($)</th></tr></thead><tbody>';
        
        sorted.forEach(([sym, data]) => {
            const netColor = data.net > 0 ? 'volume-positive' : 'volume-negative';
            const netValue = data.net > 0 ? `+$${fmt(data.net)}` : `-$${fmt(Math.abs(data.net))}`;
            
            html += `<tr>
                <td class="volume-coin">${sym}</td>
                <td class="${netColor}">${netValue}</td>
            </tr>`;
        });
        
        html += '</tbody></table>';
        volumeContent.innerHTML = html;
    }

    // --- STATE ---
    let trades = [];
    let summary = {};
    let settings = { sound: true, vib: true, notify: true };
    let audioCtx = null;
    let ws = null;
    
    // DOM Cache
    const els = {
        trades: document.getElementById('tradesBody'),
        toasts: document.getElementById('toastContainer'),
        wsDot: document.getElementById('wsDot')
    };

    // --- SES MOTORU ---
    function initAudio() {
        if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if(audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playSound(type) {
        if(!settings.sound || !audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        
        osc.type = 'sine';
        osc.frequency.setValueAtTime(type === 'BUY' ? 550 : 250, audioCtx.currentTime);
        
        gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
        
        osc.start();
        osc.stop(audioCtx.currentTime + 0.15);
    }

    // --- BİLDİRİM SİSTEMİ (TOAST) ---
    function showToast(coin, side, usd, amount) {
        if(!settings.notify) return;

        const el = document.createElement('div');
        el.className = `toast ${side.toLowerCase()}`;
        
        const icon = side === 'BUY' ? '🟢' : '🔴';
        const formattedUSD = (usd/1000).toFixed(0) + 'K';
        
        el.innerHTML = `
            <div class="toast-header">
                <span>${icon} ${coin}</span>
                <span style="color:var(--text-dim)">${side}</span>
            </div>
            <div class="toast-body">
                <span>${amount} Adet</span>
                <span style="font-weight:700">$${formattedUSD}</span>
            </div>
        `;

        els.toasts.appendChild(el);

        requestAnimationFrame(() => {
            el.classList.add('show');
        });

        setTimeout(() => {
            el.classList.remove('show');
            setTimeout(() => el.remove(), 300);
        }, 3000);

        if(els.toasts.children.length > 3) {
            els.toasts.removeChild(els.toasts.firstChild);
        }
    }

    // --- İŞLEM MANTIĞI ---
    function processTrade(data) {
        const price = parseFloat(data.p);
        const qty = parseFloat(data.q);
        const usd = price * qty;

        if (usd < MIN_USD) return;

        const symbol = data.s.replace('USDT','');
        const side = data.m ? 'SELL' : 'BUY';
        const time = new Date().toLocaleTimeString('tr-TR', {hour:'2-digit', minute:'2-digit', second:'2-digit'});

        trades.unshift({ symbol, side, price, qty, usd, time, id: Date.now() });
        if(trades.length > 40) trades.pop();

        if(!summary[symbol]) summary[symbol] = { buy:0, sell:0, net:0 };
        if(side === 'BUY') {
            summary[symbol].buy += qty;
            summary[symbol].net += usd;
        } else {
            summary[symbol].sell += qty;
            summary[symbol].net -= usd;
        }

        playSound(side);
        if(settings.vib && navigator.vibrate) navigator.vibrate(side === 'BUY' ? 40 : [30,30]);
        
        if(usd > MIN_USD) {
            showToast(symbol, side, usd, qty < 10 ? qty.toFixed(2) : qty.toFixed(0));
        }

        requestRender();
    }

    // --- RENDER (THROTTLE) ---
    let tick = false;
    function requestRender() {
        if(!tick) {
            requestAnimationFrame(() => {
                render();
                tick = false;
            });
            tick = true;
        }
    }

    const fmt = n => new Intl.NumberFormat('en-US', {notation: "compact", maximumFractionDigits: 1}).format(n);

    function render() {
        // 1. Trades
        let html = '';
        trades.slice(0, 15).forEach((t, i) => {
            const color = t.side === 'BUY' ? 'text-green' : 'text-red';
            const anim = i === 0 ? (t.side === 'BUY' ? 'flash-green' : 'flash-red') : '';
            html += `<tr class="${anim}">
                <td style="color:var(--text-dim)">${t.time}</td>
                <td class="col-coin">${t.symbol}</td>
                <td class="${color}" style="font-weight:700">${t.side}</td>
                <td>${t.price < 1 ? t.price.toFixed(4) : t.price.toFixed(2)}</td>
                <td>$${fmt(t.usd)}</td>
            </tr>`;
        });
        els.trades.innerHTML = html;

        // 2. Hacim tablosunu güncelle
        updateVolumeTable();
    }

    // --- SOCKET BAĞLANTISI ---
    function connect() {
        const streams = COINS.map(c => c + '@aggTrade').join('/');
        
        ws = new WebSocket('wss://fstream.binance.com/stream?streams=' + streams);

        ws.onopen = () => {
            els.wsDot.classList.add('active');
            console.log('Connected');
        };

        ws.onmessage = (e) => {
            const msg = JSON.parse(e.data);
            if(msg.stream.includes('@aggTrade')) {
                processTrade(msg.data);
            }
        };

        ws.onclose = () => {
            els.wsDot.classList.remove('active');
            setTimeout(connect, 3000);
        };
    }

    // --- BAŞLATMA ---
    document.getElementById('btnSound').onclick = function() {
        settings.sound = !settings.sound;
        this.classList.toggle('active');
        initAudio();
    };
    document.getElementById('btnVib').onclick = function() {
        settings.vib = !settings.vib;
        this.classList.toggle('active');
    };
    document.getElementById('btnNotify').onclick = function() {
        settings.notify = !settings.notify;
        this.classList.toggle('active');
    };

    // Uygulama başladığında tüm sistemleri başlat
    connect();
    fetchFiboData();
    updateTRTime();
    updateNasdaqStatus();
    updateFearIndex();

    // Zamanlayıcılar
    setInterval(updateTRTime, 1000);
    setInterval(updateNasdaqStatus, 60000);
    setInterval(updateFearIndex, 5 * 60 * 1000); // 5 dakikada bir
    setInterval(fetchFiboData, 10 * 60 * 1000); // 10 dakikada bir

    // Bellek Temizliği
    setInterval(() => {
        if(trades.length > 100) trades = trades.slice(0, 50);
    }, 60000);

})();
</script>
</body>
</html>

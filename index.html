<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coin Sinyal Takip - Çoklu Borsa</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }

        .top-info-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background: linear-gradient(135deg, #2c3e50, #34495e);
            color: white;
            border-bottom: 1px solid #34495e;
        }

        .info-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 200px;
        }

        .info-label {
            font-size: 0.8em;
            opacity: 0.8;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .info-value {
            font-size: 1.2em;
            font-weight: bold;
        }

        .fear-index {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: bold;
            margin-top: 2px;
            font-size: 0.9em;
        }

        .fear-extreme { background: #e74c3c; color: white; }
        .fear-fear { background: #f39c12; color: white; }
        .fear-neutral { background: #f1c40f; color: #2c3e50; }
        .fear-greed { background: #2ecc71; color: white; }
        .fear-extreme-greed { background: #27ae60; color: white; }

        .countdown-timer {
            font-size: 1.3em;
            font-weight: bold;
            color: #3498db;
        }

        .market-open { color: #2ecc71; }
        .market-closed { color: #e74c3c; }
        .turkey-time { font-size: 1.3em; font-weight: bold; color: #9b59b6; }
        
        .header {
            background: linear-gradient(135deg, #2c3e50, #3498db);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 { font-size: 2.5em; margin-bottom: 10px; }
        .header p { opacity: 0.9; font-size: 1.1em; }
        
        .controls {
            padding: 30px;
            background: #f8f9fa;
            border-bottom: 1px solid #e9ecef;
        }
        
        .input-group {
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }
        
        .coin-input, .volume-input {
            padding: 15px 20px;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            font-size: 16px;
        }
        
        .coin-input { flex: 1; min-width: 200px; }
        .volume-input { width: 150px; }

        .exchange-select {
            padding: 15px 20px;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            font-size: 16px;
            background: white;
            cursor: pointer;
            min-width: 180px;
        }
        
        .search-btn {
            background: linear-gradient(135deg, #00b894, #00a085);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .search-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(0, 184, 148, 0.3); }
        .search-btn:disabled { background: #b2bec3; cursor: not-allowed; transform: none; }
        
        .auto-refresh {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 15px;
        }

        .exchange-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.75em;
            font-weight: bold;
            margin-left: 8px;
        }

        .badge-binance { background: #f3ba2f; color: #000; }
        .badge-kraken { background: #5741d9; color: white; }
        .badge-okx { background: #000; color: white; }
        .badge-bybit { background: #f7a600; color: #000; }
        .badge-coinbase { background: #0052ff; color: white; }
        
        .results { 
            padding: 30px;
            overflow-x: hidden;
            word-wrap: break-word;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #636e72;
            font-size: 1.1em;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .signal-card {
            background: white;
            border: 1px solid #e9ecef;
            border-radius: 10px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
            transition: all 0.3s ease;
        }
        
        .signal-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }
        
        .signal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .coin-symbol {
            font-size: 1.4em;
            font-weight: bold;
            color: #2d3436;
        }
        
        .volume-badge {
            background: linear-gradient(135deg, #fd79a8, #e84393);
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9em;
        }
        
        .signal-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }
        
        .detail-item { display: flex; flex-direction: column; }
        .detail-label { font-size: 0.85em; color: #636e72; margin-bottom: 5px; }
        .detail-value { font-size: 1.1em; font-weight: 600; color: #2d3436; }
        
        .error {
            background: #ffeaa7;
            border: 1px solid #fdcb6e;
            color: #e17055;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            margin: 20px 0;
        }
        
        .info-text {
            text-align: center;
            color: #636e72;
            padding: 20px;
            font-style: italic;
        }
        
        .last-update {
            text-align: center;
            color: #636e72;
            font-size: 0.9em;
            margin-bottom: 20px;
        }
        
        .real-badge {
            background: #00b894;
            color: white;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 0.7em;
            margin-left: 8px;
        }

        .high-frequency {
            background: #e17055;
            color: white;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 0.7em;
            margin-left: 8px;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.7; }
            100% { opacity: 1; }
        }

        .notification-btn {
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .notification-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(108, 92, 231, 0.3);
        }

        .notification-btn.enabled {
            background: linear-gradient(135deg, #00b894, #00cec9);
        }

        .notification-btn.disabled {
            background: #b2bec3;
            cursor: not-allowed;
        }

        .notification-status {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ff7675;
        }

        .notification-status.active {
            background: #00b894;
            animation: pulse 2s infinite;
        }

        @media (max-width: 768px) {
            body {
                padding: 10px;
            }
            
            .container {
                border-radius: 10px;
            }

            .top-info-bar {
                flex-direction: column;
                gap: 10px;
                padding: 10px;
            }

            .info-item {
                width: 100%;
                min-width: auto;
            }

            .header h1 {
                font-size: 1.8em;
            }

            .controls {
                padding: 15px;
            }

            .input-group {
                flex-direction: column;
            }

            .coin-input, .volume-input, .exchange-select, .search-btn {
                width: 100%;
            }

            .results {
                padding: 15px;
            }

            .signal-card {
                padding: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-info-bar">
            <div class="info-item">
                <div class="info-label">Korku & Açgözlülük</div>
                <div class="info-value">
                    <span id="fearIndexValue">-</span>
                    <span class="fear-index" id="fearIndexLabel">...</span>
                </div>
            </div>

            <div class="info-item">
                <div class="info-label">Nasdaq Borsası</div>
                <div class="countdown-timer" id="nasdaqCountdown">...</div>
                <div class="info-value" id="nasdaqStatus">-</div>
            </div>

            <div class="info-item">
                <div class="info-label">Türkiye Saati</div>
                <div class="turkey-time" id="turkeyTime">--:--:--</div>
            </div>
        </div>
        
        <div class="header">
            <h1>⚡ Canlı Coin Sinyal Takip</h1>
            <p>Çoklu Borsa - Gerçek Zamanlı Veri</p>
        </div>
        
        <div class="controls">
            <div class="input-group">
                <select class="exchange-select" id="exchangeSelect">
                    <option value="all">🌐 Tüm Borsalar</option>
                    <option value="binance">🟡 Binance</option>
                    <option value="kraken">🟣 Kraken</option>
                    <option value="okx">⚫ OKX</option>
                    <option value="bybit">🟠 Bybit</option>
                    <option value="coinbase">🔵 Coinbase</option>
                </select>
                <input type="text" class="coin-input" placeholder="Coin (BTC, ETH...)" value="BTC">
                <input type="number" class="volume-input" placeholder="Min hacim" value="100000" min="1000" step="1000">
                <button class="search-btn" onclick="searchSignals()">Sinyalleri Getir</button>
            </div>
            <div class="auto-refresh">
                <input type="checkbox" id="autoRefresh" onchange="toggleAutoRefresh()" checked>
                <label for="autoRefresh">Canlı Akış <span class="high-frequency">GERÇEK ZAMANLI</span></label>
                <button class="notification-btn" id="notificationBtn" onclick="toggleNotifications()">
                    <span class="notification-status" id="notificationStatus"></span>
                    <span id="notificationText">Bildirimleri Aç</span>
                </button>
            </div>
        </div>
        
        <div class="results" id="results">
            <div class="info-text">Borsa ve coin seçip butona tıklayın</div>
        </div>
    </div>

    <script>
        // WebSocket URL Yapılandırması - 2025 Güncel Adresler
        const EXCHANGE_CONFIG = {
            binance: {
                name: 'Binance',
                badge: 'badge-binance',
                getWsUrl: (symbol) => `wss://stream.binance.com:9443/ws/${symbol.toLowerCase()}@aggTrade`,
                getRestUrl: (symbol) => `https://api.binance.com/api/v3/trades?symbol=${symbol}&limit=500`,
                parseMessage: (data) => {
                    return {
                        id: data.a + '-' + Date.now(),
                        symbol: data.s,
                        price: parseFloat(data.p),
                        amount: parseFloat(data.q),
                        volume: parseFloat(data.p) * parseFloat(data.q),
                        type: data.m ? 'SELL' : 'BUY',
                        timestamp: data.T
                    };
                },
                supported: true
            },
            kraken: {
                name: 'Kraken',
                badge: 'badge-kraken',
                getWsUrl: () => 'wss://ws.kraken.com/v2',
                supported: true,
                getRestUrl: (symbol) => `https://api.binance.com/api/v3/trades?symbol=${symbol}&limit=200`,
                parseMessage: (data) => {
                    // Kraken için simüle edilmiş veri (gerçek entegrasyon için düzenlenecek)
                    if (data.a) {
                        return {
                            id: data.a + '-' + Date.now(),
                            symbol: data.s,
                            price: parseFloat(data.p),
                            amount: parseFloat(data.q),
                            volume: parseFloat(data.p) * parseFloat(data.q),
                            type: data.m ? 'SELL' : 'BUY',
                            timestamp: data.T
                        };
                    }
                    return null;
                }
            },
            okx: {
                name: 'OKX',
                badge: 'badge-okx',
                getWsUrl: () => 'wss://ws.okx.com:8443/ws/v5/public',
                supported: true,
                getRestUrl: (symbol) => `https://api.binance.com/api/v3/trades?symbol=${symbol}&limit=200`,
                parseMessage: (data) => {
                    if (data.a) {
                        return {
                            id: data.a + '-' + Date.now(),
                            symbol: data.s,
                            price: parseFloat(data.p),
                            amount: parseFloat(data.q),
                            volume: parseFloat(data.p) * parseFloat(data.q),
                            type: data.m ? 'SELL' : 'BUY',
                            timestamp: data.T
                        };
                    }
                    return null;
                }
            },
            bybit: {
                name: 'Bybit',
                badge: 'badge-bybit',
                getWsUrl: () => 'wss://stream.bybit.com/v5/public/linear',
                supported: true,
                getRestUrl: (symbol) => `https://api.binance.com/api/v3/trades?symbol=${symbol}&limit=200`,
                parseMessage: (data) => {
                    if (data.a) {
                        return {
                            id: data.a + '-' + Date.now(),
                            symbol: data.s,
                            price: parseFloat(data.p),
                            amount: parseFloat(data.q),
                            volume: parseFloat(data.p) * parseFloat(data.q),
                            type: data.m ? 'SELL' : 'BUY',
                            timestamp: data.T
                        };
                    }
                    return null;
                }
            },
            coinbase: {
                name: 'Coinbase',
                badge: 'badge-coinbase',
                getWsUrl: () => 'wss://advanced-trade-ws.coinbase.com',
                supported: true,
                getRestUrl: (symbol) => `https://api.binance.com/api/v3/trades?symbol=${symbol}&limit=200`,
                parseMessage: (data) => {
                    if (data.a) {
                        return {
                            id: data.a + '-' + Date.now(),
                            symbol: data.s,
                            price: parseFloat(data.p),
                            amount: parseFloat(data.q),
                            volume: parseFloat(data.p) * parseFloat(data.q),
                            type: data.m ? 'SELL' : 'BUY',
                            timestamp: data.T
                        };
                    }
                    return null;
                }
            }
        };

        let wsConnections = {}; // Çoklu WebSocket bağlantıları
        let currentCoin = 'BTC';
        let currentExchange = 'all';
        let currentMinVolume = 100000;
        let collectedTrades = [];
        let isConnected = false;
        let displayInterval = null;
        let reconnectAttempts = {};
        let notificationsEnabled = false;
        let lastNotificationTime = 0;
        const MAX_TRADES = 50;
        const NOTIFICATION_COOLDOWN = 5000; // 5 saniye

        function getFearIndexClass(value) {
            if (value <= 25) return { class: "fear-extreme", label: "Aşırı Korku" };
            if (value <= 45) return { class: "fear-fear", label: "Korku" };
            if (value <= 55) return { class: "fear-neutral", label: "Nötr" };
            if (value <= 75) return { class: "fear-greed", label: "Açgözlülük" };
            return { class: "fear-extreme-greed", label: "Aşırı Açgözlülük" };
        }

        function updateTurkeyTime() {
            const now = new Date();
            const timeString = now.toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            document.getElementById('turkeyTime').textContent = timeString;
        }

        async function updateFearIndex() {
            try {
                const response = await fetch('https://api.alternative.me/fng/?limit=1');
                const data = await response.json();
                const fearValue = parseInt(data.data[0].value);
                const fearClass = getFearIndexClass(fearValue);
                
                document.getElementById('fearIndexValue').textContent = fearValue;
                const fearLabel = document.getElementById('fearIndexLabel');
                fearLabel.textContent = fearClass.label;
                fearLabel.className = `fear-index ${fearClass.class}`;
            } catch (error) {
                console.error('Fear index hatası:', error);
            }
        }

        function updateNasdaqCountdown() {
            const now = new Date();
            const estTime = new Date(now.toLocaleString("en-US", {timeZone: "America/New_York"}));
            const currentHour = estTime.getHours();
            const isOpen = currentHour >= 9 && currentHour < 16;
            
            document.getElementById('nasdaqStatus').textContent = isOpen ? "AÇIK" : "KAPALI";
            document.getElementById('nasdaqCountdown').className = `countdown-timer ${isOpen ? 'market-open' : 'market-closed'}`;
        }

        // Bildirim Yönetimi
        async function toggleNotifications() {
            const btn = document.getElementById('notificationBtn');
            const status = document.getElementById('notificationStatus');
            const text = document.getElementById('notificationText');

            if (!notificationsEnabled) {
                // Bildirim izni iste
                if ('Notification' in window) {
                    try {
                        const permission = await Notification.requestPermission();
                        if (permission === 'granted') {
                            notificationsEnabled = true;
                            status.classList.add('active');
                            text.textContent = 'Bildirimler Açık';
                            btn.classList.add('enabled');
                            
                            // Test bildirimi
                            showNotification('✅ Bildirimler Aktif', 
                                `${currentMinVolume.toLocaleString()} USD üzeri işlemler için bildirim alacaksınız`);
                        } else {
                            alert('⚠️ Bildirim izni reddedildi. Tarayıcı ayarlarından izin verebilirsiniz.');
                        }
                    } catch (error) {
                        console.error('Bildirim hatası:', error);
                        alert('❌ Bildirimler bu tarayıcıda desteklenmiyor');
                    }
                } else {
                    alert('❌ Bu tarayıcı bildirimleri desteklemiyor');
                }
            } else {
                // Bildirimleri kapat
                notificationsEnabled = false;
                status.classList.remove('active');
                text.textContent = 'Bildirimleri Aç';
                btn.classList.remove('enabled');
            }
        }

        function showNotification(title, body) {
            if (!notificationsEnabled || !('Notification' in window)) return;
            
            // Cooldown kontrolü
            const now = Date.now();
            if (now - lastNotificationTime < NOTIFICATION_COOLDOWN) return;
            lastNotificationTime = now;

            try {
                // Safari için özel kontrol
                if (Notification.permission === 'granted') {
                    const notification = new Notification(title, {
                        body: body,
                        icon: '⚡',
                        badge: '💰',
                        tag: 'crypto-signal',
                        requireInteraction: false,
                        silent: false
                    });

                    // Bildirime tıklandığında
                    notification.onclick = () => {
                        window.focus();
                        notification.close();
                    };

                    // 5 saniye sonra kapat
                    setTimeout(() => notification.close(), 5000);
                }
            } catch (error) {
                console.error('Bildirim gösterme hatası:', error);
            }
        }

        function connectWebSocket(symbol, exchangeName) {
            const config = EXCHANGE_CONFIG[exchangeName];
            
            if (!config.supported) {
                console.log('⚠️', config.name, 'için WebSocket henüz desteklenmiyor');
                return;
            }

            // Önceki bağlantıyı kapat
            if (wsConnections[exchangeName] && wsConnections[exchangeName].readyState === WebSocket.OPEN) {
                wsConnections[exchangeName].close();
            }

            const wsUrl = config.getWsUrl(symbol);
            console.log('🔌 Bağlanıyor:', config.name, symbol);
            
            wsConnections[exchangeName] = new WebSocket(wsUrl);

            wsConnections[exchangeName].onopen = () => {
                console.log('✅', config.name, 'canlı bağlantı kuruldu');
                if (!reconnectAttempts[exchangeName]) reconnectAttempts[exchangeName] = 0;
                reconnectAttempts[exchangeName] = 0;
                updateConnectionStatus();
            };

            wsConnections[exchangeName].onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    const signal = config.parseMessage(data);
                    
                    if (signal && signal.volume >= currentMinVolume) {
                        signal.exchange = exchangeName;
                        signal.isLargeOrder = signal.volume > currentMinVolume * 3;
                        
                        collectedTrades.unshift(signal);
                        
                        if (collectedTrades.length > MAX_TRADES) {
                            collectedTrades = collectedTrades.slice(0, MAX_TRADES);
                        }
                        
                        console.log('💰', config.name, signal.type, signal.volume.toFixed(0), 'USD');
                        
                        // Büyük işlemler için bildirim
                        if (signal.isLargeOrder && notificationsEnabled) {
                            const volumeText = signal.volume >= 1000000 ? 
                                (signal.volume / 1000000).toFixed(2) + 'M USD' : 
                                (signal.volume / 1000).toFixed(0) + 'K USD';
                            
                            showNotification(
                                `⚡ ${config.name} - ${signal.type}`,
                                `${signal.symbol}: ${volumeText} işlem tespit edildi!`
                            );
                        }
                    }
                } catch (error) {
                    console.error('Parse hatası:', exchangeName, error);
                }
            };

            wsConnections[exchangeName].onerror = (error) => {
                console.error('❌', config.name, 'WebSocket hatası:', error);
                updateConnectionStatus();
            };

            wsConnections[exchangeName].onclose = () => {
                console.log('📴', config.name, 'bağlantı kapandı');
                updateConnectionStatus();
                
                if (!reconnectAttempts[exchangeName]) reconnectAttempts[exchangeName] = 0;
                
                // Otomatik yeniden bağlanma (max 5 deneme)
                if (reconnectAttempts[exchangeName] < 5 && document.getElementById('autoRefresh').checked) {
                    reconnectAttempts[exchangeName]++;
                    setTimeout(() => {
                        console.log('🔄', config.name, 'yeniden bağlanıyor... (' + reconnectAttempts[exchangeName] + '/5)');
                        connectWebSocket(currentCoin.toUpperCase() + 'USDT', exchangeName);
                    }, 3000);
                }
            };
        }

        function updateConnectionStatus() {
            // Tüm bağlantıları kontrol et
            let anyConnected = false;
            for (let exchange in wsConnections) {
                if (wsConnections[exchange] && wsConnections[exchange].readyState === WebSocket.OPEN) {
                    anyConnected = true;
                    break;
                }
            }
            isConnected = anyConnected;
        }

        function connectAllExchanges(symbol) {
            // Tüm desteklenen borsalara bağlan
            for (let exchangeName in EXCHANGE_CONFIG) {
                const config = EXCHANGE_CONFIG[exchangeName];
                if (config.supported) {
                    connectWebSocket(symbol, exchangeName);
                }
            }
        }

        function disconnectAllExchanges() {
            // Tüm bağlantıları kapat
            for (let exchange in wsConnections) {
                if (wsConnections[exchange] && wsConnections[exchange].readyState === WebSocket.OPEN) {
                    wsConnections[exchange].close();
                }
            }
            wsConnections = {};
            isConnected = false;
        }

        async function loadInitialData(symbol) {
            try {
                // "Tüm Borsalar" seçiliyse sadece Binance'den yükle
                const exchangeToLoad = currentExchange === 'all' ? 'binance' : currentExchange;
                const config = EXCHANGE_CONFIG[exchangeToLoad];
                
                if (!config.supported) {
                    showError(`${config.name} için veri yükleme henüz desteklenmiyor. Lütfen Binance veya "Tüm Borsalar" seçin.`);
                    return 0;
                }

                const response = await fetch(config.getRestUrl(symbol));
                
                if (!response.ok) {
                    throw new Error('Geçersiz coin sembolü');
                }

                const trades = await response.json();
                const signals = trades
                    .map(trade => {
                        const volume = parseFloat(trade.quoteQty) || (parseFloat(trade.price) * parseFloat(trade.qty));
                        return {
                            id: trade.id,
                            symbol: symbol,
                            exchange: exchangeToLoad,
                            volume: volume,
                            price: parseFloat(trade.price),
                            amount: parseFloat(trade.qty),
                            type: trade.isBuyerMaker ? 'SELL' : 'BUY',
                            timestamp: trade.time,
                            isLargeOrder: volume > currentMinVolume * 3
                        };
                    })
                    .filter(s => s.volume >= currentMinVolume)
                    .slice(0, MAX_TRADES);

                collectedTrades = signals;
                return signals.length;
            } catch (error) {
                throw error;
            }
        }

        async function searchSignals() {
            const coinInput = document.querySelector('.coin-input');
            const volumeInput = document.querySelector('.volume-input');
            const exchangeSelect = document.getElementById('exchangeSelect');
            const searchBtn = document.querySelector('.search-btn');
            const resultsDiv = document.getElementById('results');
            
            currentCoin = coinInput.value.trim().toUpperCase().replace(/[^a-zA-Z0-9]/g, '');
            currentMinVolume = parseInt(volumeInput.value);
            currentExchange = exchangeSelect.value;
            
            if (!currentCoin) {
                showError('Lütfen coin sembolü girin');
                return;
            }

            const exchangeName = currentExchange === 'all' ? 'Tüm Borsalar' : EXCHANGE_CONFIG[currentExchange].name;

            searchBtn.disabled = true;
            searchBtn.textContent = 'BAĞLANIYOR...';
            resultsDiv.innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <div>${exchangeName} - ${currentCoin} için bağlantı kuruluyor...</div>
                </div>
            `;
            
            try {
                const symbol = currentCoin + 'USDT';
                
                const count = await loadInitialData(symbol);
                
                if (count === 0) {
                    showError(`${currentMinVolume.toLocaleString()} USD üzeri işlem bulunamadı. Daha düşük bir değer deneyin.`);
                    return;
                }
                
                // WebSocket bağlantılarını başlat
                disconnectAllExchanges(); // Önce tüm bağlantıları kapat
                
                if (currentExchange === 'all') {
                    // Tüm borsalara bağlan
                    connectAllExchanges(symbol);
                    console.log('🌐 Tüm borsalara bağlanılıyor...');
                } else {
                    // Sadece seçili borsaya bağlan
                    connectWebSocket(symbol, currentExchange);
                }
                
                if (displayInterval) {
                    clearInterval(displayInterval);
                }
                
                displayInterval = setInterval(() => {
                    if (collectedTrades.length > 0) {
                        displayResults();
                    }
                }, 500);
                
                displayResults();
                
            } catch (error) {
                console.error('Hata:', error);
                showError('Hata: ' + error.message);
            } finally {
                searchBtn.disabled = false;
                searchBtn.textContent = 'Sinyalleri Getir';
            }
        }
        
        function displayResults() {
            const resultsDiv = document.getElementById('results');
            const signals = collectedTrades;
            
            // Bağlantı durumu
            let connectedExchanges = [];
            for (let exchange in wsConnections) {
                if (wsConnections[exchange] && wsConnections[exchange].readyState === WebSocket.OPEN) {
                    connectedExchanges.push(EXCHANGE_CONFIG[exchange].name);
                }
            }
            
            const statusIcon = isConnected ? '🟢' : '🔴';
            const statusText = isConnected ? 'CANLI' : 'BAĞLANTI KESİK';
            const exchangeText = currentExchange === 'all' ? 
                `Tüm Borsalar (${connectedExchanges.length} aktif)` : 
                EXCHANGE_CONFIG[currentExchange].name;
            
            let html = `
                <div class="last-update">
                    ${statusIcon} ${new Date().toLocaleTimeString('tr-TR')} 
                    <span class="high-frequency">${statusText}</span>
                    ${currentExchange === 'all' && connectedExchanges.length > 0 ? 
                        `<span class="exchange-badge badge-binance">${connectedExchanges.join(', ')}</span>` : 
                        `<span class="exchange-badge ${EXCHANGE_CONFIG[currentExchange === 'all' ? 'binance' : currentExchange].badge}">${exchangeText}</span>`
                    }
                </div>
                <div style="margin-bottom: 20px; font-size: 1.1em; color: #2d3436;">
                    <strong>${currentCoin}</strong> için <strong>${currentMinVolume.toLocaleString()} USD</strong> üzeri 
                    <strong>${signals.length}</strong> sinyal
                    <span class="real-badge">GERÇEK ZAMANLI</span>
                    ${notificationsEnabled ? '<span class="real-badge" style="background: #6c5ce7;">🔔 BİLDİRİM AÇIK</span>' : ''}
                </div>
            `;
            
            signals.forEach(signal => {
                const date = new Date(signal.timestamp);
                const volumeFormatted = signal.volume >= 1000000 ? 
                    (signal.volume / 1000000).toFixed(2) + 'M USD' : 
                    (signal.volume / 1000).toFixed(1) + 'K USD';
                
                const timeAgo = Math.floor((Date.now() - signal.timestamp) / 1000);
                const timeText = timeAgo < 60 ? `${timeAgo}s önce` : 
                                 timeAgo < 3600 ? `${Math.floor(timeAgo/60)}dk önce` : 
                                 date.toLocaleTimeString('tr-TR');
                
                const exchangeConfig = EXCHANGE_CONFIG[signal.exchange || currentExchange];
                
                html += `
                    <div class="signal-card" style="border-left: 4px solid ${signal.type === 'BUY' ? '#00b894' : '#e17055'}">
                        <div class="signal-header">
                            <div class="coin-symbol">
                                ${signal.symbol} ${signal.isLargeOrder ? '⚡' : '✅'}
                                <span class="exchange-badge ${exchangeConfig.badge}">${exchangeConfig.name}</span>
                                ${timeAgo < 5 ? '<span class="high-frequency">YENİ</span>' : ''}
                            </div>
                            <div class="volume-badge">${volumeFormatted}</div>
                        </div>
                        <div class="signal-details">
                            <div class="detail-item">
                                <span class="detail-label">İşlem</span>
                                <span class="detail-value" style="color: ${signal.type === 'BUY' ? '#00b894' : '#e17055'}">
                                    ${signal.type === 'BUY' ? '🟢 ALIM' : '🔴 SATIM'}
                                </span>
                            </div>
                            <div class="detail-item">
                                <span class="detail-label">Fiyat</span>
                                <span class="detail-value">${signal.price.toFixed(2)} USD</span>
                            </div>
                            <div class="detail-item">
                                <span class="detail-label">Miktar</span>
                                <span class="detail-value">${signal.amount.toFixed(4)} ${currentCoin}</span>
                            </div>
                            <div class="detail-item">
                                <span class="detail-label">Zaman</span>
                                <span class="detail-value">${timeText}</span>
                            </div>
                        </div>
                    </div>
                `;
            });
            
            resultsDiv.innerHTML = html;
        }
        
        function toggleAutoRefresh() {
            const checkbox = document.getElementById('autoRefresh');
            
            if (!checkbox.checked) {
                disconnectAllExchanges();
                if (displayInterval) {
                    clearInterval(displayInterval);
                    displayInterval = null;
                }
                isConnected = false;
            } else {
                if (currentCoin && collectedTrades.length > 0) {
                    const symbol = currentCoin + 'USDT';
                    
                    if (currentExchange === 'all') {
                        connectAllExchanges(symbol);
                    } else {
                        connectWebSocket(symbol, currentExchange);
                    }
                    
                    if (!displayInterval) {
                        displayInterval = setInterval(() => {
                            if (collectedTrades.length > 0) {
                                displayResults();
                            }
                        }, 500);
                    }
                }
            }
        }
        
        function showError(message) {
            document.getElementById('results').innerHTML = `<div class="error">❌ ${message}</div>`;
        }
        
        document.querySelector('.coin-input').addEventListener('keypress', e => {
            if (e.key === 'Enter') searchSignals();
        });
        
        window.addEventListener('load', () => {
            updateTurkeyTime();
            updateFearIndex();
            updateNasdaqCountdown();
            
            setInterval(updateTurkeyTime, 1000);
            setInterval(updateFearIndex, 300000);
            setInterval(updateNasdaqCountdown, 60000);
            
            setTimeout(() => {
                searchSignals();
            }, 500);
        });

        window.addEventListener('beforeunload', () => {
            disconnectAllExchanges();
            if (displayInterval) {
                clearInterval(displayInterval);
            }
        });

        // Safari için özel bildirim desteği kontrolü
        window.addEventListener('load', () => {
            updateTurkeyTime();
            updateFearIndex();
            updateNasdaqCountdown();
            
            setInterval(updateTurkeyTime, 1000);
            setInterval(updateFearIndex, 300000);
            setInterval(updateNasdaqCountdown, 60000);
            
            // Bildirim desteği kontrolü
            if ('Notification' in window) {
                console.log('✅ Bildirimler destekleniyor');
                
                // Safari için özel kontrol
                if (Notification.permission === 'granted') {
                    document.getElementById('notificationStatus').classList.add('active');
                    document.getElementById('notificationText').textContent = 'Bildirimler Açık';
                    document.getElementById('notificationBtn').classList.add('enabled');
                    notificationsEnabled = true;
                }
            } else {
                console.log('⚠️ Bildirimler desteklenmiyor');
                document.getElementById('notificationBtn').classList.add('disabled');
                document.getElementById('notificationBtn').disabled = true;
            }
            
            setTimeout(() => {
                searchSignals();
            }, 500);
        });
    </script>
</body>
</html>

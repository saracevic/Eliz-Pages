<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coin Sinyal Takip - Sadece Gerçek Veri</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #2c3e50, #3498db);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .header p {
            opacity: 0.9;
            font-size: 1.1em;
        }
        
        .controls {
            padding: 30px;
            background: #f8f9fa;
            border-bottom: 1px solid #e9ecef;
        }
        
        .input-group {
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }
        
        .coin-input {
            flex: 1;
            min-width: 200px;
            padding: 15px 20px;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s ease;
        }
        
        .coin-input:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.1);
        }
        
        .volume-input {
            width: 150px;
            padding: 15px 20px;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            font-size: 16px;
        }
        
        .search-btn {
            background: linear-gradient(135deg, #00b894, #00a085);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .search-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 184, 148, 0.3);
        }
        
        .search-btn:disabled {
            background: #b2bec3;
            cursor: not-allowed;
            transform: none;
        }
        
        .auto-refresh {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 15px;
        }
        
        .results {
            padding: 30px;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #636e72;
            font-size: 1.1em;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .signal-card {
            background: white;
            border: 1px solid #e9ecef;
            border-radius: 10px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
            transition: all 0.3s ease;
        }
        
        .signal-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }
        
        .signal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .coin-symbol {
            font-size: 1.4em;
            font-weight: bold;
            color: #2d3436;
        }
        
        .volume-badge {
            background: linear-gradient(135deg, #fd79a8, #e84393);
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9em;
        }
        
        .signal-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }
        
        .detail-item {
            display: flex;
            flex-direction: column;
        }
        
        .detail-label {
            font-size: 0.85em;
            color: #636e72;
            margin-bottom: 5px;
        }
        
        .detail-value {
            font-size: 1.1em;
            font-weight: 600;
            color: #2d3436;
        }
        
        .error {
            background: #ffeaa7;
            border: 1px solid #fdcb6e;
            color: #e17055;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            margin: 20px 0;
        }
        
        .info-text {
            text-align: center;
            color: #636e72;
            padding: 20px;
            font-style: italic;
        }
        
        .last-update {
            text-align: center;
            color: #636e72;
            font-size: 0.9em;
            margin-bottom: 20px;
        }
        
        .real-badge {
            background: #00b894;
            color: white;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 0.7em;
            margin-left: 8px;
        }

        .countdown {
            background: #3498db;
            color: white;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 0.7em;
            margin-left: 8px;
        }

        .high-frequency {
            background: #e17055;
            color: white;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 0.7em;
            margin-left: 8px;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.7; }
            100% { opacity: 1; }
        }

        @media (max-width: 768px) {
            .container {
                margin: 10px;
            }
            
            .header h1 {
                font-size: 2em;
            }
            
            .input-group {
                flex-direction: column;
            }
            
            .coin-input, .volume-input, .search-btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⚡ Canlı Coin Sinyal Takip</h1>
            <p>Sadece Gerçek 100K+ İşlem Sinyalleri - SANİYEDE 1 Güncel</p>
        </div>
        
        <div class="controls">
            <div class="input-group">
                <input 
                    type="text" 
                    class="coin-input" 
                    placeholder="Coin sembolü girin (Örnek: BTC, ETH, ADA...)" 
                    value="BTC"
                >
                <input 
                    type="number" 
                    class="volume-input" 
                    placeholder="Min hacim" 
                    value="100000"
                    min="1000"
                    step="1000"
                >
                <button class="search-btn" onclick="searchSignals()">
                    Gerçek Sinyalleri Getir
                </button>
            </div>
            <div class="auto-refresh">
                <input type="checkbox" id="autoRefresh" onchange="toggleAutoRefresh()" checked>
                <label for="autoRefresh">SANIYEDE 1 yenile - <span id="countdown">1</span>s <span class="high-frequency">YÜKSEK HIZ</span></label>
            </div>
        </div>
        
        <div class="results" id="results">
            <div class="info-text">
                Coin sembolünü girip "Gerçek Sinyalleri Getir" butonuna tıklayın
            </div>
        </div>
    </div>

    <script>
        let autoRefreshInterval = null;
        let countdownInterval = null;
        let currentCoin = 'BTC';
        let currentMinVolume = 100000;
        let countdownValue = 1;

        function updateCountdown() {
            const countdownElement = document.getElementById('countdown');
            if (countdownElement) {
                countdownElement.textContent = countdownValue;
            }
        }

        function startCountdown() {
            countdownValue = 1;
            updateCountdown();
            
            if (countdownInterval) {
                clearInterval(countdownInterval);
            }
            
            countdownInterval = setInterval(() => {
                countdownValue--;
                updateCountdown();
                
                if (countdownValue <= 0) {
                    countdownValue = 1;
                    updateCountdown();
                }
            }, 1000);
        }

        function stopCountdown() {
            if (countdownInterval) {
                clearInterval(countdownInterval);
                countdownInterval = null;
            }
            const countdownElement = document.getElementById('countdown');
            if (countdownElement) {
                countdownElement.textContent = '1';
            }
        }

        async function searchSignals() {
            const coinInput = document.querySelector('.coin-input');
            const volumeInput = document.querySelector('.volume-input');
            const searchBtn = document.querySelector('.search-btn');
            const resultsDiv = document.getElementById('results');
            
            currentCoin = coinInput.value.trim().toUpperCase();
            currentMinVolume = parseInt(volumeInput.value);
            
            if (!currentCoin) {
                showError('Lütfen bir coin sembolü girin');
                return;
            }
            
            // Butonu devre dışı bırak ve loading göster
            searchBtn.disabled = true;
            searchBtn.textContent = 'GERÇEK ZAMANLI...';
            resultsDiv.innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <div>${currentCoin} için ${currentMinVolume.toLocaleString()} USD üzeri GERÇEK ZAMANLI sinyaller aranıyor...</div>
                </div>
            `;
            
            try {
                // SADECE gerçek API'den veri al
                const signals = await getRealTimeSignals(currentCoin, currentMinVolume);
                displayResults(signals, currentCoin, currentMinVolume);
            } catch (error) {
                showError('Gerçek sinyaller alınırken hata oluştu: ' + error.message);
            } finally {
                // Butonu tekrar aktif et
                searchBtn.disabled = false;
                searchBtn.textContent = 'Gerçek Sinyalleri Getir';
            }
        }
        
        async function getRealTimeSignals(coinSymbol, minVolume) {
            try {
                const symbol = coinSymbol + 'USDT';
                
                console.log(`${symbol} için gerçek zamanlı veri alınıyor...`);

                // 1. Önce sembolün geçerli olup olmadığını kontrol et
                const exchangeInfoResponse = await fetch(`https://cors.aggr.trade/https://api.binance.com/api/v3/exchangeInfo?symbol=${symbol}`);
                const exchangeInfo = await exchangeInfoResponse.json();
                
                if (exchangeInfo.msg && exchangeInfo.msg.includes('Invalid symbol')) {
                    throw new Error(`Geçersiz sembol: ${coinSymbol}. Lütfen BTC, ETH, ADA gibi geçerli bir coin girin.`);
                }

                // 2. Daha fazla işlem almak için limiti artır (max 1000)
                const tradesResponse = await fetch(`https://cors.aggr.trade/https://api.binance.com/api/v3/trades?symbol=${symbol}&limit=1000`);
                const trades = await tradesResponse.json();

                if (!trades || trades.length === 0) {
                    throw new Error(`${symbol} için işlem verisi bulunamadı`);
                }

                console.log(`${trades.length} adet işlem alındı`);

                // 3. SADECE gerçek büyük işlemleri filtrele
                const realSignals = trades
                    .filter(trade => {
                        // Gerçek hacmi hesapla
                        const volume = parseFloat(trade.quoteQty) || (parseFloat(trade.price) * parseFloat(trade.qty));
                        return volume >= minVolume;
                    })
                    .map(trade => {
                        const volume = parseFloat(trade.quoteQty) || (parseFloat(trade.price) * parseFloat(trade.qty));
                        return {
                            id: trade.id,
                            symbol: trade.symbol,
                            volume: volume,
                            price: parseFloat(trade.price),
                            amount: parseFloat(trade.qty),
                            type: trade.isBuyerMaker ? 'SELL' : 'BUY',
                            timestamp: new Date(trade.time).toISOString(),
                            isLargeOrder: volume > minVolume * 3,
                            isReal: true // GERÇEK veri olduğunu işaretle
                        };
                    })
                    .sort((a, b) => b.volume - a.volume);

                console.log(`${realSignals.length} adet büyük işlem bulundu`);

                return realSignals;
                
            } catch (error) {
                console.error('Gerçek API Hatası:', error);
                throw error;
            }
        }
        
        function displayResults(signals, coinSymbol, minVolume) {
            const resultsDiv = document.getElementById('results');
            
            if (signals.length === 0) {
                resultsDiv.innerHTML = `
                    <div class="info-text">
                        ⚠️ ${coinSymbol} için ${minVolume.toLocaleString()} USD üzeri GERÇEK sinyal bulunamadı<br>
                        <small>Daha düşük hacim değeri deneyin veya başka bir coin seçin</small>
                    </div>
                `;
                return;
            }
            
            let html = `
                <div class="last-update">
                    ⚡ GERÇEK ZAMANLI: ${new Date().toLocaleTimeString('tr-TR')} - TÜM VERİLER GERÇEK
                    <span class="high-frequency">SANİYEDE 1</span>
                </div>
                <div style="margin-bottom: 20px; font-size: 1.1em; color: #2d3436;">
                    <strong>${coinSymbol}</strong> için <strong>${minVolume.toLocaleString()} USD</strong> üzeri 
                    <strong>${signals.length}</strong> GERÇEK ZAMANLI sinyal bulundu
                    <span class="real-badge">GERÇEK ZAMANLI</span>
                </div>
            `;
            
            signals.forEach(signal => {
                const date = new Date(signal.timestamp);
                const volumeFormatted = formatVolume(signal.volume);
                const priceFormatted = formatPrice(signal.price);
                const amountFormatted = formatAmount(signal.amount);
                const timeAgo = getTimeAgo(signal.timestamp);
                
                html += `
                    <div class="signal-card" style="${signal.isLargeOrder ? 'border-left: 4px solid #e17055; background: #fff9f8;' : 'border-left: 4px solid #00b894;'}">
                        <div class="signal-header">
                            <div class="coin-symbol">
                                ${signal.symbol}
                                ${signal.isLargeOrder ? ' ⚡' : ' ✅'}
                                <span class="real-badge">GERÇEK ZAMANLI</span>
                            </div>
                            <div class="volume-badge">${volumeFormatted}</div>
                        </div>
                        <div class="signal-details">
                            <div class="detail-item">
                                <span class="detail-label">İşlem Türü</span>
                                <span class="detail-value" style="color: ${signal.type === 'BUY' ? '#00b894' : '#e17055'}">
                                    ${signal.type === 'BUY' ? '🟢 ALIM' : '🔴 SATIM'}
                                    ${signal.isLargeOrder ? ' (BÜYÜK İŞLEM)' : ''}
                                </span>
                            </div>
                            <div class="detail-item">
                                <span class="detail-label">Fiyat</span>
                                <span class="detail-value">${priceFormatted} USD</span>
                            </div>
                            <div class="detail-item">
                                <span class="detail-label">Miktar</span>
                                <span class="detail-value">${amountFormatted} ${coinSymbol}</span>
                            </div>
                            <div class="detail-item">
                                <span class="detail-label">Zaman</span>
                                <span class="detail-value">${date.toLocaleTimeString('tr-TR')}<br><small>(${timeAgo})</small></span>
                            </div>
                        </div>
                    </div>
                `;
            });
            
            resultsDiv.innerHTML = html;

            // Otomatik yenileme aktifse countdown'u başlat
            const autoRefreshCheckbox = document.getElementById('autoRefresh');
            if (autoRefreshCheckbox && autoRefreshCheckbox.checked) {
                startCountdown();
            }
        }
        
        function getTimeAgo(timestamp) {
            const now = new Date();
            const signalTime = new Date(timestamp);
            const diffMs = now - signalTime;
            const diffSecs = Math.floor(diffMs / 1000);
            const diffMins = Math.floor(diffMs / 60000);
            
            if (diffSecs < 60) return `${diffSecs} saniye önce`;
            if (diffMins < 60) return `${diffMins} dakika önce`;
            return `${Math.floor(diffMins / 60)} saat önce`;
        }
        
        function toggleAutoRefresh() {
            const autoRefreshCheckbox = document.getElementById('autoRefresh');
            
            if (autoRefreshCheckbox.checked) {
                // 1 SANİYE olarak ayarlandı
                autoRefreshInterval = setInterval(() => {
                    searchSignals();
                }, 1000); // 1 SANİYE
                startCountdown();
            } else {
                if (autoRefreshInterval) {
                    clearInterval(autoRefreshInterval);
                    autoRefreshInterval = null;
                }
                stopCountdown();
            }
        }
        
        function showError(message) {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = `
                <div class="error">
                    ❌ ${message}
                </div>
            `;
        }
        
        function formatVolume(volume) {
            if (volume >= 1000000) {
                return (volume / 1000000).toFixed(2) + 'M USD';
            } else if (volume >= 1000) {
                return (volume / 1000).toFixed(1) + 'K USD';
            }
            return volume.toFixed(0) + ' USD';
        }
        
        function formatPrice(price) {
            return price.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 8 });
        }
        
        function formatAmount(amount) {
            if (amount >= 1) {
                return amount.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 4 });
            }
            return amount.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 8 });
        }
        
        // Enter tuşu ile arama yapma
        document.querySelector('.coin-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                searchSignals();
            }
        });
        
        document.querySelector('.volume-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                searchSignals();
            }
        });
        
        // Sayfa yüklendiğinde otomatik arama
        window.addEventListener('load', function() {
            // Otomatik yenilemeyi başlat
            const autoRefreshCheckbox = document.getElementById('autoRefresh');
            if (autoRefreshCheckbox) {
                autoRefreshCheckbox.checked = true;
                toggleAutoRefresh();
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Milyoner 2025 - Bilgi Yarışması</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        .game-container {
            max-width: 500px;
            width: 95%;
            background: rgba(0, 0, 20, 0.9);
            border-radius: 20px;
            box-shadow: 0 0 50px rgba(255, 215, 0, 0.3);
            overflow: hidden;
            position: relative;
        }

        /* Konfeti Animasyonu */
        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            background: gold;
            position: absolute;
            animation: confetti-fall 3s linear;
            opacity: 0;
        }

        @keyframes confetti-fall {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
        }

        /* Üst Bar - Para Durumu */
        .top-bar {
            background: linear-gradient(90deg, #FFB800 0%, #FFA000 100%);
            padding: 15px;
            text-align: center;
            position: relative;
            border-bottom: 3px solid #FF8C00;
        }

        .money-display {
            font-size: 28px;
            font-weight: bold;
            color: #000;
            text-shadow: 1px 1px 2px rgba(255, 255, 255, 0.5);
        }

        .question-number {
            font-size: 16px;
            color: #4A0000;
            margin-top: 5px;
        }

        /* Soru Alanı */
        .question-area {
            padding: 30px 20px;
            text-align: center;
        }

        .question-text {
            font-size: 22px;
            color: #fff;
            line-height: 1.5;
            margin-bottom: 30px;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Joker Butonları */
        .jokers {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .joker-btn {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: 3px solid #fff;
            background: rgba(42, 82, 152, 0.8);
            color: #fff;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .joker-btn:hover {
            transform: scale(1.1);
            background: rgba(255, 215, 0, 0.3);
        }

        .joker-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            background: rgba(100, 100, 100, 0.5);
        }

        .joker-btn:disabled::after {
            content: "❌";
            position: absolute;
            font-size: 40px;
        }

        .joker-icon {
            font-size: 24px;
            margin-bottom: 5px;
        }

        /* Cevap Butonları */
        .answers {
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding: 0 20px 30px;
        }

        .answer-btn {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            border: 3px solid #4A90E2;
            border-radius: 15px;
            padding: 18px;
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: left;
            position: relative;
            overflow: hidden;
        }

        .answer-btn:hover {
            border-color: #FFD700;
            transform: translateX(5px);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
        }

        .answer-btn.correct {
            background: linear-gradient(135deg, #00C851 0%, #007E33 100%);
            border-color: #00FF00;
            animation: pulse 0.5s;
        }

        .answer-btn.wrong {
            background: linear-gradient(135deg, #ff4444 0%, #cc0000 100%);
            border-color: #FF0000;
            animation: shake 0.5s;
        }

        .answer-btn.eliminated {
            opacity: 0.3;
            pointer-events: none;
            background: #333;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        /* Başlangıç ve Bitiş Ekranları */
        .screen {
            display: none;
            padding: 40px 20px;
            text-align: center;
            color: #fff;
        }

        .screen.active {
            display: block;
        }

        .screen h1 {
            font-size: 36px;
            margin-bottom: 20px;
            color: #FFD700;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        .screen p {
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .start-btn, .restart-btn {
            background: linear-gradient(90deg, #FFB800 0%, #FFA000 100%);
            border: none;
            border-radius: 50px;
            padding: 15px 40px;
            font-size: 20px;
            font-weight: bold;
            color: #000;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(255, 184, 0, 0.4);
        }

        .start-btn:hover, .restart-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 8px 25px rgba(255, 184, 0, 0.6);
        }

        .final-amount {
            font-size: 48px;
            color: #00FF00;
            margin: 20px 0;
            text-shadow: 0 0 20px rgba(0, 255, 0, 0.8);
        }

        /* Responsive */
        @media (max-width: 400px) {
            .question-text {
                font-size: 18px;
            }
            .answer-btn {
                font-size: 16px;
                padding: 15px;
            }
            .joker-btn {
                width: 60px;
                height: 60px;
                font-size: 12px;
            }
        }

        /* Yükleniyor Animasyonu */
        .loading {
            display: none;
            text-align: center;
            color: #FFD700;
            font-size: 20px;
            padding: 20px;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            border: 5px solid rgba(255, 255, 255, 0.3);
            border-top: 5px solid #FFD700;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>

        let currentQuestion = 0;
        let usedJokers = { "50": false, "audience": false, "phone": false, "pass": false };
        let eliminatedAnswers = [];

        function startGame() {
            document.getElementById('startScreen').classList.remove('active');
            document.getElementById('gameScreen').classList.add('active');
            loadQuestion();
        }

        function loadQuestion() {
            eliminatedAnswers = [];
            const q = questions[currentQuestion];
            document.getElementById('questionText').innerText = q.question;
            document.getElementById('moneyDisplay').innerText = moneyLadder[currentQuestion];
            document.getElementById('questionNumber').innerText = `Soru ${currentQuestion + 1} / 12`;

            const container = document.getElementById('answersContainer');
            container.innerHTML = '';

            q.answers.forEach((answer, index) => {
                const btn = document.createElement('button');
                btn.className = 'answer-btn';
                btn.innerHTML = `<strong>${String.fromCharCode(65 + index)}:</strong> ${answer}`;
                btn.onclick = () => checkAnswer(index);
                btn.id = `answer${index}`;
                container.appendChild(btn);
            });
        }

        function checkAnswer(selected) {
            const correct = questions[currentQuestion].correct;
            const btns = document.querySelectorAll('.answer-btn');
            
            btns.forEach(btn => btn.style.pointerEvents = 'none');

            if (selected === correct) {
                document.getElementById(`answer${selected}`).classList.add('correct');
                createConfetti();
                
                setTimeout(() => {
                    if (currentQuestion === 11) {
                        endGame(true);
                    } else {
                        currentQuestion++;
                        loadQuestion();
                    }
                }, 1500);
            } else {
                document.getElementById(`answer${selected}`).classList.add('wrong');
                document.getElementById(`answer${correct}`).classList.add('correct');
                
                setTimeout(() => {
                    endGame(false);
                }, 2000);
            }
        }

        function useJoker(type) {
            if (usedJokers[type]) return;
            
            usedJokers[type] = true;
            document.getElementById(`joker${type.charAt(0).toUpperCase() + type.slice(1)}`).disabled = true;

            const correct = questions[currentQuestion].correct;
            const answers = questions[currentQuestion].answers;

            switch(type) {
                case '50':
                    let wrongAnswers = [];
                    answers.forEach((_, index) => {
                        if (index !== correct) wrongAnswers.push(index);
                    });
                    // Rastgele 2 yanlış cevabı sil
                    for (let i = 0; i < 2; i++) {
                        const randomIndex = Math.floor(Math.random() * wrongAnswers.length);
                        const toEliminate = wrongAnswers[randomIndex];
                        document.getElementById(`answer${toEliminate}`).classList.add('eliminated');
                        wrongAnswers.splice(randomIndex, 1);
                    }
                    break;

                case 'audience':
                    alert(`📊 Seyirci Oylaması:\n\nA: ${correct === 0 ? '75%' : Math.floor(Math.random() * 25) + '%'}\nB: ${correct === 1 ? '75%' : Math.floor(Math.random() * 25) + '%'}\nC: ${correct === 2 ? '75%' : Math.floor(Math.random() * 25) + '%'}\nD: ${correct === 3 ? '75%' : Math.floor(Math.random() * 25) + '%'}`);
                    break;

                case 'phone':
                    const hints = [
                        "Bence doğru cevap ",
                        "Emin değilim ama sanırım ",
                        "Çok net, cevap kesinlikle "
                    ];
                    const randomHint = hints[Math.floor(Math.random() * hints.length)];
                    alert(`📞 Telefon Joker:\n\n"${randomHint}${String.fromCharCode(65 + correct)} olmalı!"`);
                    break;

                case 'pass':
                    if (currentQuestion < 11) {
                        currentQuestion++;
                        loadQuestion();
                    } else {
                        alert("Son soruda pas geçemezsiniz!");
                    }
                    break;
            }
        }

        function endGame(won) {
            document.getElementById('gameScreen').classList.remove('active');
            document.getElementById('endScreen').classList.add('active');

            if (won) {
                document.getElementById('endTitle').innerText = '🎉 TEBRİKLER!';
                document.getElementById('endMessage').innerText = 'Tüm soruları doğru cevapladınız!';
                document.getElementById('finalAmount').innerText = '5.000.000₺';
                createConfetti();
            } else {
                document.getElementById('endTitle').innerText = '😢 Oyun Bitti';
                document.getElementById('endMessage').innerText = 'Yanlış cevap verdiniz!';
                const prize = currentQuestion > 0 ? moneyLadder[currentQuestion - 1] : '0₺';
                document.getElementById('finalAmount').innerText = prize;
            }
        }

        function createConfetti() {
            for (let i = 0; i < 50; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.style.left = Math.random() * 100 + '%';
                    confetti.style.background = ['#FFD700', '#FF69B4', '#00FF00', '#00BFFF'][Math.floor(Math.random() * 4)];
                    confetti.style.animationDelay = Math.random() * 0.5 + 's';
                    document.body.appendChild(confetti);
                    setTimeout(() => confetti.remove(), 3000);
                }, i * 50);
            }
        }

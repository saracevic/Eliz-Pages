<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coin Sinyal Takip - Canlı</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #2c3e50, #3498db);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .header p {
            opacity: 0.9;
            font-size: 1.1em;
        }
        
        .controls {
            padding: 30px;
            background: #f8f9fa;
            border-bottom: 1px solid #e9ecef;
        }
        
        .input-group {
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }
        
        .coin-input {
            flex: 1;
            min-width: 200px;
            padding: 15px 20px;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s ease;
        }
        
        .coin-input:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.1);
        }
        
        .volume-input {
            width: 150px;
            padding: 15px 20px;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            font-size: 16px;
        }
        
        .search-btn {
            background: linear-gradient(135deg, #00b894, #00a085);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .search-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 184, 148, 0.3);
        }
        
        .search-btn:disabled {
            background: #b2bec3;
            cursor: not-allowed;
            transform: none;
        }
        
        .auto-refresh {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 15px;
        }
        
        .results {
            padding: 30px;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #636e72;
            font-size: 1.1em;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .signal-card {
            background: white;
            border: 1px solid #e9ecef;
            border-radius: 10px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
            transition: all 0.3s ease;
        }
        
        .signal-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }
        
        .signal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .coin-symbol {
            font-size: 1.4em;
            font-weight: bold;
            color: #2d3436;
        }
        
        .volume-badge {
            background: linear-gradient(135deg, #fd79a8, #e84393);
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9em;
        }
        
        .signal-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }
        
        .detail-item {
            display: flex;
            flex-direction: column;
        }
        
        .detail-label {
            font-size: 0.85em;
            color: #636e72;
            margin-bottom: 5px;
        }
        
        .detail-value {
            font-size: 1.1em;
            font-weight: 600;
            color: #2d3436;
        }
        
        .error {
            background: #ffeaa7;
            border: 1px solid #fdcb6e;
            color: #e17055;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            margin: 20px 0;
        }
        
        .info-text {
            text-align: center;
            color: #636e72;
            padding: 20px;
            font-style: italic;
        }
        
        .last-update {
            text-align: center;
            color: #636e72;
            font-size: 0.9em;
            margin-bottom: 20px;
        }
        
        @media (max-width: 768px) {
            .container {
                margin: 10px;
            }
            
            .header h1 {
                font-size: 2em;
            }
            
            .input-group {
                flex-direction: column;
            }
            
            .coin-input, .volume-input, .search-btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 Canlı Coin Sinyal Takip</h1>
            <p>Gerçek zamanlı 100K+ işlem sinyallerini takip edin</p>
        </div>
        
        <div class="controls">
            <div class="input-group">
                <input 
                    type="text" 
                    class="coin-input" 
                    placeholder="Coin sembolü girin (Örnek: BTC, ETH, ADA...)" 
                    value="BTC"
                >
                <input 
                    type="number" 
                    class="volume-input" 
                    placeholder="Min hacim" 
                    value="100000"
                    min="1000"
                    step="1000"
                >
                <button class="search-btn" onclick="searchSignals()">
                    Canlı Sinyalleri Getir
                </button>
            </div>
            <div class="auto-refresh">
                <input type="checkbox" id="autoRefresh" onchange="toggleAutoRefresh()">
                <label for="autoRefresh">Otomatik yenile (10 saniyede bir)</label>
            </div>
        </div>
        
        <div class="results" id="results">
            <div class="info-text">
                Coin sembolünü girip "Canlı Sinyalleri Getir" butonuna tıklayın
            </div>
        </div>
    </div>

    <script>
        let autoRefreshInterval = null;
        let currentCoin = 'BTC';
        let currentMinVolume = 100000;

        async function searchSignals() {
            const coinInput = document.querySelector('.coin-input');
            const volumeInput = document.querySelector('.volume-input');
            const searchBtn = document.querySelector('.search-btn');
            const resultsDiv = document.getElementById('results');
            
            currentCoin = coinInput.value.trim().toUpperCase();
            currentMinVolume = parseInt(volumeInput.value);
            
            if (!currentCoin) {
                showError('Lütfen bir coin sembolü girin');
                return;
            }
            
            // Butonu devre dışı bırak ve loading göster
            searchBtn.disabled = true;
            searchBtn.textContent = 'Canlı Veri Alınıyor...';
            resultsDiv.innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <div>${currentCoin} için ${currentMinVolume.toLocaleString()} USD üzeri canlı sinyaller aranıyor...</div>
                </div>
            `;
            
            try {
                // Gerçek API'den veri al
                const signals = await getRealTimeSignals(currentCoin, currentMinVolume);
                displayResults(signals, currentCoin, currentMinVolume);
            } catch (error) {
                showError('Canlı sinyaller alınırken hata oluştu: ' + error.message);
            } finally {
                // Butonu tekrar aktif et
                searchBtn.disabled = false;
                searchBtn.textContent = 'Canlı Sinyalleri Getir';
            }
        }
        
        async function getRealTimeSignals(coinSymbol, minVolume) {
            try {
                // Binance API'den canlı veri al
                const symbol = coinSymbol + 'USDT';
                
                // 1. Önce sembol bilgilerini kontrol et
                const exchangeInfoResponse = await fetch(`https://cors.aggr.trade/https://api.binance.com/api/v3/exchangeInfo?symbol=${symbol}`);
                const exchangeInfo = await exchangeInfoResponse.json();
                
                if (exchangeInfo.msg && exchangeInfo.msg.includes('Invalid symbol')) {
                    throw new Error(`Geçersiz sembol: ${coinSymbol}`);
                }
                
                // 2. Canlı fiyat bilgisi al
                const tickerResponse = await fetch(`https://cors.aggr.trade/https://api.binance.com/api/v3/ticker/price?symbol=${symbol}`);
                const ticker = await tickerResponse.json();
                
                // 3. Son işlemler (trades) - bu kısım aggr.trade benzeri veri sağlar
                const tradesResponse = await fetch(`https://cors.aggr.trade/https://api.binance.com/api/v3/trades?symbol=${symbol}&limit=50`);
                const trades = await tradesResponse.json();
                
                // 4. 24saatlik istatistikler
                const statsResponse = await fetch(`https://cors.aggr.trade/https://api.binance.com/api/v3/ticker/24hr?symbol=${symbol}`);
                const stats = await statsResponse.json();
                
                // Büyük işlemleri filtrele ve formatla
                const signals = trades
                    .filter(trade => {
                        const volume = parseFloat(trade.quoteQty) || (parseFloat(trade.price) * parseFloat(trade.qty));
                        return volume >= minVolume;
                    })
                    .map(trade => {
                        const volume = parseFloat(trade.quoteQty) || (parseFloat(trade.price) * parseFloat(trade.qty));
                        return {
                            id: trade.id,
                            symbol: trade.symbol,
                            volume: volume,
                            price: parseFloat(trade.price),
                            amount: parseFloat(trade.qty),
                            type: trade.isBuyerMaker ? 'SELL' : 'BUY',
                            timestamp: new Date(trade.time).toISOString(),
                            isLargeOrder: volume > minVolume * 5 // Çok büyük işlemleri işaretle
                        };
                    })
                    .sort((a, b) => b.volume - a.volume);
                
                // Eğer yeterli büyük işlem yoksa, simüle edilmiş veri ekle (demo için)
                if (signals.length < 3) {
                    const currentPrice = parseFloat(ticker.price);
                    const simulatedSignals = generateSimulatedSignals(coinSymbol, minVolume, currentPrice, stats.volume);
                    signals.push(...simulatedSignals);
                    signals.sort((a, b) => b.volume - a.volume);
                }
                
                return signals;
                
            } catch (error) {
                console.error('API Hatası:', error);
                // API hatası durumunda simüle edilmiş veri göster
                return generateSimulatedSignals(coinSymbol, minVolume);
            }
        }
        
        function generateSimulatedSignals(coinSymbol, minVolume, currentPrice = null, baseVolume = null) {
            const signals = [];
            const symbol = coinSymbol + 'USDT';
            const price = currentPrice || (100 + Math.random() * 1000);
            const baseVol = baseVolume || (minVolume * 10);
            
            const signalCount = Math.floor(Math.random() * 5) + 3; // 3-7 arası sinyal
            
            for (let i = 0; i < signalCount; i++) {
                const volume = minVolume * (1 + Math.random() * 4); // minVolume ile 5x minVolume arası
                const tradePrice = price * (0.99 + Math.random() * 0.02); // ±%1 fiyat varyasyonu
                const amount = volume / tradePrice;
                
                signals.push({
                    id: 'sim_' + Math.random().toString(36).substr(2, 9),
                    symbol: symbol,
                    volume: volume,
                    price: tradePrice,
                    amount: amount,
                    type: Math.random() > 0.5 ? 'BUY' : 'SELL',
                    timestamp: new Date(Date.now() - Math.random() * 3600000).toISOString(),
                    isLargeOrder: volume > minVolume * 3,
                    isSimulated: true
                });
            }
            
            return signals;
        }
        
        function displayResults(signals, coinSymbol, minVolume) {
            const resultsDiv = document.getElementById('results');
            
            if (signals.length === 0) {
                resultsDiv.innerHTML = `
                    <div class="info-text">
                        ${coinSymbol} için ${minVolume.toLocaleString()} USD üzeri canlı sinyal bulunamadı
                    </div>
                `;
                return;
            }
            
            const realSignals = signals.filter(s => !s.isSimulated);
            const simulatedSignals = signals.filter(s => s.isSimulated);
            
            let html = `
                <div class="last-update">
                    Son güncelleme: ${new Date().toLocaleTimeString('tr-TR')}
                    ${simulatedSignals.length > 0 ? ' (Demo veriler içerir)' : ''}
                </div>
                <div style="margin-bottom: 20px; font-size: 1.1em; color: #2d3436;">
                    <strong>${coinSymbol}</strong> için <strong>${minVolume.toLocaleString()} USD</strong> üzeri 
                    <strong>${signals.length}</strong> sinyal bulundu
                    ${realSignals.length > 0 ? ` (${realSignals.length} gerçek işlem)` : ''}
                </div>
            `;
            
            signals.forEach(signal => {
                const date = new Date(signal.timestamp);
                const volumeFormatted = formatVolume(signal.volume);
                const priceFormatted = formatPrice(signal.price);
                const amountFormatted = formatAmount(signal.amount);
                
                html += `
                    <div class="signal-card" style="${signal.isSimulated ? 'opacity: 0.8; border-left: 4px solid #fdcb6e;' : signal.isLargeOrder ? 'border-left: 4px solid #e17055;' : ''}">
                        <div class="signal-header">
                            <div class="coin-symbol">
                                ${signal.symbol}
                                ${signal.isSimulated ? ' 🧪' : ''}
                                ${signal.isLargeOrder ? ' ⚡' : ''}
                            </div>
                            <div class="volume-badge">${volumeFormatted}</div>
                        </div>
                        <div class="signal-details">
                            <div class="detail-item">
                                <span class="detail-label">İşlem Türü</span>
                                <span class="detail-value" style="color: ${signal.type === 'BUY' ? '#00b894' : '#e17055'}">
                                    ${signal.type === 'BUY' ? '🟢 ALIM' : '🔴 SATIM'}
                                    ${signal.isLargeOrder ? ' (BÜYÜK)' : ''}
                                </span>
                            </div>
                            <div class="detail-item">
                                <span class="detail-label">Fiyat</span>
                                <span class="detail-value">${priceFormatted} USD</span>
                            </div>
                            <div class="detail-item">
                                <span class="detail-label">Miktar</span>
                                <span class="detail-value">${amountFormatted} ${coinSymbol}</span>
                            </div>
                            <div class="detail-item">
                                <span class="detail-label">Zaman</span>
                                <span class="detail-value">${date.toLocaleTimeString('tr-TR')}</span>
                            </div>
                        </div>
                        ${signal.isSimulated ? '<div style="margin-top: 10px; font-size: 0.8em; color: #fdcb6e;">⚠️ Demo veri</div>' : ''}
                    </div>
                `;
            });
            
            resultsDiv.innerHTML = html;
        }
        
        function toggleAutoRefresh() {
            const autoRefreshCheckbox = document.getElementById('autoRefresh');
            
            if (autoRefreshCheckbox.checked) {
                autoRefreshInterval = setInterval(() => {
                    searchSignals();
                }, 10000); // 10 saniyede bir
            } else {
                if (autoRefreshInterval) {
                    clearInterval(autoRefreshInterval);
                    autoRefreshInterval = null;
                }
            }
        }
        
        function showError(message) {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = `
                <div class="error">
                    ${message}
                </div>
            `;
        }
        
        function formatVolume(volume) {
            if (volume >= 1000000) {
                return (volume / 1000000).toFixed(2) + 'M USD';
            } else if (volume >= 1000) {
                return (volume / 1000).toFixed(1) + 'K USD';
            }
            return volume.toFixed(0) + ' USD';
        }
        
        function formatPrice(price) {
            return price.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 8 });
        }
        
        function formatAmount(amount) {
            if (amount >= 1) {
                return amount.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 4 });
            }
            return amount.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 8 });
        }
        
        // Enter tuşu ile arama yapma
        document.querySelector('.coin-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                searchSignals();
            }
        });
        
        document.querySelector('.volume-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                searchSignals();
            }
        });
        
        // Sayfa yüklendiğinde otomatik arama
        window.addEventListener('load', function() {
            searchSignals();
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whale Tracker - Optimized</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }

        h1 {
            font-size: 2.5em;
            background: linear-gradient(45deg, #00d4ff, #7c3aed);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .status-bar {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: rgba(0, 212, 255, 0.1);
            border-radius: 20px;
            font-size: 0.9em;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        .status-dot.active {
            background: #00ff88;
        }

        .status-dot.inactive {
            background: #ff4444;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            font-weight: 600;
            transition: all 0.3s ease;
            background: linear-gradient(45deg, #7c3aed, #00d4ff);
            color: white;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(124, 58, 237, 0.4);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .settings-panel {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .settings-row {
            display: flex;
            gap: 15px;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .settings-row label {
            color: #00d4ff;
            font-weight: 600;
            min-width: 120px;
        }

        .settings-row input,
        .settings-row select {
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid rgba(0, 212, 255, 0.3);
            background: rgba(0, 0, 0, 0.3);
            color: #fff;
            flex: 1;
            min-width: 200px;
        }

        /* Tablo Stilleri */
        .table-container {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            overflow: hidden;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .whale-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.95em;
        }

        .whale-table thead {
            background: rgba(0, 212, 255, 0.1);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .whale-table th {
            padding: 15px 20px;
            text-align: left;
            font-weight: 600;
            color: #00d4ff;
            border-bottom: 2px solid rgba(0, 212, 255, 0.3);
            cursor: pointer;
            user-select: none;
            transition: background 0.2s;
        }

        .whale-table th:hover {
            background: rgba(0, 212, 255, 0.15);
        }

        .whale-table th.sortable::after {
            content: ' ↕';
            opacity: 0.5;
            font-size: 0.8em;
        }

        .whale-table th.sorted-asc::after {
            content: ' ↑';
            opacity: 1;
        }

        .whale-table th.sorted-desc::after {
            content: ' ↓';
            opacity: 1;
        }

        .whale-table tbody tr {
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.2s ease;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-10px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .whale-table tbody tr:hover {
            background: rgba(0, 212, 255, 0.08);
            transform: scale(1.01);
        }

        .whale-table tbody tr.new-row {
            animation: highlightRow 2s ease;
        }

        @keyframes highlightRow {
            0%, 100% { background: rgba(255, 255, 255, 0.05); }
            50% { background: rgba(0, 255, 136, 0.2); }
        }

        .whale-table td {
            padding: 12px 20px;
            color: #e0e0e0;
        }

        .coin-cell {
            font-weight: 700;
            color: #00d4ff;
            font-size: 1.05em;
        }

        .price-cell {
            color: #00ff88;
            font-weight: 600;
        }

        .volume-cell {
            font-weight: 700;
            font-size: 1.05em;
        }

        .volume-high {
            color: #00ff88;
        }

        .volume-medium {
            color: #ffd700;
        }

        .change-positive {
            color: #00ff88;
        }

        .change-negative {
            color: #ff4444;
        }

        .timestamp-cell {
            color: #888;
            font-size: 0.9em;
        }

        .rank-cell {
            color: #7c3aed;
            font-weight: 600;
        }

        .loading {
            text-align: center;
            padding: 40px;
            font-size: 1.2em;
            color: #00d4ff;
        }

        .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid rgba(0, 212, 255, 0.3);
            border-top-color: #00d4ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error {
            background: rgba(255, 68, 68, 0.1);
            border: 1px solid rgba(255, 68, 68, 0.3);
            color: #ff4444;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            text-align: center;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }

        .empty-state-icon {
            font-size: 4em;
            margin-bottom: 20px;
        }

        @media (max-width: 1200px) {
            .whale-table {
                font-size: 0.85em;
            }

            .whale-table th,
            .whale-table td {
                padding: 10px 12px;
            }
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.8em;
            }

            .table-container {
                overflow-x: auto;
            }

            .whale-table {
                font-size: 0.75em;
            }

            .whale-table th,
            .whale-table td {
                padding: 8px 10px;
                white-space: nowrap;
            }

            .controls {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🐋 Whale Tracker - Optimized</h1>
            <p>Gerçek zamanlı büyük hacim takibi - Excel Görünüm</p>
            <div class="status-bar">
                <div class="status-item">
                    <div class="status-dot" id="wsStatus"></div>
                    <span id="wsStatusText">Bağlantı Bekleniyor</span>
                </div>
                <div class="status-item">
                    <span>📊 Tarama: <strong id="scanCount">0</strong></span>
                </div>
                <div class="status-item">
                    <span>🔍 Bulunan: <strong id="whaleCount">0</strong></span>
                </div>
            </div>
        </header>

        <div class="settings-panel">
            <div class="settings-row">
                <label>Minimum Hacim (USD):</label>
                <input type="number" id="minVolume" value="500000" step="100000">
            </div>
            <div class="settings-row">
                <label>Tarama Modu:</label>
                <select id="scanMode">
                    <option value="websocket">WebSocket (Hızlı - Önerilen)</option>
                    <option value="batch">Batch API (Normal)</option>
                    <option value="legacy">Legacy (Yavaş)</option>
                </select>
            </div>
        </div>

        <div class="controls">
            <button class="btn" id="startBtn" onclick="startScanning()">▶️ Taramayı Başlat</button>
            <button class="btn" id="stopBtn" onclick="stopScanning()" disabled>⏸️ Durdur</button>
            <button class="btn" onclick="clearResults()">🗑️ Temizle</button>
        </div>

        <div id="loading" class="loading" style="display: none;">
            <div class="spinner"></div>
            <p>Veriler yükleniyor...</p>
        </div>

        <div id="error" class="error" style="display: none;"></div>

        <div class="table-container">
            <table class="whale-table">
                <thead>
                    <tr>
                        <th class="sortable" onclick="sortTable('rank')">#</th>
                        <th class="sortable" onclick="sortTable('symbol')">Coin</th>
                        <th class="sortable" onclick="sortTable('price')">Fiyat (USD)</th>
                        <th class="sortable" onclick="sortTable('volume')">24h Hacim</th>
                        <th class="sortable" onclick="sortTable('change')">24h Değişim</th>
                        <th class="sortable" onclick="sortTable('timestamp')">Son Güncelleme</th>
                    </tr>
                </thead>
                <tbody id="whaleTableBody">
                    <tr class="empty-state">
                        <td colspan="6">
                            <div class="empty-state-icon">📊</div>
                            <div>Tarama başlatılmadı. "Taramayı Başlat" butonuna tıklayın.</div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // Global değişkenler
        let isScanning = false;
        let scanInterval = null;
        let whaleData = [];
        let cache = new Map();
        let wsConnection = null;
        let scanCount = 0;
        let currentSort = { column: 'volume', direction: 'desc' };

        const BINANCE_API = 'https://api.binance.com/api/v3';

        const POPULAR_COINS = [
            'BTCUSDT', 'ETHUSDT', 'BNBUSDT', 'SOLUSDT', 'XRPUSDT',
            'ADAUSDT', 'DOGEUSDT', 'MATICUSDT', 'DOTUSDT', 'AVAXUSDT',
            'LINKUSDT', 'UNIUSDT', 'LTCUSDT', 'ATOMUSDT', 'ETCUSDT',
            'XLMUSDT', 'NEARUSDT', 'ALGOUSDT', 'VETUSDT', 'ICPUSDT',
            'FILUSDT', 'TRXUSDT', 'HBARUSDT', 'APTUSDT', 'ARBUSDT',
            'OPUSDT', 'INJUSDT', 'SUIUSDT', 'STXUSDT', 'WLDUSDT'
        ];

        const CACHE_DURATION = 10000;

        // WebSocket Yönetimi
        function initWebSocket() {
            try {
                const streams = POPULAR_COINS.map(coin => `${coin.toLowerCase()}@ticker`).join('/');
                const wsUrl = `wss://stream.binance.com:9443/stream?streams=${streams}`;
                
                wsConnection = new WebSocket(wsUrl);
                
                wsConnection.onopen = () => {
                    updateWSStatus(true);
                    console.log('✅ WebSocket bağlantısı kuruldu');
                };
                
                wsConnection.onmessage = (event) => {
                    try {
                        const data = JSON.parse(event.data);
                        if (data.stream && data.data) {
                            handleWebSocketData(data.data);
                        }
                    } catch (error) {
                        console.error('WebSocket veri hatası:', error);
                    }
                };
                
                wsConnection.onerror = (error) => {
                    console.error('❌ WebSocket hatası:', error);
                    updateWSStatus(false);
                };
                
                wsConnection.onclose = () => {
                    console.log('🔌 WebSocket bağlantısı kapandı');
                    updateWSStatus(false);
                    
                    if (isScanning) {
                        setTimeout(() => {
                            if (isScanning) initWebSocket();
                        }, 5000);
                    }
                };
                
            } catch (error) {
                console.error('WebSocket başlatma hatası:', error);
                updateWSStatus(false);
            }
        }

        function handleWebSocketData(tickerData) {
            const symbol = tickerData.s;
            const volume = parseFloat(tickerData.q);
            const price = parseFloat(tickerData.c);
            const priceChange = parseFloat(tickerData.P);
            
            const minVolume = parseInt(document.getElementById('minVolume').value);
            
            if (volume >= minVolume) {
                updateWhaleData({
                    symbol: symbol,
                    volume: volume,
                    price: price,
                    priceChange: priceChange,
                    timestamp: Date.now()
                });
            }
        }

        function updateWSStatus(isConnected) {
            const statusDot = document.getElementById('wsStatus');
            const statusText = document.getElementById('wsStatusText');
            
            if (isConnected) {
                statusDot.className = 'status-dot active';
                statusText.textContent = 'WebSocket Aktif';
            } else {
                statusDot.className = 'status-dot inactive';
                statusText.textContent = 'WebSocket Kapalı';
            }
        }

        // Batch API
        async function fetchBatchData() {
            try {
                showLoading(true);
                
                const response = await fetch(`${BINANCE_API}/ticker/24hr`);
                
                if (!response.ok) {
                    throw new Error(`API Hatası: ${response.status}`);
                }
                
                const allTickers = await response.json();
                const minVolume = parseInt(document.getElementById('minVolume').value);
                
                const whales = allTickers
                    .filter(ticker => 
                        ticker.symbol.endsWith('USDT') && 
                        parseFloat(ticker.quoteVolume) >= minVolume
                    )
                    .map(ticker => ({
                        symbol: ticker.symbol,
                        volume: parseFloat(ticker.quoteVolume),
                        price: parseFloat(ticker.lastPrice),
                        priceChange: parseFloat(ticker.priceChangePercent),
                        timestamp: Date.now()
                    }));
                
                whales.forEach(whale => updateWhaleData(whale));
                
                scanCount++;
                document.getElementById('scanCount').textContent = scanCount;
                showLoading(false);
                
            } catch (error) {
                console.error('Batch fetch hatası:', error);
                showError(`Veri çekme hatası: ${error.message}`);
                showLoading(false);
            }
        }

        // Legacy Mod
        async function fetchLegacyData() {
            try {
                showLoading(true);
                
                const promises = POPULAR_COINS.map(symbol => 
                    fetchCoinData(symbol).catch(err => {
                        console.warn(`${symbol} verisi alınamadı:`, err);
                        return null;
                    })
                );
                
                const results = await Promise.all(promises);
                const validResults = results.filter(r => r !== null);
                
                validResults.forEach(data => updateWhaleData(data));
                
                scanCount++;
                document.getElementById('scanCount').textContent = scanCount;
                showLoading(false);
                
            } catch (error) {
                console.error('Legacy fetch hatası:', error);
                showError(`Veri çekme hatası: ${error.message}`);
                showLoading(false);
            }
        }

        async function fetchCoinData(symbol) {
            const cacheKey = symbol;
            const cached = cache.get(cacheKey);
            
            if (cached && Date.now() - cached.timestamp < CACHE_DURATION) {
                return cached.data;
            }
            
            try {
                const response = await fetch(`${BINANCE_API}/ticker/24hr?symbol=${symbol}`);
                
                if (!response.ok) {
                    throw new Error(`API Hatası: ${response.status}`);
                }
                
                const ticker = await response.json();
                const volume = parseFloat(ticker.quoteVolume);
                const minVolume = parseInt(document.getElementById('minVolume').value);
                
                if (volume >= minVolume) {
                    const data = {
                        symbol: ticker.symbol,
                        volume: volume,
                        price: parseFloat(ticker.lastPrice),
                        priceChange: parseFloat(ticker.priceChangePercent),
                        timestamp: Date.now()
                    };
                    
                    cache.set(cacheKey, { data, timestamp: Date.now() });
                    
                    return data;
                }
                
                return null;
                
            } catch (error) {
                throw error;
            }
        }

        // Veri Güncelleme
        function updateWhaleData(data) {
            const existingIndex = whaleData.findIndex(w => w.symbol === data.symbol);
            
            if (existingIndex !== -1) {
                whaleData[existingIndex] = data;
            } else {
                whaleData.push(data);
            }
            
            renderTable();
        }

        // Tablo Render
        function renderTable() {
            const tbody = document.getElementById('whaleTableBody');
            
            if (whaleData.length === 0) {
                tbody.innerHTML = `
                    <tr class="empty-state">
                        <td colspan="6">
                            <div class="empty-state-icon">📊</div>
                            <div>Henüz veri yok. Minimum hacim değerini düşürmeyi deneyin.</div>
                        </td>
                    </tr>
                `;
                return;
            }
            
            // Sıralama
            const sortedData = [...whaleData].sort((a, b) => {
                let aVal = a[currentSort.column];
                let bVal = b[currentSort.column];
                
                if (currentSort.column === 'rank') {
                    aVal = a.volume;
                    bVal = b.volume;
                }
                
                if (typeof aVal === 'string') {
                    return currentSort.direction === 'asc' 
                        ? aVal.localeCompare(bVal)
                        : bVal.localeCompare(aVal);
                }
                
                return currentSort.direction === 'asc' 
                    ? aVal - bVal
                    : bVal - aVal;
            });
            
            tbody.innerHTML = sortedData.map((whale, index) => {
                const volumeClass = whale.volume >= 10000000 ? 'volume-high' : 
                                   whale.volume >= 1000000 ? 'volume-medium' : '';
                const changeClass = whale.priceChange >= 0 ? 'change-positive' : 'change-negative';
                const changeIcon = whale.priceChange >= 0 ? '📈' : '📉';
                
                return `
                    <tr data-symbol="${whale.symbol}">
                        <td class="rank-cell">${index + 1}</td>
                        <td class="coin-cell">${whale.symbol}</td>
                        <td class="price-cell">$${formatNumber(whale.price)}</td>
                        <td class="volume-cell ${volumeClass}">$${formatVolume(whale.volume)}</td>
                        <td class="${changeClass}">${changeIcon} ${whale.priceChange.toFixed(2)}%</td>
                        <td class="timestamp-cell">${new Date(whale.timestamp).toLocaleTimeString('tr-TR')}</td>
                    </tr>
                `;
            }).join('');
            
            document.getElementById('whaleCount').textContent = whaleData.length;
            
            // Sıralama göstergesini güncelle
            document.querySelectorAll('.whale-table th').forEach(th => {
                th.className = 'sortable';
            });
            
            const sortedHeader = document.querySelector(`th[onclick*="${currentSort.column}"]`);
            if (sortedHeader) {
                sortedHeader.className = `sortable sorted-${currentSort.direction}`;
            }
        }

        // Tablo Sıralama
        function sortTable(column) {
            if (currentSort.column === column) {
                currentSort.direction = currentSort.direction === 'asc' ? 'desc' : 'asc';
            } else {
                currentSort.column = column;
                currentSort.direction = 'desc';
            }
            
            renderTable();
        }

        // Format Fonksiyonları
        function formatNumber(num) {
            if (num >= 1) {
                return num.toFixed(2);
            } else if (num >= 0.01) {
                return num.toFixed(4);
            } else {
                return num.toFixed(8);
            }
        }

        function formatVolume(volume) {
            if (volume >= 1000000000) {
                return (volume / 1000000000).toFixed(2) + 'B';
            } else if (volume >= 1000000) {
                return (volume / 1000000).toFixed(2) + 'M';
            } else if (volume >= 1000) {
                return (volume / 1000).toFixed(2) + 'K';
            }
            return volume.toFixed(2);
        }

        function showLoading(show) {
            document.getElementById('loading').style.display = show ? 'block' : 'none';
        }

        function showError(message) {
            const errorDiv = document.getElementById('error');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            
            setTimeout(() => {
                errorDiv.style.display = 'none';
            }, 5000);
        }

        // Kontrol Fonksiyonları
        function startScanning() {
            if (isScanning) return;
            
            isScanning = true;
            whaleData = [];
            scanCount = 0;
            
            document.getElementById('startBtn').disabled = true;
            document.getElementById('stopBtn').disabled = false;
            
            const scanMode = document.getElementById('scanMode').value;
            
            console.log(`🚀 Tarama başlatıldı - Mod: ${scanMode}`);
            
            switch (scanMode) {
                case 'websocket':
                    initWebSocket();
                    fetchBatchData();
                    break;
                    
                case 'batch':
                    fetchBatchData();
                    scanInterval = setInterval(fetchBatchData, 15000);
                    break;
                    
                case 'legacy':
                    fetchLegacyData();
                    scanInterval = setInterval(fetchLegacyData, 20000);
                    break;
            }
        }

        function stopScanning() {
            if (!isScanning) return;
            
            isScanning = false;
            
            document.getElementById('startBtn').disabled = false;
            document.getElementById('stopBtn').disabled = true;
            
            if (wsConnection) {
                wsConnection.close();
                wsConnection = null;
            }
            
            if (scanInterval) {
                clearInterval(scanInterval);
                scanInterval = null;
            }
            
            updateWSStatus(false);
            console.log('⏹️ Tarama durduruldu');
        }

        function clearResults() {
            whaleData = [];
            cache.clear();
            scanCount = 0;
            
            document.getElementById('scanCount').textContent = '0';
            document.getElementById('whaleCount').textContent = '0';
            
            renderTable();
            
            console.log('🗑️ Sonuçlar temizlendi');
        }

        // Otomatik Temizlik
        function cleanOldCache() {
            const now = Date.now();
            for (const [key, value] of cache.entries()) {
                if (now - value.timestamp > CACHE_DURATION) {
                    cache.delete(key);
                }
            }
        }

        setInterval(cleanOldCache, 30000);

        // Sayfa Yükleme
        document.addEventListener('DOMContentLoaded', () => {
            console.log('🐋 Whale Tracker Excel Görünüm yüklendi');
            
            document.getElementById('minVolume').addEventListener('change', () => {
                if (isScanning) {
                    console.log('ℹ️ Minimum hacim değişti, taramayı yeniden başlatın');
                }
            });
            
            document.getElementById('scanMode').addEventListener('change', () => {
                if (isScanning) {
                    const confirmed = confirm('Mod değişikliği için taramayı yeniden başlatmak gerekiyor. Devam edilsin mi?');
                    if (confirmed) {
                        stopScanning();
                        setTimeout(() => startScanning(), 1000);
                    }
                }
            });
        });

        // Klavye Kısayolları
        document.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.code === 'Space') {
                e.preventDefault();
                if (isScanning) {
                    stopScanning();
                } else {
                    startScanning();
                }
            }
            
            if ((e.ctrlKey || e.metaKey) && e.code === 'Delete') {
                e.preventDefault();
                clearResults();
            }
        });

        // Sayfa Kapatma
        window.addEventListener('beforeunload', () => {
            if (wsConnection) {
                wsConnection.close();
            }
            if (scanInterval) {
                clearInterval(scanInterval);
            }
        });

        console.log('✅ Whale Tracker Excel Görünüm hazır!');
    </script>
</body>
</html>

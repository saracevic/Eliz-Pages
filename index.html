<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Whale Hunter Pro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
    :root {
        --bg: #0b1120;
        --card-bg: rgba(30, 41, 59, 0.7);
        --border: rgba(255, 255, 255, 0.08);
        --green: #10b981;
        --red: #ef4444;
        --blue: #3b82f6;
        --text: #f1f5f9;
        --text-dim: #94a3b8;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
        background: var(--bg);
        color: var(--text);
        font-family: 'Inter', sans-serif;
        font-size: 13px;
        padding-bottom: 30px;
        overflow-x: hidden;
    }

    /* Arkaplan Efekti */
    body::before {
        content: '';
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background: radial-gradient(circle at 50% 0%, rgba(59, 130, 246, 0.15), transparent 40%);
        pointer-events: none;
        z-index: -1;
    }

    .container { max-width: 800px; margin: 0 auto; padding: 10px; }

    /* HEADER */
    .header {
        background: var(--card-bg);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 15px;
        margin-bottom: 15px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    }

    .brand { font-size: 18px; font-weight: 800; letter-spacing: -0.5px; background: linear-gradient(to right, #fff, #94a3b8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    
    .status-badge {
        font-family: 'JetBrains Mono', monospace;
        font-size: 10px;
        padding: 4px 8px;
        border-radius: 6px;
        background: rgba(0,0,0,0.3);
        border: 1px solid var(--border);
        display: flex;
        align-items: center;
        gap: 6px;
    }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: #475569; transition: 0.3s; }
    .dot.active { background: var(--green); box-shadow: 0 0 8px var(--green); }

    /* FIBO PANEL - Sağ Üst Köşe */
    .fibo-panel {
        position: fixed;
        top: 10px;
        right: 10px;
        width: 280px;
        background: var(--card-bg);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 12px;
        z-index: 1000;
        box-shadow: 0 8px 25px rgba(0,0,0,0.3);
        max-height: 80vh;
        overflow-y: auto;
    }

    .fibo-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
        padding-bottom: 8px;
        border-bottom: 1px solid var(--border);
    }

    .fibo-title {
        font-size: 12px;
        font-weight: 700;
        color: var(--text);
        display: flex;
        align-items: center;
        gap: 6px;
    }

    .fibo-refresh {
        background: rgba(59, 130, 246, 0.2);
        border: 1px solid rgba(59, 130, 246, 0.4);
        color: var(--blue);
        padding: 4px 8px;
        border-radius: 6px;
        font-size: 10px;
        cursor: pointer;
        transition: 0.2s;
    }

    .fibo-refresh:hover {
        background: rgba(59, 130, 246, 0.3);
    }

    .fibo-coin {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 6px 0;
        border-bottom: 1px solid rgba(255,255,255,0.05);
        font-family: 'JetBrains Mono', monospace;
        font-size: 11px;
    }

    .fibo-coin:last-child {
        border-bottom: none;
    }

    .fibo-symbol {
        font-weight: 600;
        color: var(--text);
    }

    .fibo-percent {
        font-weight: 700;
    }

    .fibo-percent.close { color: var(--green); }
    .fibo-percent.medium { color: #f59e0b; }
    .fibo-percent.far { color: var(--text-dim); }

    .fibo-loading {
        text-align: center;
        color: var(--text-dim);
        font-size: 11px;
        padding: 10px 0;
    }

    /* CONTROLS */
    .controls { display: flex; gap: 8px; margin-bottom: 15px; overflow-x: auto; padding-bottom: 5px; }
    .btn {
        background: var(--card-bg); border: 1px solid var(--border); color: var(--text-dim);
        padding: 8px 14px; border-radius: 8px; font-size: 11px; font-weight: 600; cursor: pointer;
        transition: 0.2s; white-space: nowrap;
    }
    .btn.active { background: rgba(59, 130, 246, 0.15); color: var(--blue); border-color: rgba(59, 130, 246, 0.4); }

    /* MARKET GRID */
    .market-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 20px; }
    .ticker-card {
        background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; padding: 10px; text-align: center;
    }
    .t-symbol { font-size: 10px; color: var(--text-dim); margin-bottom: 2px; }
    .t-price { font-family: 'JetBrains Mono'; font-weight: 700; font-size: 12px; }

    /* TABLES */
    .section-title { font-size: 11px; font-weight: 700; color: var(--text-dim); text-transform: uppercase; margin-bottom: 8px; margin-left: 4px; letter-spacing: 0.5px; }
    
    .table-card {
        background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; margin-bottom: 20px;
    }

    table { width: 100%; border-collapse: collapse; }
    th { text-align: left; padding: 10px 12px; font-size: 10px; color: var(--text-dim); background: rgba(0,0,0,0.2); border-bottom: 1px solid var(--border); }
    td { padding: 8px 12px; font-family: 'JetBrains Mono'; font-size: 11px; border-bottom: 1px solid var(--border); color: #e2e8f0; }
    tr:last-child td { border-bottom: none; }
    
    .col-coin { font-family: 'Inter'; font-weight: 600; color: #fff; }
    .text-green { color: var(--green); }
    .text-red { color: var(--red); }
    
    .flash-green { animation: flashG 0.8s; }
    .flash-red { animation: flashR 0.8s; }
    
    @keyframes flashG { 0% { background: rgba(16, 185, 129, 0.2); } 100% { background: transparent; } }
    @keyframes flashR { 0% { background: rgba(239, 68, 68, 0.2); } 100% { background: transparent; } }

    /* 🔔 NOTIFICATION TOASTS (Sağ Üst) */
    .toast-container {
        position: fixed;
        top: 10px;
        right: 300px; /* Fibo panel için yer aç */
        z-index: 9999;
        display: flex;
        flex-direction: column;
        gap: 8px;
        pointer-events: none;
    }

    .toast {
        background: rgba(15, 23, 42, 0.95);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid var(--border);
        border-left: 4px solid;
        padding: 10px 14px;
        border-radius: 8px;
        width: 220px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        transform: translateX(120%);
        transition: transform 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.28);
        display: flex;
        flex-direction: column;
    }

    .toast.show { transform: translateX(0); }
    .toast.buy { border-left-color: var(--green); }
    .toast.sell { border-left-color: var(--red); }

    .toast-header { display: flex; justify-content: space-between; margin-bottom: 2px; font-size: 11px; font-weight: 700; }
    .toast-body { display: flex; justify-content: space-between; font-family: 'JetBrains Mono'; font-size: 12px; }

    /* Responsive */
    @media (max-width: 1200px) {
        .fibo-panel {
            position: relative;
            width: 100%;
            max-width: 800px;
            margin: 0 auto 15px auto;
            top: auto;
            right: auto;
        }
        .toast-container {
            right: 10px;
        }
    }

</style>
</head>
<body>

<!-- Fibonacci Panel -->
<div class="fibo-panel" id="fiboPanel">
    <div class="fibo-header">
        <div class="fibo-title">
            <span>📊 FIBO 0.72</span>
            <span style="color:var(--text-dim); font-size:10px;">En Yakın Coinler</span>
        </div>
        <div class="fibo-refresh" id="fiboRefresh">🔄</div>
    </div>
    <div id="fiboContent">
        <div class="fibo-loading">Coinler analiz ediliyor...</div>
    </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<div class="container">
    <div class="header">
        <div>
            <div class="brand">WHALE HUNTER</div>
            <div style="font-size:10px; color: var(--text-dim); margin-top:2px;">Threshold: >$200.000</div>
        </div>
        <div class="status-badge">
            <div class="dot" id="wsDot"></div> LIVE
        </div>
    </div>

    <div class="controls">
        <div class="btn active" id="btnSound">🔔 Ses</div>
        <div class="btn active" id="btnVib">📳 Titreşim</div>
        <div class="btn active" id="btnNotify">💬 Bildirim</div>
    </div>

    <div class="market-row" id="marketGrid">
        </div>

    <div class="section-title">En Çok Hacim (Son 1 Saat)</div>
    <div class="table-card">
        <table>
            <thead><tr><th>Coin</th><th>Alış</th><th>Satış</th><th>Net ($)</th></tr></thead>
            <tbody id="summaryBody"></tbody>
        </table>
    </div>

    <div class="section-title">Canlı Akış (Whales Only)</div>
    <div class="table-card">
        <div style="overflow-x:auto;">
            <table>
                <thead><tr><th>Saat</th><th>Coin</th><th>Yön</th><th>Adet</th><th>Net ($)</th></tr></thead>
                <tbody id="tradesBody">
                    <tr><td colspan="5" style="text-align:center; padding:20px; color:var(--text-dim)">Balinalar bekleniyor...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
(function() {
    'use strict';

    // --- AYARLAR ---
    const MIN_USD = 2000000;
    const COINS = [
        'btcusdt','ethusdt','bnbusdt','solusdt','xrpusdt','adausdt','dogeusdt','avaxusdt',
        'linkusdt','dotusdt','maticusdt','ltcusdt','shibusdt','pepeusdt','bonkusdt',
        'wifusdt','fetusdt','rndrusdt','nearusdt','filusdt','aptusdt','suiusdt','arbusdt',
        'opusdt','tiausdt','injusdt','imxusdt','fantomusdt','flokiusdt'
    ];

    // --- FIBONACCI SİSTEMİ ---
    const fiboCoins = [];

    async function fetchFiboData() {
        const fiboContent = document.getElementById('fiboContent');
        fiboContent.innerHTML = '<div class="fibo-loading">Coinler analiz ediliyor...</div>';

        try {
            // Binance API'den 1 aylık verileri çek
            const results = [];
            
            for (const symbol of COINS.slice(0, 50)) { // İlk 50 coin için
                try {
                    const response = await fetch(`https://api.binance.com/api/v3/klines?symbol=${symbol.toUpperCase()}&interval=1d&limit=30`);
                    const klines = await response.json();
                    
                    if (klines.length > 0) {
                        const highPrices = klines.map(k => parseFloat(k[2]));
                        const lowPrices = klines.map(k => parseFloat(k[3]));
                        const currentPrice = parseFloat(klines[klines.length - 1][4]);
                        
                        const ath = Math.max(...highPrices);
                        const lowest = Math.min(...lowPrices);
                        
                        // Fibo 0.72 hesapla
                        const fibo72 = lowest + (ath - lowest) * 0.72;
                        
                        // Mevcut fiyatın Fibo 0.72'ye yakınlık yüzdesi
                        const distancePercent = Math.abs((currentPrice - fibo72) / fibo72) * 100;
                        
                        results.push({
                            symbol: symbol.replace('usdt', '').toUpperCase(),
                            currentPrice,
                            fibo72,
                            distancePercent,
                            ath,
                            lowest
                        });
                    }
                } catch (error) {
                    console.log(`Hata: ${symbol}`, error);
                }
            }

            // Yakınlığa göre sırala (en yakın olanlar üstte)
            results.sort((a, b) => a.distancePercent - b.distancePercent);
            
            // Sadece en yakın 10 coin'i göster
            const topCoins = results.slice(0, 10);
            
            // DOM'u güncelle
            let html = '';
            topCoins.forEach(coin => {
                let percentClass = 'far';
                if (coin.distancePercent <= 3) percentClass = 'close';
                else if (coin.distancePercent <= 8) percentClass = 'medium';
                
                html += `
                    <div class="fibo-coin">
                        <span class="fibo-symbol">${coin.symbol}</span>
                        <span class="fibo-percent ${percentClass}">%${coin.distancePercent.toFixed(2)}</span>
                    </div>
                `;
            });
            
            fiboContent.innerHTML = html;
            
        } catch (error) {
            fiboContent.innerHTML = '<div class="fibo-loading" style="color:var(--red)">Hata: Veri çekilemedi</div>';
            console.error('Fibonacci veri hatası:', error);
        }
    }

    // Fibonacci panelini yenile
    document.getElementById('fiboRefresh').addEventListener('click', fetchFiboData);

    // --- STATE ---
    let trades = [];
    let summary = {};
    let settings = { sound: true, vib: true, notify: true };
    let audioCtx = null;
    let ws = null;
    
    // DOM Cache
    const els = {
        trades: document.getElementById('tradesBody'),
        summary: document.getElementById('summaryBody'),
        toasts: document.getElementById('toastContainer'),
        wsDot: document.getElementById('wsDot'),
        market: document.getElementById('marketGrid')
    };

    // --- SES MOTORU ---
    function initAudio() {
        if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if(audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playSound(type) {
        if(!settings.sound || !audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        
        osc.type = 'sine';
        osc.frequency.setValueAtTime(type === 'BUY' ? 550 : 250, audioCtx.currentTime);
        
        gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
        
        osc.start();
        osc.stop(audioCtx.currentTime + 0.15);
    }

    // --- BİLDİRİM SİSTEMİ (TOAST) ---
    function showToast(coin, side, usd, amount) {
        if(!settings.notify) return;

        const el = document.createElement('div');
        el.className = `toast ${side.toLowerCase()}`;
        
        const icon = side === 'BUY' ? '🟢' : '🔴';
        const formattedUSD = (usd/1000).toFixed(0) + 'K';
        
        el.innerHTML = `
            <div class="toast-header">
                <span>${icon} ${coin}</span>
                <span style="color:var(--text-dim)">${side}</span>
            </div>
            <div class="toast-body">
                <span>${amount} Adet</span>
                <span style="font-weight:700">$${formattedUSD}</span>
            </div>
        `;

        els.toasts.appendChild(el);

        requestAnimationFrame(() => {
            el.classList.add('show');
        });

        setTimeout(() => {
            el.classList.remove('show');
            setTimeout(() => el.remove(), 300);
        }, 3000);

        if(els.toasts.children.length > 3) {
            els.toasts.removeChild(els.toasts.firstChild);
        }
    }

    // --- İŞLEM MANTIĞI ---
    function processTrade(data) {
        const price = parseFloat(data.p);
        const qty = parseFloat(data.q);
        const usd = price * qty;

        if (usd < MIN_USD) return;

        const symbol = data.s.replace('USDT','');
        const side = data.m ? 'SELL' : 'BUY';
        const time = new Date().toLocaleTimeString('tr-TR', {hour:'2-digit', minute:'2-digit', second:'2-digit'});

        trades.unshift({ symbol, side, price, qty, usd, time, id: Date.now() });
        if(trades.length > 40) trades.pop();

        if(!summary[symbol]) summary[symbol] = { buy:0, sell:0, net:0 };
        if(side === 'BUY') {
            summary[symbol].buy += qty;
            summary[symbol].net += usd;
        } else {
            summary[symbol].sell += qty;
            summary[symbol].net -= usd;
        }

        playSound(side);
        if(settings.vib && navigator.vibrate) navigator.vibrate(side === 'BUY' ? 40 : [30,30]);
        
        if(usd > MIN_USD) {
            showToast(symbol, side, usd, qty < 10 ? qty.toFixed(2) : qty.toFixed(0));
        }

        requestRender();
    }

    // --- RENDER (THROTTLE) ---
    let tick = false;
    function requestRender() {
        if(!tick) {
            requestAnimationFrame(() => {
                render();
                tick = false;
            });
            tick = true;
        }
    }

    const fmt = n => new Intl.NumberFormat('en-US', {notation: "compact", maximumFractionDigits: 1}).format(n);

    function render() {
        // 1. Trades
        let html = '';
        trades.slice(0, 15).forEach((t, i) => {
            const color = t.side === 'BUY' ? 'text-green' : 'text-red';
            const anim = i === 0 ? (t.side === 'BUY' ? 'flash-green' : 'flash-red') : '';
            html += `<tr class="${anim}">
                <td style="color:var(--text-dim)">${t.time}</td>
                <td class="col-coin">${t.symbol}</td>
                <td class="${color}" style="font-weight:700">${t.side}</td>
                <td>${t.price < 1 ? t.price.toFixed(4) : t.price.toFixed(2)}</td>
                <td>$${fmt(t.usd)}</td>
            </tr>`;
        });
        els.trades.innerHTML = html;

        // 2. Summary
        const sorted = Object.entries(summary)
            .sort((a,b) => Math.abs(b[1].net) - Math.abs(a[1].net))
            .slice(0, 8);
        
        let sumHtml = '';
        sorted.forEach(([sym, data]) => {
            const netColor = data.net > 0 ? 'text-green' : 'text-red';
            sumHtml += `<tr>
                <td class="col-coin">${sym}</td>
                <td class="text-green">${fmt(data.buy)}</td>
                <td class="text-red">${fmt(data.sell)}</td>
                <td class="${netColor}" style="font-weight:700">$${fmt(data.net)}</td>
            </tr>`;
        });
        els.summary.innerHTML = sumHtml;
    }

    // --- SOCKET BAĞLANTISI ---
    function connect() {
        const streams = COINS.map(c => c + '@aggTrade').join('/');
        const tickers = 'btcusdt@ticker/ethusdt@ticker/solusdt@ticker';
        
        ws = new WebSocket('wss://fstream.binance.com/stream?streams=' + streams + '/' + tickers);

        ws.onopen = () => {
            els.wsDot.classList.add('active');
            console.log('Connected');
        };

        ws.onmessage = (e) => {
            const msg = JSON.parse(e.data);
            if(msg.stream.includes('@aggTrade')) {
                processTrade(msg.data);
            } else if(msg.stream.includes('@ticker')) {
                updateTicker(msg.data);
            }
        };

        ws.onclose = () => {
            els.wsDot.classList.remove('active');
            setTimeout(connect, 3000);
        };
    }

    let tickerData = {};
    function updateTicker(data) {
        const sym = data.s.replace('USDT','');
        tickerData[sym] = { p: parseFloat(data.c), P: parseFloat(data.P) };
        
        if(Math.random() > 0.9) {
            let html = '';
            Object.keys(tickerData).forEach(k => {
                const d = tickerData[k];
                const c = d.P >= 0 ? 'text-green' : 'text-red';
                html += `<div class="ticker-card">
                    <div class="t-symbol">${k}</div>
                    <div class="t-price">$${d.p}</div>
                    <div class="${c}" style="font-size:10px">${d.P}%</div>
                </div>`;
            });
            els.market.innerHTML = html;
        }
    }

    // --- BAŞLATMA ---
    document.getElementById('btnSound').onclick = function() {
        settings.sound = !settings.sound;
        this.classList.toggle('active');
        initAudio();
    };
    document.getElementById('btnVib').onclick = function() {
        settings.vib = !settings.vib;
        this.classList.toggle('active');
    };
    document.getElementById('btnNotify').onclick = function() {
        settings.notify = !settings.notify;
        this.classList.toggle('active');
    };

    // Uygulama başladığında Fibonacci verilerini çek
    connect();
    fetchFiboData();

    // Her 5 dakikada bir Fibonacci verilerini güncelle
    setInterval(fetchFiboData, 5 * 60 * 1000);

    // Bellek Temizliği
    setInterval(() => {
        if(trades.length > 100) trades = trades.slice(0, 50);
    }, 60000);

})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whale Tracker - Optimized</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }

        h1 {
            font-size: 2.5em;
            background: linear-gradient(45deg, #00d4ff, #7c3aed);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .status-bar {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: rgba(0, 212, 255, 0.1);
            border-radius: 20px;
            font-size: 0.9em;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        .status-dot.active {
            background: #00ff88;
        }

        .status-dot.inactive {
            background: #ff4444;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            font-weight: 600;
            transition: all 0.3s ease;
            background: linear-gradient(45deg, #7c3aed, #00d4ff);
            color: white;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(124, 58, 237, 0.4);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .whale-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .whale-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
            animation: slideIn 0.5s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .whale-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 212, 255, 0.2);
            border-color: rgba(0, 212, 255, 0.5);
        }

        .coin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .coin-name {
            font-size: 1.3em;
            font-weight: bold;
            color: #00d4ff;
        }

        .price {
            font-size: 1.1em;
            color: #00ff88;
        }

        .volume-info {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .volume-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.95em;
        }

        .label {
            color: #888;
        }

        .value {
            font-weight: 600;
            color: #fff;
        }

        .value.high {
            color: #00ff88;
        }

        .timestamp {
            margin-top: 10px;
            font-size: 0.85em;
            color: #666;
            text-align: right;
        }

        .loading {
            text-align: center;
            padding: 40px;
            font-size: 1.2em;
            color: #00d4ff;
        }

        .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid rgba(0, 212, 255, 0.3);
            border-top-color: #00d4ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error {
            background: rgba(255, 68, 68, 0.1);
            border: 1px solid rgba(255, 68, 68, 0.3);
            color: #ff4444;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            text-align: center;
        }

        .settings-panel {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .settings-row {
            display: flex;
            gap: 15px;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .settings-row label {
            color: #00d4ff;
            font-weight: 600;
            min-width: 120px;
        }

        .settings-row input,
        .settings-row select {
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid rgba(0, 212, 255, 0.3);
            background: rgba(0, 0, 0, 0.3);
            color: #fff;
            flex: 1;
            min-width: 200px;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.8em;
            }

            .whale-grid {
                grid-template-columns: 1fr;
            }

            .controls {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🐋 Whale Tracker - Optimized</h1>
            <p>Gerçek zamanlı büyük hacim takibi - WebSocket Edition</p>
            <div class="status-bar">
                <div class="status-item">
                    <div class="status-dot" id="wsStatus"></div>
                    <span id="wsStatusText">Bağlantı Bekleniyor</span>
                </div>
                <div class="status-item">
                    <span>📊 Tarama: <strong id="scanCount">0</strong></span>
                </div>
                <div class="status-item">
                    <span>🔍 Bulunan: <strong id="whaleCount">0</strong></span>
                </div>
            </div>
        </header>

        <div class="settings-panel">
            <div class="settings-row">
                <label>Minimum Hacim (USD):</label>
                <input type="number" id="minVolume" value="500000" step="100000">
            </div>
            <div class="settings-row">
                <label>Tarama Modu:</label>
                <select id="scanMode">
                    <option value="websocket">WebSocket (Hızlı - Önerilen)</option>
                    <option value="batch">Batch API (Normal)</option>
                    <option value="legacy">Legacy (Yavaş)</option>
                </select>
            </div>
        </div>

        <div class="controls">
            <button class="btn" id="startBtn" onclick="startScanning()">▶️ Taramayı Başlat</button>
            <button class="btn" id="stopBtn" onclick="stopScanning()" disabled>⏸️ Durdur</button>
            <button class="btn" onclick="clearResults()">🗑️ Temizle</button>
        </div>

        <div id="loading" class="loading" style="display: none;">
            <div class="spinner"></div>
            <p>Veriler yükleniyor...</p>
        </div>

        <div id="error" class="error" style="display: none;"></div>

        <div class="whale-grid" id="whaleGrid"></div>
    </div>

    <script>
        // ============================================
        // WHALE TRACKER OPTIMIZED - COMPLETE JavaScript
        // ============================================

        // Global değişkenler
        let isScanning = false;
        let scanInterval = null;
        let whaleData = [];
        let cache = new Map();
        let wsConnection = null;
        let scanCount = 0;

        // Binance API Base URL
        const BINANCE_API = 'https://api.binance.com/api/v3';

        // Popüler coin listesi
        const POPULAR_COINS = [
            'BTCUSDT', 'ETHUSDT', 'BNBUSDT', 'SOLUSDT', 'XRPUSDT',
            'ADAUSDT', 'DOGEUSDT', 'MATICUSDT', 'DOTUSDT', 'AVAXUSDT',
            'LINKUSDT', 'UNIUSDT', 'LTCUSDT', 'ATOMUSDT', 'ETCUSDT',
            'XLMUSDT', 'NEARUSDT', 'ALGOUSDT', 'VETUSDT', 'ICPUSDT',
            'FILUSDT', 'TRXUSDT', 'HBARUSDT', 'APTUSDT', 'ARBUSDT',
            'OPUSDT', 'INJUSDT', 'SUIUSDT', 'STXUSDT', 'WLDUSDT'
        ];

        const CACHE_DURATION = 10000;

        // ============================================
        // WebSocket Bağlantı Yönetimi
        // ============================================

        function initWebSocket() {
            try {
                const streams = POPULAR_COINS.map(coin => `${coin.toLowerCase()}@ticker`).join('/');
                const wsUrl = `wss://stream.binance.com:9443/stream?streams=${streams}`;
                
                wsConnection = new WebSocket(wsUrl);
                
                wsConnection.onopen = () => {
                    updateWSStatus(true);
                    console.log('✅ WebSocket bağlantısı kuruldu');
                };
                
                wsConnection.onmessage = (event) => {
                    try {
                        const data = JSON.parse(event.data);
                        if (data.stream && data.data) {
                            handleWebSocketData(data.data);
                        }
                    } catch (error) {
                        console.error('WebSocket veri hatası:', error);
                    }
                };
                
                wsConnection.onerror = (error) => {
                    console.error('❌ WebSocket hatası:', error);
                    updateWSStatus(false);
                };
                
                wsConnection.onclose = () => {
                    console.log('🔌 WebSocket bağlantısı kapandı');
                    updateWSStatus(false);
                    
                    if (isScanning) {
                        setTimeout(() => {
                            if (isScanning) initWebSocket();
                        }, 5000);
                    }
                };
                
            } catch (error) {
                console.error('WebSocket başlatma hatası:', error);
                updateWSStatus(false);
            }
        }

        function handleWebSocketData(tickerData) {
            const symbol = tickerData.s;
            const volume = parseFloat(tickerData.q);
            const price = parseFloat(tickerData.c);
            const priceChange = parseFloat(tickerData.P);
            
            const minVolume = parseInt(document.getElementById('minVolume').value);
            
            if (volume >= minVolume) {
                updateWhaleCard({
                    symbol: symbol,
                    volume: volume,
                    price: price,
                    priceChange: priceChange,
                    timestamp: Date.now()
                });
            }
        }

        function updateWSStatus(isConnected) {
            const statusDot = document.getElementById('wsStatus');
            const statusText = document.getElementById('wsStatusText');
            
            if (isConnected) {
                statusDot.className = 'status-dot active';
                statusText.textContent = 'WebSocket Aktif';
            } else {
                statusDot.className = 'status-dot inactive';
                statusText.textContent = 'WebSocket Kapalı';
            }
        }

        // ============================================
        // Batch API İstekleri
        // ============================================

        async function fetchBatchData() {
            try {
                showLoading(true);
                
                const response = await fetch(`${BINANCE_API}/ticker/24hr`);
                
                if (!response.ok) {
                    throw new Error(`API Hatası: ${response.status}`);
                }
                
                const allTickers = await response.json();
                const minVolume = parseInt(document.getElementById('minVolume').value);
                
                const whales = allTickers
                    .filter(ticker => 
                        ticker.symbol.endsWith('USDT') && 
                        parseFloat(ticker.quoteVolume) >= minVolume
                    )
                    .map(ticker => ({
                        symbol: ticker.symbol,
                        volume: parseFloat(ticker.quoteVolume),
                        price: parseFloat(ticker.lastPrice),
                        priceChange: parseFloat(ticker.priceChangePercent),
                        timestamp: Date.now()
                    }))
                    .sort((a, b) => b.volume - a.volume)
                    .slice(0, 50);
                
                whales.forEach(whale => updateWhaleCard(whale));
                
                scanCount++;
                document.getElementById('scanCount').textContent = scanCount;
                showLoading(false);
                
            } catch (error) {
                console.error('Batch fetch hatası:', error);
                showError(`Veri çekme hatası: ${error.message}`);
                showLoading(false);
            }
        }

        // ============================================
        // Legacy Mod
        // ============================================

        async function fetchLegacyData() {
            try {
                showLoading(true);
                
                const promises = POPULAR_COINS.map(symbol => 
                    fetchCoinData(symbol).catch(err => {
                        console.warn(`${symbol} verisi alınamadı:`, err);
                        return null;
                    })
                );
                
                const results = await Promise.all(promises);
                const validResults = results.filter(r => r !== null);
                
                validResults.forEach(data => updateWhaleCard(data));
                
                scanCount++;
                document.getElementById('scanCount').textContent = scanCount;
                showLoading(false);
                
            } catch (error) {
                console.error('Legacy fetch hatası:', error);
                showError(`Veri çekme hatası: ${error.message}`);
                showLoading(false);
            }
        }

        async function fetchCoinData(symbol) {
            const cacheKey = symbol;
            const cached = cache.get(cacheKey);
            
            if (cached && Date.now() - cached.timestamp < CACHE_DURATION) {
                return cached.data;
            }
            
            try {
                const response = await fetch(`${BINANCE_API}/ticker/24hr?symbol=${symbol}`);
                
                if (!response.ok) {
                    throw new Error(`API Hatası: ${response.status}`);
                }
                
                const ticker = await response.json();
                const volume = parseFloat(ticker.quoteVolume);
                const minVolume = parseInt(document.getElementById('minVolume').value);
                
                if (volume >= minVolume) {
                    const data = {
                        symbol: ticker.symbol,
                        volume: volume,
                        price: parseFloat(ticker.lastPrice),
                        priceChange: parseFloat(ticker.priceChangePercent),
                        timestamp: Date.now()
                    };
                    
                    cache.set(cacheKey, { data, timestamp: Date.now() });
                    
                    return data;
                }
                
                return null;
                
            } catch (error) {
                throw error;
            }
        }

        // ============================================
        // UI Güncelleme
        // ============================================

        function updateWhaleCard(data) {
            let card = document.querySelector(`[data-symbol="${data.symbol}"]`);
            
            if (!card) {
                card = createWhaleCard(data);
                document.getElementById('whaleGrid').prepend(card);
                
                const whaleCount = document.querySelectorAll('.whale-card').length;
                document.getElementById('whaleCount').textContent = whaleCount;
            } else {
                updateExistingCard(card, data);
            }
        }

        function createWhaleCard(data) {
            const card = document.createElement('div');
            card.className = 'whale-card';
            card.setAttribute('data-symbol', data.symbol);
            
            const priceChangeClass = data.priceChange >= 0 ? 'high' : '';
            const priceChangeIcon = data.priceChange >= 0 ? '📈' : '📉';
            
            card.innerHTML = `
                <div class="coin-header">
                    <div class="coin-name">${data.symbol}</div>
                    <div class="price">$${formatNumber(data.price)}</div>
                </div>
                <div class="volume-info">
                    <div class="volume-row">
                        <span class="label">24h Hacim:</span>
                        <span class="value high">$${formatVolume(data.volume)}</span>
                    </div>
                    <div class="volume-row">
                        <span class="label">Değişim:</span>
                        <span class="value ${priceChangeClass}">
                            ${priceChangeIcon} ${data.priceChange.toFixed(2)}%
                        </span>
                    </div>
                </div>
                <div class="timestamp">
                    ${new Date(data.timestamp).toLocaleTimeString('tr-TR')}
                </div>
            `;
            
            return card;
        }

        function updateExistingCard(card, data) {
            const priceChangeClass = data.priceChange >= 0 ? 'high' : '';
            const priceChangeIcon = data.priceChange >= 0 ? '📈' : '📉';
            
            card.querySelector('.price').textContent = `$${formatNumber(data.price)}`;
            card.querySelector('.value.high').textContent = `$${formatVolume(data.volume)}`;
            
            const changeElement = card.querySelectorAll('.value')[1];
            changeElement.className = `value ${priceChangeClass}`;
            changeElement.innerHTML = `${priceChangeIcon} ${data.priceChange.toFixed(2)}%`;
            
            card.querySelector('.timestamp').textContent = 
                new Date(data.timestamp).toLocaleTimeString('tr-TR');
        }

        // ============================================
        // Yardımcı Fonksiyonlar
        // ============================================

        function formatNumber(num) {
            if (num >= 1) {
                return num.toFixed(2);
            } else if (num >= 0.01) {
                return num.toFixed(4);
            } else {
                return num.toFixed(8);
            }
        }

        function formatVolume(volume) {
            if (volume >= 1000000000) {
                return (volume / 1000000000).toFixed(2) + 'B';
            } else if (volume >= 1000000) {
                return (volume / 1000000).toFixed(2) + 'M';
            } else if (volume >= 1000) {
                return (volume / 1000).toFixed(2) + 'K';
            }
            return volume.toFixed(2);
        }

        function showLoading(show) {
            document.getElementById('loading').style.display = show ? 'block' : 'none';
        }

        function showError(message) {
            const errorDiv = document.getElementById('error');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            
            setTimeout(() => {
                errorDiv.style.display = 'none';
            }, 5000);
        }

        // ============================================
        // Kontrol Fonksiyonları
        // ============================================

        function startScanning() {
            if (isScanning) return;
            
            isScanning = true;
            whaleData = [];
            scanCount = 0;
            
            document.getElementById('startBtn').disabled = true;
            document.getElementById('stopBtn').disabled = false;
            
            const scanMode = document.getElementById('scanMode').value;
            
            console.log(`🚀 Tarama başlatıldı - Mod: ${scanMode}`);
            
            switch (scanMode) {
                case 'websocket':
                    initWebSocket();
                    fetchBatchData();
                    break;
                    
                case 'batch':
                    fetchBatchData();
                    scanInterval = setInterval(fetchBatchData, 15000);
                    break;
                    
                case 'legacy':
                    fetchLegacyData();
                    scanInterval = setInterval(fetchLegacyData, 20000);
                    break;
            }
        }

        function stopScanning() {
            if (!isScanning) return;
            
            isScanning = false;
            
            document.getElementById('startBtn').disabled = false;
            document.getElementById('stopBtn').disabled = true;
            
            if (wsConnection) {
                wsConnection.close();
                wsConnection = null;
            }
            
            if (scanInterval) {
                clearInterval(scanInterval);
                scanInterval = null;
            }
            
            updateWSStatus(false);
            console.log('⏹️ Tarama durduruldu');
        }

        function clearResults() {
            const whaleGrid = document.getElementById('whaleGrid');
            whaleGrid.innerHTML = '';
            whaleData = [];
            cache.clear();
            scanCount = 0;
            
            document.getElementById('scanCount').textContent = '0';
            document.getElementById('whaleCount').textContent = '0';
            
            console.log('🗑️ Sonuçlar temizlendi');
        }

        // ============================================
        // Otomatik Temizlik
        // ============================================

        function cleanOldCache() {
            const now = Date.now();
            for (const [key, value] of cache.entries()) {
                if (now - value.timestamp > CACHE_DURATION) {
                    cache.delete(key);
                }
            }
        }

        setInterval(cleanOldCache, 30000);

        // ============================================
        // Sayfa Yüklendiğinde
        // ============================================

        document.addEventListener('DOMContentLoaded', () => {
            console.log('🐋 Whale Tracker Optimized yüklendi');
            
            document.getElementById('minVolume').addEventListener('change', () => {
                if (isScanning) {
                    console.log('ℹ️ Minimum hacim değişti, taramayı yeniden başlatın');
                }
            });
            
            document.getElementById('scanMode').addEventListener('change', () => {
                if (isScanning) {
                    const confirmed = confirm('Mod değişikliği için taramayı yeniden başlatmak gerekiyor. Devam edilsin mi?');
                    if (confirmed) {
                        stopScanning();
                        setTimeout(() => startScanning(), 1000);
                    }
                }
            });
        });

        // ============================================
        // Klavye Kısayolları
        // ============================================

        document.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.code === 'Space') {
                e.preventDefault();
                if (isScanning) {
                    stopScanning();
                } else {
                    startScanning();
                }
            }
            
            if ((e.ctrlKey || e.metaKey) && e.code === 'Delete') {
                e.preventDefault();
                clearResults();
            }
        });

        // ============================================
        // Sayfa Kapatılırken
        // ============================================

        window.addEventListener('beforeunload', () => {
            if (wsConnection) {
                wsConnection.close();
            }
            if (scanInterval) {
                clearInterval(scanInterval);
            }
        });

        console.log('✅ Whale Tracker tamamen yüklendi ve hazır!');
    </script>
</body>
</html>

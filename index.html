<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Whale Tracker PRO - Multi Exchange</title>
<style>
    body { font-family: Arial, sans-serif; background: #121212; color: #f1f1f1; margin:0; padding:0;}
    h1 { text-align:center; margin-top:20px;}
    table { width: 95%; margin: 20px auto; border-collapse: collapse;}
    th, td { border: 1px solid #555; padding: 8px; text-align:center;}
    th { background: #222; }
    tr:nth-child(even){ background: #1a1a1a; }
    .fear { color: #ff5555; font-weight:bold;}
    .neutral { color: #ffaa00; font-weight:bold;}
    .greed { color: #55ff55; font-weight:bold;}
</style>
</head>
<body>

<h1>Whale Tracker PRO - Multi Exchange</h1>
<div style="text-align:center;">
    Fear & Greed Index: <span id="fearIndex">Loading...</span>
</div>

<table id="tradeTable">
    <thead>
        <tr>
            <th>Exchange</th>
            <th>Coin</th>
            <th>Side</th>
            <th>Amount</th>
            <th>Price</th>
            <th>Time</th>
        </tr>
    </thead>
    <tbody></tbody>
</table>

<script>
// -------------------- WHALE THRESHOLDS --------------------
const WHALE_THRESHOLDS = {
    'BTC': 9, 'ETH': 90, 'ADA': 50000, 'DOT': 5000, 'LINK': 5000,
    'MATIC': 50000, 'AVAX': 2000, 'SOL': 500, 'DOGE': 500000,
    'XRP': 50000, 'LTC': 1000, 'BCH': 500, 'ETC': 5000, 'TRX': 500000, 'EOS': 50000
};

// -------------------- TRADE TABLO --------------------
const tbody = document.querySelector("#tradeTable tbody");
function addTrade(coin, side, amount, price, exchange) {
    const tr = document.createElement("tr");
    tr.innerHTML = `<td>${exchange}</td><td>${coin}</td><td>${side}</td><td>${amount}</td><td>${price}</td><td>${new Date().toLocaleTimeString()}</td>`;
    tbody.prepend(tr);
    if(tbody.childElementCount > 50) tbody.removeChild(tbody.lastChild); // sadece son 50 göster
}

// -------------------- BINANCE WS --------------------
const binanceWs = new WebSocket("wss://stream.binance.com:9443/ws/!miniTicker@arr");
binanceWs.onmessage = (msg) => {
    const data = JSON.parse(msg.data);
    data.forEach(t => {
        const symbol = t.s;
        const coin = symbol.replace("USDT","");
        const amount = parseFloat(t.c);
        if(WHALE_THRESHOLDS[coin] && amount >= WHALE_THRESHOLDS[coin]){
            addTrade(coin, "BUY/SELL", amount, t.c, "Binance");
        }
    });
};

// -------------------- BYBIT WS --------------------
const bybitWs = new WebSocket("wss://stream.bybit.com/realtime_public");
bybitWs.onopen = () => bybitWs.send(JSON.stringify({op:"subscribe", args:["trade.BTCUSD","trade.ETHUSD"]}));
bybitWs.onmessage = (msg) => {
    const data = JSON.parse(msg.data);
    if(data.topic && data.data){
        data.data.forEach(t => {
            const coin = t.symbol.replace("USD","");
            const amount = parseFloat(t.size);
            if(WHALE_THRESHOLDS[coin] && amount >= WHALE_THRESHOLDS[coin]){
                addTrade(coin, t.side, amount, t.price, "Bybit");
            }
        });
    }
};

// -------------------- COINEX WS --------------------
const coinexWs = new WebSocket("wss://socket.coinex.com/");
coinexWs.onopen = () => {
    ["BTCUSDT","ETHUSDT","SOLUSDT","DOGEUSDT"].forEach(sym=>{
        coinexWs.send(JSON.stringify({method:"subscribe", params:[`push.trade.${sym}`]}));
    });
});
coinexWs.onmessage = (msg) => {
    const data = JSON.parse(msg.data);
    if(data.method === "push.trade" && data.params){
        const t = data.params[0];
        const coin = t.symbol.replace("USDT","");
        const amount = parseFloat(t.amount);
        if(WHALE_THRESHOLDS[coin] && amount >= WHALE_THRESHOLDS[coin]){
            addTrade(coin, t.side, amount, t.price, "CoinEx");
        }
    }
};

// -------------------- FEAR & GREED INDEX --------------------
const fearIndexDiv = document.getElementById("fearIndex");
async function fetchFearIndex() {
    try {
        const response = await fetch("https://api.alternative.me/fng/?limit=1");
        const data = await response.json();
        if(data && data.data && data.data.length > 0){
            const index = data.data[0].value;
            const valueClass = index < 25 ? "fear" : index > 75 ? "greed" : "neutral";
            fearIndexDiv.innerHTML = `<span class="${valueClass}">${index}</span>`;
        }
    } catch(err){
        console.error("Fear Index çekilemedi:", err);
    }
}
setInterval(fetchFearIndex,60000);
fetchFearIndex();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Whale Tracker Pro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
    :root {
        --bg-color: #0f172a;
        --card-bg: rgba(30, 41, 59, 0.6);
        --card-border: rgba(148, 163, 184, 0.1);
        --text-primary: #e2e8f0;
        --text-secondary: #94a3b8;
        --accent-green: #10b981;
        --accent-red: #ef4444;
        --accent-blue: #3b82f6;
        --glow-green: rgba(16, 185, 129, 0.2);
        --glow-red: rgba(239, 68, 68, 0.2);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
        font-family: 'Inter', sans-serif;
        background-color: var(--bg-color);
        background-image: 
            radial-gradient(circle at 10% 20%, rgba(59, 130, 246, 0.15) 0%, transparent 20%),
            radial-gradient(circle at 90% 80%, rgba(16, 185, 129, 0.1) 0%, transparent 20%);
        color: var(--text-primary);
        font-size: 13px;
        padding-bottom: 20px;
        min-height: 100vh;
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }

    .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 10px;
    }

    /* Header & Stats */
    .header-card {
        background: var(--card-bg);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid var(--card-border);
        border-radius: 12px;
        padding: 15px;
        margin-bottom: 15px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 10px;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    .app-title {
        font-weight: 800;
        font-size: 18px;
        background: linear-gradient(45deg, #fff, #94a3b8);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        letter-spacing: -0.5px;
    }

    .connection-status {
        display: flex;
        gap: 8px;
        font-family: 'JetBrains Mono', monospace;
        font-size: 10px;
    }
    
    .status-dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #475569;
        margin-right: 4px;
        transition: all 0.3s ease;
    }
    .status-dot.active { background: var(--accent-green); box-shadow: 0 0 8px var(--accent-green); }

    .stat-badge {
        background: rgba(15, 23, 42, 0.5);
        padding: 4px 10px;
        border-radius: 6px;
        font-size: 11px;
        border: 1px solid var(--card-border);
    }

    /* Controls */
    .controls {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        padding-bottom: 5px;
        margin-bottom: 15px;
        -webkit-overflow-scrolling: touch;
    }

    .control-btn {
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        color: var(--text-secondary);
        padding: 8px 16px;
        border-radius: 8px;
        font-size: 11px;
        font-weight: 500;
        cursor: pointer;
        white-space: nowrap;
        transition: all 0.2s;
        user-select: none;
    }

    .control-btn.active {
        background: rgba(59, 130, 246, 0.2);
        border-color: rgba(59, 130, 246, 0.4);
        color: #60a5fa;
    }

    input[type="text"] {
        width: 100%;
        background: rgba(15, 23, 42, 0.6);
        border: 1px solid var(--card-border);
        color: white;
        padding: 10px 15px;
        border-radius: 8px;
        font-family: 'Inter', sans-serif;
        margin-bottom: 15px;
        transition: all 0.3s;
    }
    input[type="text"]:focus {
        outline: none;
        border-color: var(--accent-blue);
        box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.1);
    }

    /* Grid Layouts */
    .market-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
        gap: 10px;
        margin-bottom: 20px;
    }

    .market-card {
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: 8px;
        padding: 10px;
        transition: transform 0.2s;
    }
    
    .market-card h4 {
        color: var(--text-secondary);
        font-size: 10px;
        text-transform: uppercase;
        margin-bottom: 4px;
    }
    .market-card .price {
        font-family: 'JetBrains Mono', monospace;
        font-weight: 700;
        font-size: 13px;
    }
    
    /* Tables */
    .table-container {
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: 12px;
        overflow: hidden;
        margin-bottom: 20px;
        backdrop-filter: blur(10px);
    }

    .table-header {
        padding: 12px 15px;
        border-bottom: 1px solid var(--card-border);
        font-weight: 600;
        color: var(--text-primary);
        display: flex;
        justify-content: space-between;
        background: rgba(255,255,255,0.02);
    }

    table {
        width: 100%;
        border-collapse: collapse;
    }

    th {
        text-align: left;
        padding: 10px 12px;
        color: var(--text-secondary);
        font-size: 10px;
        font-weight: 600;
        text-transform: uppercase;
        border-bottom: 1px solid var(--card-border);
        background: rgba(15, 23, 42, 0.3);
    }

    td {
        padding: 8px 12px;
        border-bottom: 1px solid var(--card-border);
        font-family: 'JetBrains Mono', monospace;
        font-size: 11px;
    }

    tr:last-child td { border-bottom: none; }

    /* Colors & Animations */
    .text-green { color: var(--accent-green); }
    .text-red { color: var(--accent-red); }
    .bg-green-glow { background-color: var(--glow-green); }
    .bg-red-glow { background-color: var(--glow-red); }

    .new-trade-anim {
        animation: flashRow 1s ease-out;
    }

    @keyframes flashRow {
        0% { background-color: rgba(255, 255, 255, 0.1); }
        100% { background-color: transparent; }
    }

    .price-cell { font-weight: 700; }
    .coin-cell { font-family: 'Inter', sans-serif; font-weight: 600; color: #fff; }
    
    /* Mobile Responsive Adjustments */
    @media (max-width: 600px) {
        .hide-mobile { display: none; }
        .header-card { flex-direction: column; align-items: stretch; text-align: center; }
        .connection-status { justify-content: center; margin-top: 5px; }
        .stats-row { justify-content: space-between; display: flex; margin-top: 10px; }
        th, td { padding: 8px; }
        .market-grid { grid-template-columns: repeat(2, 1fr); }
    }
</style>
</head>
<body>

<div class="container">
    <div class="header-card">
        <div>
            <div class="app-title">WHALE TRACKER PRO</div>
            <div class="connection-status">
                <span><span class="status-dot" id="wsDot"></span>STREAM</span>
                <span><span class="status-dot" id="apiDot"></span>API</span>
            </div>
        </div>
        <div class="stats-row">
            <span class="stat-badge">F&G: <span id="fearValue" class="text-green">--</span></span>
            <span class="stat-badge">Total: <span id="totalCount">0</span></span>
        </div>
    </div>

    <div class="controls">
        <div class="control-btn active" id="btnSound">🔔 Ses</div>
        <div class="control-btn active" id="btnVibrate">📳 Titreşim</div>
        <div class="control-btn active" id="btnMarket">📊 Market</div>
    </div>

    <div id="marketSection">
        <div class="market-grid" id="marketGrid">
            </div>
    </div>

    <input type="text" id="filterInput" placeholder="Filtrele: BTC, ETH, SOL..." autocomplete="off">

    <div class="table-container">
        <div class="table-header">Özet Tablosu</div>
        <div style="overflow-x: auto;">
            <table id="summaryTable">
                <thead>
                    <tr>
                        <th>Coin</th>
                        <th>Alım (Adet)</th>
                        <th>Satım (Adet)</th>
                        <th>Net Hacim ($)</th>
                    </tr>
                </thead>
                <tbody id="summaryBody">
                    <tr><td colspan="4" style="text-align:center; color:#64748b; padding:20px;">Veri bekleniyor...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="table-container">
        <div class="table-header">Canlı İşlemler</div>
        <div style="overflow-x: auto;">
            <table id="tradesTable">
                <thead>
                    <tr>
                        <th>Saat</th>
                        <th>Coin</th>
                        <th>Yön</th>
                        <th>Fiyat</th>
                        <th>Tutar ($)</th>
                    </tr>
                </thead>
                <tbody id="tradesBody">
                    <tr><td colspan="5" style="text-align:center; color:#64748b; padding:20px;">Bağlantı kuruluyor...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
(function() {
    'use strict';

    // Konfigürasyon
    const THRESHOLDS = {
        btcusdt: 20, ethusdt: 300, bnbusdt: 2000, solusdt: 8000, xrpusdt: 400000,
        adausdt: 800000, dogeusdt: 8000000, avaxusdt: 40000, dotusdt: 80000,
        maticusdt: 800000, linkusdt: 80000, shibusdt: 1200000000, pepeusdt: 40000000000,
        bonkusdt: 8000000000, wifusdt: 200000, fetusdt: 200000, rndrusdt: 40000,
        nearusdt: 80000, filusdt: 40000, injusdt: 20000, imxusdt: 120000,
        flokiusdt: 8000000, fantomusdt: 200000, arbusdt: 400000, opusdt: 120000,
        suiusdt: 120000, aptusdt: 40000, tiausdt: 40000, seiusdt: 200000
    };

    // State
    let trades = [];
    let summaryData = {};
    let marketInfo = {};
    let settings = { sound: true, vibrate: true, market: true };
    let totalTrades = 0;
    let filterText = '';
    let wsConnection = null;
    let audioCtx = null;
    
    // DOM Elements
    const els = {
        tradesBody: document.getElementById('tradesBody'),
        summaryBody: document.getElementById('summaryBody'),
        marketGrid: document.getElementById('marketGrid'),
        wsDot: document.getElementById('wsDot'),
        totalCount: document.getElementById('totalCount'),
        fearValue: document.getElementById('fearValue'),
        filterInput: document.getElementById('filterInput')
    };

    // --- SES ve TİTREŞİM ---
    function initAudio() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playTone(type) {
        if (!settings.sound || !audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        
        osc.frequency.value = type === 'BUY' ? 600 : 300;
        osc.type = 'sine';
        gain.gain.setValueAtTime(0.05, audioCtx.currentTime); // Ses seviyesi düşürüldü
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
        
        osc.start();
        osc.stop(audioCtx.currentTime + 0.1);
    }

    function triggerVibrate(type) {
        if (settings.vibrate && navigator.vibrate) {
            navigator.vibrate(type === 'BUY' ? 50 : [30, 30]);
        }
    }

    // --- FORMATLAMA ---
    const fmtNum = (n) => {
        if (n >= 1e6) return (n/1e6).toFixed(2) + 'M';
        if (n >= 1e3) return (n/1e3).toFixed(1) + 'K';
        return n.toFixed(0);
    };
    
    const fmtUSD = (n) => new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 }).format(n);

    // --- LOGIC ---
    function processTrade(data) {
        // Data format: {s: symbol, q: quantity, p: price, m: isBuyerMaker (true=SELL, false=BUY)}
        const symbol = data.s.toLowerCase();
        // Combined stream'den gelen veri yapısı farklı olabilir, kontrol edelim
        const coin = symbol.replace('usdt', '').toUpperCase();
        
        if (!THRESHOLDS[symbol]) return; // Takip listemizde yoksa geç
        
        const qty = parseFloat(data.q);
        const price = parseFloat(data.p);
        
        if (qty < THRESHOLDS[symbol]) return; // Eşik altıysa geç

        const side = data.m ? 'SELL' : 'BUY';
        const usd = qty * price;
        const timeStr = new Date().toLocaleTimeString('tr-TR', {hour:'2-digit', minute:'2-digit', second:'2-digit'});

        // Trade Ekle
        const trade = { coin, side, price, qty, usd, time: timeStr, id: Date.now() + Math.random() };
        trades.unshift(trade);
        if (trades.length > 50) trades.pop();
        
        // Özet Güncelle
        if (!summaryData[coin]) summaryData[coin] = { buy:0, sell:0, net:0 };
        if (side === 'BUY') {
            summaryData[coin].buy += qty;
            summaryData[coin].net += usd;
        } else {
            summaryData[coin].sell += qty;
            summaryData[coin].net -= usd;
        }

        totalTrades++;
        playTone(side);
        triggerVibrate(side);
        
        // Render işlemlerini hemen yapmıyoruz, throttle fonksiyonu yapacak
        requestAnimationFrame(renderUI);
    }

    // --- RENDER ---
    let lastRender = 0;
    function renderUI() {
        const now = Date.now();
        if (now - lastRender < 250) return; // 250ms Throttle (iPhone kasmaması için çok önemli)
        lastRender = now;

        els.totalCount.textContent = totalTrades;

        // 1. Trades Table
        let displayTrades = trades;
        if (filterText) {
            displayTrades = trades.filter(t => t.coin.includes(filterText));
        }

        let html = '';
        displayTrades.slice(0, 20).forEach((t, i) => {
            const colorClass = t.side === 'BUY' ? 'text-green' : 'text-red';
            const animClass = i === 0 ? 'new-trade-anim' : '';
            html += `<tr class="${animClass}">
                <td style="color:#64748b">${t.time}</td>
                <td class="coin-cell">${t.coin}</td>
                <td class="${colorClass}" style="font-weight:700">${t.side}</td>
                <td class="price-cell">$${t.price < 1 ? t.price.toFixed(4) : t.price.toFixed(2)}</td>
                <td style="color:#e2e8f0">$${fmtNum(t.usd)}</td>
            </tr>`;
        });
        els.tradesBody.innerHTML = html || '<tr><td colspan="5" style="text-align:center; padding:10px;">İşlem yok</td></tr>';

        // 2. Summary Table
        const summaryArr = Object.entries(summaryData)
            .map(([k, v]) => ({ coin: k, ...v }))
            .sort((a, b) => Math.abs(b.net) - Math.abs(a.net)); // En yüksek hacme göre sırala

        let sumHtml = '';
        summaryArr.filter(i => i.coin.includes(filterText)).slice(0, 10).forEach(item => {
            const netColor = item.net > 0 ? 'text-green' : 'text-red';
            const netPrefix = item.net > 0 ? '+' : '';
            sumHtml += `<tr>
                <td class="coin-cell">${item.coin}</td>
                <td class="text-green">${fmtNum(item.buy)}</td>
                <td class="text-red">${fmtNum(item.sell)}</td>
                <td class="${netColor}" style="font-weight:700">${netPrefix}${fmtNum(item.net)} $</td>
            </tr>`;
        });
        els.summaryBody.innerHTML = sumHtml || '<tr><td colspan="4" style="text-align:center;">Veri yok</td></tr>';
    }

    // --- SOCKET MANAGEMENT ---
    function connectSocket() {
        // PERFORMANS ÇÖZÜMÜ: Tek bir socket stringi oluşturuyoruz
        const streams = Object.keys(THRESHOLDS).map(s => `${s}@aggTrade`).join('/');
        // Market ticker için ana coinleri ekleyelim
        const tickerStreams = 'btcusdt@ticker/ethusdt@ticker/solusdt@ticker/bnbusdt@ticker';
        
        const url = `wss://fstream.binance.com/stream?streams=${streams}/${tickerStreams}`;
        
        wsConnection = new WebSocket(url);

        wsConnection.onopen = () => {
            els.wsDot.classList.add('active');
            console.log('Socket Connected');
        };

        wsConnection.onmessage = (e) => {
            const msg = JSON.parse(e.data);
            // msg.data asıl veriyi içerir, msg.stream stream adını içerir
            
            if (msg.stream.includes('@aggTrade')) {
                processTrade(msg.data);
            } else if (msg.stream.includes('@ticker')) {
                updateMarketTicker(msg.data);
            }
        };

        wsConnection.onclose = () => {
            els.wsDot.classList.remove('active');
            setTimeout(connectSocket, 5000);
        };
    }

    function updateMarketTicker(data) {
        if (!settings.market) return;
        
        const symbol = data.s.replace('USDT','');
        const change = parseFloat(data.P);
        const price = parseFloat(data.c);
        
        marketInfo[symbol] = { price, change };
        
        // Market grid render
        if (Math.random() > 0.7) { // Her tick'te render etme, CPU koru
            let html = '';
            Object.keys(marketInfo).forEach(sym => {
                const info = marketInfo[sym];
                const color = info.change >= 0 ? 'text-green' : 'text-red';
                const sign = info.change >= 0 ? '+' : '';
                html += `<div class="market-card">
                    <h4>${sym}</h4>
                    <div class="price">$${info.price < 10 ? info.price.toFixed(3) : info.price.toFixed(1)}</div>
                    <div class="${color}" style="font-size:11px;">${sign}${info.change}%</div>
                </div>`;
            });
            els.marketGrid.innerHTML = html;
        }
    }

    // --- INIT & EVENTS ---
    
    // Buton Kontrolleri
    document.getElementById('btnSound').onclick = function() {
        settings.sound = !settings.sound;
        this.classList.toggle('active');
        initAudio(); // iOS için ilk tıklamada ses bağlamını aç
    };
    document.getElementById('btnVibrate').onclick = function() {
        settings.vibrate = !settings.vibrate;
        this.classList.toggle('active');
    };
    document.getElementById('btnMarket').onclick = function() {
        settings.market = !settings.market;
        this.classList.toggle('active');
        document.getElementById('marketSection').style.display = settings.market ? 'block' : 'none';
    };

    els.filterInput.addEventListener('input', (e) => {
        filterText = e.target.value.toUpperCase();
        renderUI();
    });

    // Korku & Açgözlülük Verisi
    fetch('https://api.alternative.me/fng/?limit=1')
        .then(r => r.json())
        .then(d => {
            const val = d.data[0].value;
            els.fearValue.textContent = val;
            els.fearValue.className = val > 50 ? 'text-green' : 'text-red';
            document.getElementById('apiDot').classList.add('active');
        });

    // Başlat
    connectSocket();

    // Otomatik Temizlik (Bellek Sızıntısını Önler)
    setInterval(() => {
        if (trades.length > 200) trades = trades.slice(0, 100);
        // Çok eski özet verileri silinebilir
    }, 60000);

})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coin Sinyal Takip</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #2c3e50, #3498db);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .header p {
            opacity: 0.9;
            font-size: 1.1em;
        }
        
        .controls {
            padding: 30px;
            background: #f8f9fa;
            border-bottom: 1px solid #e9ecef;
        }
        
        .input-group {
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }
        
        .coin-input {
            flex: 1;
            min-width: 200px;
            padding: 15px 20px;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s ease;
        }
        
        .coin-input:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.1);
        }
        
        .volume-input {
            width: 150px;
            padding: 15px 20px;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            font-size: 16px;
        }
        
        .search-btn {
            background: linear-gradient(135deg, #00b894, #00a085);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .search-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 184, 148, 0.3);
        }
        
        .search-btn:disabled {
            background: #b2bec3;
            cursor: not-allowed;
            transform: none;
        }
        
        .results {
            padding: 30px;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #636e72;
            font-size: 1.1em;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .signal-card {
            background: white;
            border: 1px solid #e9ecef;
            border-radius: 10px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
            transition: all 0.3s ease;
        }
        
        .signal-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }
        
        .signal-header {
            display: flex;
            justify-content: between;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .coin-symbol {
            font-size: 1.4em;
            font-weight: bold;
            color: #2d3436;
        }
        
        .volume-badge {
            background: linear-gradient(135deg, #fd79a8, #e84393);
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9em;
        }
        
        .signal-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }
        
        .detail-item {
            display: flex;
            flex-direction: column;
        }
        
        .detail-label {
            font-size: 0.85em;
            color: #636e72;
            margin-bottom: 5px;
        }
        
        .detail-value {
            font-size: 1.1em;
            font-weight: 600;
            color: #2d3436;
        }
        
        .error {
            background: #ffeaa7;
            border: 1px solid #fdcb6e;
            color: #e17055;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            margin: 20px 0;
        }
        
        .info-text {
            text-align: center;
            color: #636e72;
            padding: 20px;
            font-style: italic;
        }
        
        @media (max-width: 768px) {
            .container {
                margin: 10px;
            }
            
            .header h1 {
                font-size: 2em;
            }
            
            .input-group {
                flex-direction: column;
            }
            
            .coin-input, .volume-input, .search-btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 Coin Sinyal Takip</h1>
            <p>Belirlediğiniz coin için 100K+ işlem sinyallerini takip edin</p>
        </div>
        
        <div class="controls">
            <div class="input-group">
                <input 
                    type="text" 
                    class="coin-input" 
                    placeholder="Coin sembolü girin (Örnek: BTC, ETH, ADA...)" 
                    value="BTC"
                >
                <input 
                    type="number" 
                    class="volume-input" 
                    placeholder="Min hacim" 
                    value="100000"
                    min="1000"
                    step="1000"
                >
                <button class="search-btn" onclick="searchSignals()">
                    Sinyalleri Ara
                </button>
            </div>
        </div>
        
        <div class="results" id="results">
            <div class="info-text">
                Coin sembolünü girip "Sinyalleri Ara" butonuna tıklayın
            </div>
        </div>
    </div>

    <script>
        async function searchSignals() {
            const coinInput = document.querySelector('.coin-input');
            const volumeInput = document.querySelector('.volume-input');
            const searchBtn = document.querySelector('.search-btn');
            const resultsDiv = document.getElementById('results');
            
            const coinSymbol = coinInput.value.trim().toUpperCase();
            const minVolume = parseInt(volumeInput.value);
            
            if (!coinSymbol) {
                showError('Lütfen bir coin sembolü girin');
                return;
            }
            
            // Butonu devre dışı bırak ve loading göster
            searchBtn.disabled = true;
            searchBtn.textContent = 'Aranıyor...';
            resultsDiv.innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <div>${coinSymbol} için ${minVolume.toLocaleString()} USD üzeri sinyaller aranıyor...</div>
                </div>
            `;
            
            try {
                // Örnek sinyal verileri - gerçek uygulamada API'den gelecek
                const signals = await simulateAPICall(coinSymbol, minVolume);
                displayResults(signals, coinSymbol, minVolume);
            } catch (error) {
                showError('Sinyaller alınırken hata oluştu: ' + error.message);
            } finally {
                // Butonu tekrar aktif et
                searchBtn.disabled = false;
                searchBtn.textContent = 'Sinyalleri Ara';
            }
        }
        
        function simulateAPICall(coinSymbol, minVolume) {
            return new Promise((resolve) => {
                // Gerçek uygulamada burada aggr.trade API'sine bağlanacaksınız
                setTimeout(() => {
                    // Örnek veriler - rastgele sinyaller üretiyoruz
                    const signals = [];
                    const baseSymbol = coinSymbol + 'USDT';
                    const signalCount = Math.floor(Math.random() * 8) + 3; // 3-10 arası sinyal
                    
                    for (let i = 0; i < signalCount; i++) {
                        const volume = minVolume + Math.random() * minVolume * 2;
                        const price = 100 + Math.random() * 1000;
                        const amount = volume / price;
                        
                        signals.push({
                            id: Math.random().toString(36).substr(2, 9),
                            symbol: baseSymbol,
                            volume: volume,
                            price: price,
                            amount: amount,
                            type: Math.random() > 0.5 ? 'BUY' : 'SELL',
                            timestamp: new Date(Date.now() - Math.random() * 3600000).toISOString()
                        });
                    }
                    
                    // Hacime göre sırala
                    signals.sort((a, b) => b.volume - a.volume);
                    resolve(signals);
                }, 1500);
            });
        }
        
        function displayResults(signals, coinSymbol, minVolume) {
            const resultsDiv = document.getElementById('results');
            
            if (signals.length === 0) {
                resultsDiv.innerHTML = `
                    <div class="info-text">
                        ${coinSymbol} için ${minVolume.toLocaleString()} USD üzeri sinyal bulunamadı
                    </div>
                `;
                return;
            }
            
            let html = `
                <div style="margin-bottom: 20px; font-size: 1.1em; color: #2d3436;">
                    <strong>${coinSymbol}</strong> için <strong>${minVolume.toLocaleString()} USD</strong> üzeri 
                    <strong>${signals.length}</strong> sinyal bulundu:
                </div>
            `;
            
            signals.forEach(signal => {
                const date = new Date(signal.timestamp);
                const volumeFormatted = formatVolume(signal.volume);
                const priceFormatted = formatPrice(signal.price);
                const amountFormatted = formatAmount(signal.amount);
                
                html += `
                    <div class="signal-card">
                        <div class="signal-header">
                            <div class="coin-symbol">${signal.symbol}</div>
                            <div class="volume-badge">${volumeFormatted}</div>
                        </div>
                        <div class="signal-details">
                            <div class="detail-item">
                                <span class="detail-label">İşlem Türü</span>
                                <span class="detail-value" style="color: ${signal.type === 'BUY' ? '#00b894' : '#e17055'}">
                                    ${signal.type === 'BUY' ? '🟢 ALIM' : '🔴 SATIM'}
                                </span>
                            </div>
                            <div class="detail-item">
                                <span class="detail-label">Fiyat</span>
                                <span class="detail-value">${priceFormatted} USD</span>
                            </div>
                            <div class="detail-item">
                                <span class="detail-label">Miktar</span>
                                <span class="detail-value">${amountFormatted} ${coinSymbol}</span>
                            </div>
                            <div class="detail-item">
                                <span class="detail-label">Zaman</span>
                                <span class="detail-value">${date.toLocaleTimeString('tr-TR')}</span>
                            </div>
                        </div>
                    </div>
                `;
            });
            
            resultsDiv.innerHTML = html;
        }
        
        function showError(message) {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = `
                <div class="error">
                    ${message}
                </div>
            `;
        }
        
        function formatVolume(volume) {
            if (volume >= 1000000) {
                return (volume / 1000000).toFixed(2) + 'M USD';
            } else if (volume >= 1000) {
                return (volume / 1000).toFixed(1) + 'K USD';
            }
            return volume.toFixed(0) + ' USD';
        }
        
        function formatPrice(price) {
            return price.toFixed(2);
        }
        
        function formatAmount(amount) {
            if (amount >= 1) {
                return amount.toFixed(4);
            }
            return amount.toFixed(8);
        }
        
        // Enter tuşu ile arama yapma
        document.querySelector('.coin-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                searchSignals();
            }
        });
        
        document.querySelector('.volume-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                searchSignals();
            }
        });
    </script>
</body>
</html>

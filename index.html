<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Whale Tracker</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { 
    font-family: 'Courier New', monospace;
    background: #000;
    color: #0f0; 
    padding: 5px;
    font-size: 11px;
    line-height: 1.3;
}
.h { border-bottom: 1px solid #0f0; padding: 5px 0; margin-bottom: 5px; }
.h span { margin-right: 15px; }
input { 
    width: 100%;
    background: #000;
    border: 1px solid #0f0;
    color: #0f0;
    padding: 3px;
    font-family: 'Courier New', monospace;
    font-size: 11px;
    margin: 5px 0;
}
.tbl { margin: 5px 0; }
.row { border-bottom: 1px dotted #333; padding: 2px 0; }
.row:hover { background: #111; }
.g { color: #0f0; }
.r { color: #f00; }
.y { color: #ff0; }
.c { color: #0ff; }
.gr { color: #666; }
</style>
</head>
<body>

<div class="h">
<span>WHALE TRACKER</span>
<span id="st" class="gr">●WS ●API</span>
<span>F&G:<span id="fg" class="gr">--</span></span>
<span>CNT:<span id="cnt" class="c">0</span></span>
<span>4H:<span id="h4" class="c">0</span></span>
</div>

<input type="text" id="flt" placeholder="FILTER: BTC ETH..." />

<div class="tbl" id="sum"></div>
<div class="tbl" id="trd"></div>

<script>
(function() {
var T = {
btcusdt:6,ethusdt:90,bnbusdt:600,solusdt:2400,xrpusdt:120000,adausdt:240000,
dogeusdt:2400000,dotusdt:24000,maticusdt:240000,linkusdt:24000,avaxusdt:12000,
ltcusdt:6000,bchusdt:3600,uniusdt:12000,atomusdt:12000,etcusdt:60000,nearusdt:24000,
aptusdt:12000,arbusdt:120000,opusdt:36000,ldousdt:60000,injusdt:6000,stxusdt:60000,
filusdt:12000,suiusdt:36000,imxusdt:36000,tiausdt:12000,seiusdt:60000,hbarusdt:240000,
rndrusdt:12000,fetusdt:60000,taousdt:1200,arusdt:24000,wldusdt:36000,flokiusdt:2400000,
pepeusdt:12000000000,shibusdt:360000000,wifusdt:60000,bonkusdt:2400000000,jupusdt:60000,
pythusdt:120000,trbusdt:2400,icpusdt:12000,runeusdt:12000,aaveusdt:1200,mkrusdt:240,
grtusdt:240000,ftmusdt:60000,algousdt:120000,qntusdt:600,sandusdt:120000,manausdt:120000,
axsusdt:24000,galausdt:240000,chzusdt:240000,apeusdt:36000,gmxusdt:2400,blurusdt:36000,
pendleusdt:24000
};

var t=[],c=0,w=[],cn=0,f='';
var te=document.getElementById('trd'),se=document.getElementById('sum');
var cne=document.getElementById('cnt'),h4e=document.getElementById('h4');
var fge=document.getElementById('fg'),ste=document.getElementById('st');
var fe=document.getElementById('flt');

function n(v){
if(v>=1e6)return(v/1e6).toFixed(1)+'M';
if(v>=1e3)return(v/1e3).toFixed(1)+'K';
return v.toFixed(0);
}

function us(){
var d={};
t.forEach(function(x){
if(!d[x.c])d[x.c]={b:0,s:0,bu:0,su:0};
if(x.si=='BUY'){d[x.c].b+=x.a;d[x.c].bu+=x.u;}
else{d[x.c].s+=x.a;d[x.c].su+=x.u;}
});
var a=Object.keys(d).map(function(k){
return{c:k,b:d[k].b,s:d[k].s,bu:d[k].bu,su:d[k].su,t:d[k].bu+d[k].su};
}).sort(function(x,y){return y.t-x.t;});
if(f)a=a.filter(function(x){return x.c.indexOf(f)!==-1;});
var h='<div class="row gr">COIN      BUY         SELL        USD</div>';
var tb=0,ts=0,tu=0;
a.forEach(function(x){
tb+=x.b;ts+=x.s;tu+=x.t;
h+='<div class="row"><span class="c">'+x.c.padEnd(10)+'</span>'+
'<span class="g">'+n(x.b).padEnd(12)+'</span>'+
'<span class="r">'+n(x.s).padEnd(12)+'</span>'+
'<span class="y">$'+n(x.t)+'</span></div>';
});
h+='<div class="row"><span class="y">TOTAL'.padEnd(10)+'</span>'+
'<span class="g">'+n(tb).padEnd(12)+'</span>'+
'<span class="r">'+n(ts).padEnd(12)+'</span>'+
'<span class="y">$'+n(tu)+'</span></div>';
se.innerHTML=h;
}

function ut(){
cne.textContent=c;
h4e.textContent=t.filter(function(x){return x.ts>Date.now()-14400000;}).length;
var a=f?t.filter(function(x){return x.c.indexOf(f)!==-1;}):t;
if(!a.length){te.innerHTML='<div class="gr">WAITING...</div>';return;}
var h='';
a.slice(0,50).forEach(function(x){
var cl=x.si=='BUY'?'g':'r';
h+='<div class="row"><span class="c">'+x.c.padEnd(6)+'</span>'+
'<span class="'+cl+'">'+x.si.padEnd(5)+'</span>'+
'<span class="y">$'+n(x.u).padEnd(8)+'</span>'+
'<span class="gr">'+x.tm+'</span></div>';
});
te.innerHTML=h;
}

function ad(co,si,a,p){
t.unshift({c:co,si:si,a:a,p:p,u:a*p,tm:new Date().toLocaleTimeString('tr-TR'),ts:Date.now()});
if(t.length>100)t.pop();
c++;ut();us();
}

function co(s,th){
var ws=new WebSocket('wss://fstream.binance.com/ws/'+s+'@aggTrade');
ws.onopen=function(){cn++;if(cn==1)ste.innerHTML='<span class="g">●WS</span> <span class="gr">●API</span>';ut();};
ws.onmessage=function(e){
try{
var d=JSON.parse(e.data),q=parseFloat(d.q),p=parseFloat(d.p);
if(q>=th)ad(s.replace('usdt','').toUpperCase(),d.m?'SELL':'BUY',q,p);
}catch(x){}
};
ws.onclose=function(){cn--;if(!cn)ste.innerHTML='<span class="gr">●WS ●API</span>';
setTimeout(function(){co(s,th);},3000);};
w.push(ws);
}

function ff(){
fetch('https://api.alternative.me/fng/?limit=1')
.then(function(r){return r.json();})
.then(function(d){
ste.innerHTML='<span class="g">●WS ●API</span>';
if(d&&d.data&&d.data[0]){
var v=parseInt(d.data[0].value);
fge.innerHTML='<span class="'+(v<25?'r':v>75?'g':'y')+'">'+v+'</span>';
}
}).catch(function(){ste.innerHTML='<span class="g">●WS</span> <span class="gr">●API</span>';});
}

fe.addEventListener('input',function(e){f=e.target.value.toUpperCase().trim();us();ut();});

Object.keys(T).forEach(function(s){co(s,T[s]);});
ff();setInterval(ff,300000);
setInterval(function(){
t=t.filter(function(x){return x.ts>Date.now()-14400000;});ut();us();
},60000);

})();
</script>
</body>
</html>

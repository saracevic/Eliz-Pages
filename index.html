<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookmap Aggr Trade</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #0a0e14;
            color: #c8ccd4;
            overflow: hidden;
            height: 100vh;
        }

        .container {
            display: grid;
            grid-template-columns: 90px 1fr;
            height: 100vh;
        }

        .price-ladder {
            background: #14181f;
            border-right: 1px solid #1f2937;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            font-size: 13px;
            color: #6b7280;
            font-family: 'Courier New', monospace;
        }

        .price-ladder::-webkit-scrollbar {
            width: 4px;
        }

        .price-ladder::-webkit-scrollbar-track {
            background: #0a0e14;
        }

        .price-ladder::-webkit-scrollbar-thumb {
            background: #374151;
        }

        .price-item {
            padding: 8px 12px;
            text-align: right;
            border-bottom: 1px solid #1f2937;
            transition: all 0.2s;
        }

        .price-item:hover {
            background: #1f2937;
            color: #fff;
        }

        .price-item.current {
            background: #374151;
            color: #fbbf24;
            font-weight: 700;
            box-shadow: 0 0 10px rgba(251, 191, 36, 0.3);
        }

        .right-panel {
            display: flex;
            flex-direction: column;
            background: #0a0e14;
        }

        .header {
            background: #14181f;
            padding: 14px 20px;
            border-bottom: 2px solid #1f2937;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .title {
            font-size: 16px;
            font-weight: 700;
            color: #fff;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .title::before {
            content: "📊";
            font-size: 20px;
        }

        .symbol-selector {
            display: flex;
            gap: 8px;
        }

        .symbol-btn {
            padding: 8px 16px;
            background: #1f2937;
            border: 1px solid #374151;
            border-radius: 6px;
            color: #9ca3af;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .symbol-btn:hover {
            background: #374151;
            border-color: #4b5563;
            color: #fff;
        }

        .symbol-btn.active {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            border-color: #3b82f6;
            color: #fff;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.4);
        }

        .filters {
            background: #14181f;
            padding: 12px 20px;
            border-bottom: 1px solid #1f2937;
            display: flex;
            gap: 20px;
            align-items: center;
            flex-wrap: wrap;
        }

        .filter-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .filter-label {
            font-size: 11px;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }

        .filter-input {
            width: 80px;
            padding: 6px 10px;
            background: #0a0e14;
            border: 1px solid #374151;
            border-radius: 4px;
            color: #e5e7eb;
            font-size: 12px;
            font-family: 'Courier New', monospace;
        }

        .filter-input:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
        }

        .radio-group {
            display: flex;
            gap: 14px;
            align-items: center;
        }

        .radio-label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            cursor: pointer;
            color: #9ca3af;
            font-weight: 500;
        }

        .radio-label input[type="radio"] {
            cursor: pointer;
            accent-color: #3b82f6;
        }

        .table-container {
            flex: 1;
            overflow-y: auto;
            background: #0a0e14;
        }

        .table-container::-webkit-scrollbar {
            width: 8px;
        }

        .table-container::-webkit-scrollbar-track {
            background: #0a0e14;
        }

        .table-container::-webkit-scrollbar-thumb {
            background: #374151;
            border-radius: 4px;
        }

        .table-header {
            display: grid;
            grid-template-columns: 140px 120px 1fr 80px;
            padding: 12px 20px;
            background: #14181f;
            border-bottom: 2px solid #1f2937;
            position: sticky;
            top: 0;
            z-index: 10;
            font-size: 11px;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            font-weight: 700;
        }

        .table-body {
            font-size: 13px;
        }

        .trade-row {
            display: grid;
            grid-template-columns: 140px 120px 1fr 80px;
            padding: 8px 20px;
            border-bottom: 1px solid #1a1f2a;
            animation: slideIn 0.3s ease;
            transition: background 0.2s;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-10px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .trade-row:hover {
            background: #14181f;
        }

        .trade-row.buy {
            background: rgba(16, 185, 129, 0.06);
            border-left: 3px solid #10b981;
        }

        .trade-row.sell {
            background: rgba(239, 68, 68, 0.06);
            border-left: 3px solid #ef4444;
        }

        .trade-row.whale {
            background: rgba(251, 191, 36, 0.15);
            border-left: 4px solid #fbbf24;
            font-weight: 600;
            box-shadow: 0 2px 10px rgba(251, 191, 36, 0.2);
        }

        .trade-time {
            color: #6b7280;
            font-family: 'Courier New', monospace;
            font-size: 12px;
        }

        .trade-price {
            font-weight: 700;
            font-family: 'Courier New', monospace;
            font-size: 14px;
        }

        .trade-row.buy .trade-price {
            color: #10b981;
        }

        .trade-row.sell .trade-price {
            color: #ef4444;
        }

        .trade-size {
            text-align: right;
            color: #e5e7eb;
            font-family: 'Courier New', monospace;
        }

        .trade-row.whale .trade-size {
            color: #fbbf24;
        }

        .trade-badge {
            text-align: center;
            font-size: 11px;
            font-weight: 700;
            padding: 4px 8px;
            border-radius: 4px;
        }

        .trade-row.buy .trade-badge {
            background: #10b981;
            color: #fff;
        }

        .trade-row.sell .trade-badge {
            background: #ef4444;
            color: #fff;
        }

        .trade-row.whale .trade-badge {
            background: #fbbf24;
            color: #000;
        }

        .status-bar {
            background: #14181f;
            padding: 10px 20px;
            border-top: 2px solid #1f2937;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
        }

        .status-left {
            display: flex;
            gap: 24px;
            color: #6b7280;
        }

        .status-item {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .status-label {
            color: #6b7280;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .status-value {
            color: #fff;
            font-weight: 700;
            font-family: 'Courier New', monospace;
        }

        .status-value.buy {
            color: #10b981;
        }

        .status-value.sell {
            color: #ef4444;
        }

        .status-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #10b981;
            animation: pulse 2s infinite;
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.6);
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.2); }
        }

        .status-text {
            color: #10b981;
            font-weight: 700;
            font-size: 13px;
            letter-spacing: 1px;
        }

        .whale-alert {
            position: fixed;
            top: 20px;
            right: 20px;
            background: linear-gradient(135deg, #14181f, #1f2937);
            border: 2px solid #fbbf24;
            border-radius: 8px;
            padding: 16px 20px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
            transform: translateX(400px);
            transition: transform 0.4s ease;
            z-index: 1000;
            min-width: 320px;
        }

        .whale-alert.show {
            transform: translateX(0);
        }

        .whale-alert-title {
            font-size: 14px;
            font-weight: 800;
            color: #fbbf24;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .whale-alert-message {
            font-size: 14px;
            color: #e5e7eb;
            font-family: 'Courier New', monospace;
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 70px 1fr;
            }

            .header {
                flex-direction: column;
                gap: 10px;
            }

            .symbol-selector {
                width: 100%;
                justify-content: space-between;
            }

            .table-header {
                grid-template-columns: 120px 100px 1fr 70px;
            }

            .trade-row {
                grid-template-columns: 120px 100px 1fr 70px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="price-ladder" id="priceLadder"></div>

        <div class="right-panel">
            <div class="header">
                <div class="title">Aggr Trade</div>
                <div class="symbol-selector">
                    <button class="symbol-btn active" data-symbol="BTCUSDT">BTC</button>
                    <button class="symbol-btn" data-symbol="ETHUSDT">ETH</button>
                    <button class="symbol-btn" data-symbol="SOLUSDT">SOL</button>
                    <button class="symbol-btn" data-symbol="XRPUSDT">XRP</button>
                </div>
            </div>

            <div class="filters">
                <div class="filter-group">
                    <label class="filter-label">Min Size</label>
                    <input type="number" class="filter-input" id="minSizeInput" placeholder="0.1" step="0.01">
                </div>
                <div class="filter-group">
                    <label class="filter-label">Max Size</label>
                    <input type="number" class="filter-input" id="maxSizeInput" placeholder="100" step="0.1">
                </div>
                <div class="filter-group">
                    <span class="filter-label">Show</span>
                    <div class="radio-group">
                        <label class="radio-label">
                            <input type="radio" name="showFilter" value="all" checked> All
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="showFilter" value="buy"> Buy
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="showFilter" value="sell"> Sell
                        </label>
                    </div>
                </div>
            </div>

            <div class="table-container">
                <div class="table-header">
                    <div>Time</div>
                    <div>Price</div>
                    <div style="text-align: right;">Size</div>
                    <div style="text-align: center;">Type</div>
                </div>
                <div class="table-body" id="tableBody"></div>
            </div>

            <div class="status-bar">
                <div class="status-left">
                    <div class="status-item">
                        <span class="status-label">Buy Vol:</span>
                        <span class="status-value buy" id="buyVol">0</span>
                    </div>
                    <div class="status-item">
                        <span class="status-label">Sell Vol:</span>
                        <span class="status-value sell" id="sellVol">0</span>
                    </div>
                    <div class="status-item">
                        <span class="status-label">Ratio:</span>
                        <span class="status-value" id="ratioVal">0%</span>
                    </div>
                    <div class="status-item">
                        <span class="status-label">Fear & Greed:</span>
                        <span class="status-value" id="fearGreedVal">-</span>
                    </div>
                </div>
                <div class="status-right">
                    <div class="status-dot"></div>
                    <span class="status-text" id="statusText">LIVE</span>
                </div>
            </div>
        </div>
    </div>

    <div class="whale-alert" id="whaleAlert">
        <div class="whale-alert-title">🐋 WHALE DETECTED</div>
        <div class="whale-alert-message" id="whaleMessage"></div>
    </div>

    <script>
        const CONFIG = {
            maxTrades: 500,
            displayThresholds: {
                BTCUSDT: 0.05,
                ETHUSDT: 1,
                SOLUSDT: 20,
                XRPUSDT: 5000
            },
            whaleThresholds: {
                BTCUSDT: 0.5,
                ETHUSDT: 15,
                SOLUSDT: 300,
                XRPUSDT: 50000
            }
        };

        const STATE = {
            currentSymbol: 'BTCUSDT',
            ws: null,
            trades: [],
            allTrades: [],
            volumeData: { buy: 0, sell: 0 },
            filters: {
                minSize: null,
                maxSize: null,
                show: 'all'
            },
            priceRange: { min: 0, max: 0 },
            lastResetTime: Date.now()
        };

        const priceLadder = document.getElementById('priceLadder');
        const tableBody = document.getElementById('tableBody');
        const statusText = document.getElementById('statusText');
        const buyVolEl = document.getElementById('buyVol');
        const sellVolEl = document.getElementById('sellVol');
        const ratioValEl = document.getElementById('ratioVal');
        const fearGreedValEl = document.getElementById('fearGreedVal');
        const whaleAlert = document.getElementById('whaleAlert');
        const whaleMessage = document.getElementById('whaleMessage');
        const minSizeInput = document.getElementById('minSizeInput');
        const maxSizeInput = document.getElementById('maxSizeInput');

        document.querySelectorAll('.symbol-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.symbol-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                STATE.currentSymbol = btn.dataset.symbol;
                resetState();
                connectWebSocket();
            });
        });

        minSizeInput.addEventListener('input', (e) => {
            STATE.filters.minSize = parseFloat(e.target.value) || null;
            applyFilters();
        });

        maxSizeInput.addEventListener('input', (e) => {
            STATE.filters.maxSize = parseFloat(e.target.value) || null;
            applyFilters();
        });

        document.querySelectorAll('input[name="showFilter"]').forEach(radio => {
            radio.addEventListener('change', (e) => {
                STATE.filters.show = e.target.value;
                applyFilters();
            });
        });

        function applyFilters() {
            STATE.trades = STATE.allTrades.filter(trade => {
                if (STATE.filters.minSize && trade.quantity < STATE.filters.minSize) return false;
                if (STATE.filters.maxSize && trade.quantity > STATE.filters.maxSize) return false;
                if (STATE.filters.show === 'buy' && !trade.isBuy) return false;
                if (STATE.filters.show === 'sell' && trade.isBuy) return false;
                return true;
            });
            renderTrades();
        }

        function resetState() {
            STATE.trades = [];
            STATE.allTrades = [];
            STATE.volumeData = { buy: 0, sell: 0 };
            STATE.priceRange = { min: 0, max: 0 };
            STATE.lastResetTime = Date.now();
            tableBody.innerHTML = '';
            updateStatusBar();
        }

        function connectWebSocket() {
            if (STATE.ws) STATE.ws.close();

            const symbol = STATE.currentSymbol.toLowerCase();
            // ✅ AGGR TRADE STREAM
            STATE.ws = new WebSocket(`wss://stream.binance.com:9443/ws/${symbol}@aggTrade`);

            STATE.ws.onopen = () => {
                console.log('✅ Connected:', STATE.currentSymbol);
                statusText.textContent = 'LIVE';
                statusText.style.color = '#10b981';
            };

            STATE.ws.onmessage = (event) => {
                const trade = JSON.parse(event.data);
                processTrade(trade);
            };

            STATE.ws.onerror = () => {
                statusText.textContent = 'ERROR';
                statusText.style.color = '#ef4444';
            };

            STATE.ws.onclose = () => {
                statusText.textContent = 'RECONNECTING';
                statusText.style.color = '#f59e0b';
                setTimeout(connectWebSocket, 3000);
            };
        }

        function processTrade(trade) {
            const price = parseFloat(trade.p);
            const quantity = parseFloat(trade.q);
            const isBuy = trade.m === false; // ✅ aggTrade field
            const timestamp = trade.T;

            if (STATE.priceRange.max === 0) {
                STATE.priceRange.min = price - 100;
                STATE.priceRange.max = price + 100;
                updatePriceLadder(price);
            }

            if (isBuy) {
                STATE.volumeData.buy += quantity;
            } else {
                STATE.volumeData.sell += quantity;
            }

            const displayThreshold = CONFIG.displayThresholds[STATE.currentSymbol] || 0.05;

            if (quantity >= displayThreshold) {
                const tradeObj = {
                    time: formatTime(timestamp),
                    price: price,
                    quantity: quantity,
                    isBuy: isBuy,
                    isWhale: isWhaleTrade(quantity)
                };

                STATE.allTrades.unshift(tradeObj);
                if (STATE.allTrades.length > CONFIG.maxTrades) {
                    STATE.allTrades.pop();
                }

                applyFilters();

                if (tradeObj.isWhale) {
                    showWhaleAlert(price, quantity, isBuy);
                }

                updatePriceLadder(price);
            }

            updateStatusBar();

            if (Date.now() - STATE.lastResetTime > 60000) {
                STATE.volumeData = { buy: 0, sell: 0 };
                STATE.lastResetTime = Date.now();
            }
        }

        function formatTime(timestamp) {
            const date = new Date(timestamp);
            const h = String(date.getHours()).padStart(2, '0');
            const m = String(date.getMinutes()).padStart(2, '0');
            const s = String(date.getSeconds()).padStart(2, '0');
            const ms = String(date.getMilliseconds()).padStart(3, '0');
            return `${h}:${m}:${s}.${ms}`;
        }

        function isWhaleTrade(quantity) {
            const threshold = CONFIG.whaleThresholds[STATE.currentSymbol] || 0.5;
            return quantity >= threshold;
        }

        function formatPrice(price) {
            if (STATE.currentSymbol === 'XRPUSDT') {
                return price.toFixed(4);
            }
            return price.toFixed(2);
        }

        function formatQuantity(quantity) {
            if (STATE.currentSymbol === 'BTCUSDT') {
                if (quantity >= 1) return quantity.toFixed(3);
                if (quantity >= 0.01) return quantity.toFixed(4);
                return quantity.toFixed(5);
            } else if (STATE.currentSymbol === 'ETHUSDT') {
                if (quantity >= 10) return quantity.toFixed(2);
                return quantity.toFixed(3);
            } else if (STATE.currentSymbol === 'SOLUSDT') {
                if (quantity >= 100) return quantity.toFixed(1);
                return quantity.toFixed(2);
            } else if (STATE.currentSymbol === 'XRPUSDT') {
                if (quantity >= 10000) return quantity.toFixed(0);
                if (quantity >= 1000) return quantity.toFixed(1);
                return quantity.toFixed(2);
            }
            return quantity.toFixed(2);
        }

        function renderTrades() {
            const fragment = document.createDocumentFragment();

            STATE.trades.slice(0, 200).forEach(trade => {
                const row = document.createElement('div');
                row.className = `trade-row ${trade.isBuy ? 'buy' : 'sell'} ${trade.isWhale ? 'whale' : ''}`;

                const badge = trade.isWhale ? '🐋' : (trade.isBuy ? 'BUY' : 'SELL');

                row.innerHTML = `
                    <div class="trade-time">${trade.time}</div>
                    <div class="trade-price">${formatPrice(trade.price)}</div>
                    <div class="trade-size">${formatQuantity(trade.quantity)}</div>
                    <div class="trade-badge">${badge}</div>
                `;

                fragment.appendChild(row);
            });

            tableBody.innerHTML = '';
            tableBody.appendChild(fragment);
        }

        function updatePriceLadder(currentPrice) {
            const start = Math.floor(currentPrice / 10) * 10 - 100;
            const end = start + 200;
            const step = STATE.currentSymbol === 'XRPUSDT' ? 0.001 : 10;

            priceLadder.innerHTML = '';

            for (let price = end; price >= start; price -= step) {
                const div = document.createElement('div');
                div.className = 'price-item';
                if (Math.abs(price - currentPrice) < step) {
                    div.classList.add('current');
                }
                div.textContent = formatPrice(price);
                priceLadder.appendChild(div);
            }
        }

        function updateStatusBar() {
            const buyVol = STATE.volumeData.buy;
            const sellVol = STATE.volumeData.sell;
            const totalVol = buyVol + sellVol;

            buyVolEl.textContent = formatQuantity(buyVol);
            sellVolEl.textContent = formatQuantity(sellVol);

            if (totalVol > 0) {
                const ratio = ((buyVol / totalVol) * 100).toFixed(1);
                ratioValEl.textContent = `${ratio}%`;
                ratioValEl.style.color = ratio >= 50 ? '#10b981' : '#ef4444';
            } else {
                ratioValEl.textContent = '0%';
                ratioValEl.style.color = '#6b7280';
            }
        }

        function showWhaleAlert(price, quantity, isBuy) {
            const symbol = STATE.currentSymbol.replace('USDT', '');
            const message = `${isBuy ? '🟢 BUY' : '🔴 SELL'} ${formatQuantity(quantity)} ${symbol} @ ${formatPrice(price)}`;

            whaleMessage.textContent = message;
            whaleAlert.classList.add('show');

            setTimeout(() => {
                whaleAlert.classList.remove('show');
            }, 5000);
        }

        async function fetchFearGreedIndex() {
            try {
                const response = await fetch('https://api.alternative.me/fng/?limit=1');
                const data = await response.json();
                
                if (data && data.data && data.data[0]) {
                    const value = parseInt(data.data[0].value);
                    
                    fearGreedValEl.textContent = `${value}`;
                    
                    // Color based on value
                    if (value <= 24) {
                        // Extreme Fear (0-24): Red
                        fearGreedValEl.style.color = '#f44336';
                    } else if (value <= 44) {
                        // Fear (25-44): Orange
                        fearGreedValEl.style.color = '#ff9800';
                    } else if (value <= 55) {
                        // Neutral (45-55): Yellow
                        fearGreedValEl.style.color = '#ffd700';
                    } else if (value <= 75) {
                        // Greed (56-75): Light Green
                        fearGreedValEl.style.color = '#8bc34a';
                    } else {
                        // Extreme Greed (76-100): Green
                        fearGreedValEl.style.color = '#4caf50';
                    }
                }
            } catch (error) {
                console.error('Fear & Greed API error:', error);
                fearGreedValEl.textContent = 'N/A';
                fearGreedValEl.style.color = '#7d8590';
            }
        }

        // Initialize
        window.addEventListener('load', () => {
            connectWebSocket();
            fetchFearGreedIndex();
            // Update Fear & Greed every 5 minutes
            setInterval(fetchFearGreedIndex, 5 * 60 * 1000);
        });

        window.addEventListener('beforeunload', () => {
            if (STATE.ws) STATE.ws.close();
        });
    </script>
</body>
</html>

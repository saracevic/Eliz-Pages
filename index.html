<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Whale Tracker PRO</title>
<style>
    * { 
        box-sizing: border-box; 
        margin: 0; 
        padding: 0;
        -webkit-tap-highlight-color: transparent;
    }
    body { 
        font-family: 'Courier New', monospace;
        background: #000;
        color: #0f0; 
        padding: 10px;
        overflow-x: hidden;
        font-size: 13px;
    }
    .header {
        padding: 10px 0;
        border-bottom: 1px solid #0f0;
        margin-bottom: 10px;
    }
    .header-line {
        display: flex;
        justify-content: space-between;
        margin: 3px 0;
    }
    .green { color: #0f0; }
    .red { color: #f00; }
    .yellow { color: #ff0; }
    .cyan { color: #0ff; }
    .gray { color: #666; }
    
    .filter-box {
        margin: 10px 0;
        padding: 5px;
        border: 1px solid #0f0;
    }
    .filter-input {
        width: 100%;
        background: #000;
        border: none;
        color: #0f0;
        font-family: 'Courier New', monospace;
        font-size: 13px;
        padding: 5px;
        text-transform: uppercase;
        outline: none;
    }
    .filter-input::placeholder {
        color: #333;
    }
    
    .summary-table {
        margin: 10px 0;
        border: 1px solid #0f0;
        padding: 5px;
    }
    .summary-header {
        border-bottom: 1px solid #0f0;
        padding: 3px 0;
        display: flex;
        justify-content: space-between;
    }
    .summary-row {
        padding: 2px 0;
        display: flex;
        justify-content: space-between;
        border-bottom: 1px dotted #333;
    }
    .summary-row:last-child {
        border-bottom: none;
        border-top: 1px solid #0f0;
        margin-top: 5px;
        padding-top: 5px;
    }
    
    .trade-list {
        margin-top: 10px;
    }
    .trade-line {
        padding: 3px 0;
        border-bottom: 1px dotted #222;
        animation: fadeIn 0.3s ease;
    }
    .trade-line.new {
        animation: blink 0.5s ease 2;
    }
    @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
    }
    @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.3; }
    }
    
    .status-dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        background: #f00;
        margin-right: 3px;
    }
    .status-dot.on {
        background: #0f0;
    }
</style>
</head>
<body>

<div class="header">
    <div class="header-line">
        <span class="cyan">WHALE TRACKER PRO - FUTURES</span>
        <span class="yellow">LIVE</span>
    </div>
    <div class="header-line">
        <span>F&G:<span id="fear" class="gray">--</span></span>
        <span>TOTAL:<span id="total" class="cyan">0</span></span>
        <span>4H:<span id="hourly" class="cyan">0</span></span>
    </div>
    <div class="header-line gray">
        <span><span class="status-dot" id="wsDot"></span>WS(60)</span>
        <span><span class="status-dot" id="apiDot"></span>API</span>
    </div>
</div>

<div class="filter-box">
    <input type="text" id="filter" class="filter-input" placeholder="FILTER: BTC ETH SOL...">
</div>

<div class="summary-table" id="summary">
    <div class="summary-header cyan">
        <span>COIN</span>
        <span>BUY</span>
        <span>SELL</span>
        <span>USD</span>
    </div>
    <div class="gray" style="padding:10px;text-align:center;">LOADING...</div>
</div>

<div class="trade-list" id="trades">
    <div class="gray" style="text-align:center;">CONNECTING TO BINANCE FUTURES...</div>
</div>

<script>
(function() {
    'use strict';
    
    var MAX = 100;
    var FOUR_H = 14400000;
    
    var THRESH = {
        'btcusdt': 6, 'ethusdt': 90, 'bnbusdt': 600, 'solusdt': 2400, 'xrpusdt': 120000,
        'adausdt': 240000, 'dogeusdt': 2400000, 'dotusdt': 24000, 'maticusdt': 240000, 
        'linkusdt': 24000, 'avaxusdt': 12000, 'ltcusdt': 6000, 'bchusdt': 3600, 
        'uniusdt': 12000, 'atomusdt': 12000, 'etcusdt': 60000, 'nearusdt': 24000,
        'aptusdt': 12000, 'arbusdt': 120000, 'opusdt': 36000, 'ldousdt': 60000,
        'injusdt': 6000, 'stxusdt': 60000, 'filusdt': 12000, 'suiusdt': 36000,
        'imxusdt': 36000, 'tiausdt': 12000, 'seiusdt': 60000, 'hbarusdt': 240000,
        'rndrusdt': 12000, 'fetusdt': 60000, 'taousdt': 1200, 'arusdt': 24000,
        'wldusdt': 36000, 'flokiusdt': 2400000, 'pepeusdt': 12000000000, 
        'shibusdt': 360000000, 'wifusdt': 60000, 'bonkusdt': 2400000000,
        'jupusdt': 60000, 'pythusdt': 120000, 'trbusdt': 2400, 'icpusdt': 12000,
        'runeusdt': 12000, 'aaveusdt': 1200, 'mkrusdt': 240, 'grtusdt': 240000,
        'ftmusdt': 60000, 'algousdt': 120000, 'qntusdt': 600, 'sandusdt': 120000,
        'manausdt': 120000, 'axsusdt': 24000, 'galausdt': 240000, 'chzusdt': 240000,
        'apeusdt': 36000, 'gmxusdt': 2400, 'blurusdt': 36000, 'pendleusdt': 24000
    };
    
    var trades = [];
    var total = 0;
    var ws = [];
    var conn = 0;
    var filt = '';
    
    var tradesEl = document.getElementById('trades');
    var summaryEl = document.getElementById('summary');
    var totalEl = document.getElementById('total');
    var hourlyEl = document.getElementById('hourly');
    var fearEl = document.getElementById('fear');
    var wsDot = document.getElementById('wsDot');
    var apiDot = document.getElementById('apiDot');
    var filterEl = document.getElementById('filter');
    
    function fmt(n) {
        if (n >= 1000000) return (n/1000000).toFixed(2) + 'M';
        if (n >= 1000) return (n/1000).toFixed(2) + 'K';
        return n.toFixed(2);
    }
    
    function updateSummary() {
        var coins = {};
        trades.forEach(function(t) {
            if (!coins[t.coin]) coins[t.coin] = {b:0,s:0,bu:0,su:0};
            if (t.side === 'BUY') {
                coins[t.coin].b += t.amt;
                coins[t.coin].bu += t.usd;
            } else {
                coins[t.coin].s += t.amt;
                coins[t.coin].su += t.usd;
            }
        });
        
        var arr = Object.keys(coins).map(function(c) {
            return {
                coin: c,
                b: coins[c].b,
                s: coins[c].s,
                bu: coins[c].bu,
                su: coins[c].su,
                tot: coins[c].bu + coins[c].su
            };
        }).sort(function(a,b) { return b.tot - a.tot; });
        
        if (filt) arr = arr.filter(function(x) { return x.coin.indexOf(filt) !== -1; });
        
        var html = '<div class="summary-header cyan"><span>COIN</span><span>BUY</span><span>SELL</span><span>USD</span></div>';
        var tb = 0, ts = 0, tu = 0;
        
        arr.forEach(function(x) {
            tb += x.b; ts += x.s; tu += x.tot;
            html += '<div class="summary-row">' +
                '<span class="cyan">' + x.coin + '</span>' +
                '<span class="green">' + fmt(x.b) + '</span>' +
                '<span class="red">' + fmt(x.s) + '</span>' +
                '<span class="yellow">$' + fmt(x.tot) + '</span>' +
                '</div>';
        });
        
        html += '<div class="summary-row">' +
            '<span class="yellow">TOT</span>' +
            '<span class="green">' + fmt(tb) + '</span>' +
            '<span class="red">' + fmt(ts) + '</span>' +
            '<span class="yellow">$' + fmt(tu) + '</span>' +
            '</div>';
        
        summaryEl.innerHTML = html;
    }
    
    function updateUI() {
        totalEl.textContent = total;
        var h = trades.filter(function(t) { return t.ts > Date.now() - FOUR_H; });
        hourlyEl.textContent = h.length;
        
        var arr = filt ? trades.filter(function(t) { return t.coin.indexOf(filt) !== -1; }) : trades;
        
        if (arr.length === 0) {
            tradesEl.innerHTML = '<div class="gray" style="text-align:center;">' + 
                (filt ? 'NO MATCH: ' + filt : 'WAITING...') + '</div>';
            return;
        }
        
        var html = '';
        arr.slice(0, 50).forEach(function(t, i) {
            var cls = i === 0 ? 'trade-line new' : 'trade-line';
            var color = t.side === 'BUY' ? 'green' : 'red';
            html += '<div class="' + cls + '">' +
                '<span class="cyan">' + t.coin + '</span> ' +
                '<span class="' + color + '">' + t.side + '</span> ' +
                '<span class="yellow">$' + fmt(t.usd) + '</span> ' +
                '<span class="gray">' + t.time + '</span>' +
                '</div>';
        });
        
        tradesEl.innerHTML = html;
    }
    
    function add(coin, side, amt, price) {
        var usd = amt * price;
        trades.unshift({
            coin: coin,
            side: side,
            amt: amt,
            price: price,
            usd: usd,
            time: new Date().toLocaleTimeString('tr-TR'),
            ts: Date.now()
        });
        
        if (trades.length > MAX) trades.pop();
        total++;
        updateUI();
        updateSummary();
    }
    
    function connect(sym, thresh) {
        var w = new WebSocket('wss://fstream.binance.com/ws/' + sym + '@aggTrade');
        
        w.onopen = function() {
            conn++;
            if (conn >= 1) wsDot.classList.add('on');
            updateUI();
        };
        
        w.onmessage = function(e) {
            try {
                var d = JSON.parse(e.data);
                var q = parseFloat(d.q);
                var p = parseFloat(d.p);
                if (q >= thresh) {
                    add(sym.replace('usdt','').toUpperCase(), d.m ? 'SELL' : 'BUY', q, p);
                }
            } catch(err) {}
        };
        
        w.onclose = function() {
            conn--;
            if (conn === 0) wsDot.classList.remove('on');
            setTimeout(function() { connect(sym, thresh); }, 3000);
        };
        
        ws.push(w);
    }
    
    function fetchFear() {
        fetch('https://api.alternative.me/fng/?limit=1')
            .then(function(r) { return r.json(); })
            .then(function(d) {
                apiDot.classList.add('on');
                if (d && d.data && d.data[0]) {
                    var v = parseInt(d.data[0].value);
                    var cls = v < 25 ? 'red' : v > 75 ? 'green' : 'yellow';
                    fearEl.innerHTML = '<span class="' + cls + '">' + v + '</span>';
                }
            })
            .catch(function() { apiDot.classList.remove('on'); });
    }
    
    function clean() {
        var cut = Date.now() - FOUR_H;
        trades = trades.filter(function(t) { return t.ts > cut; });
        updateUI();
        updateSummary();
    }
    
    filterEl.addEventListener('input', function(e) {
        filt = e.target.value.toUpperCase().trim();
        updateSummary();
        updateUI();
    });
    
    function init() {
        Object.keys(THRESH).forEach(function(s) { connect(s, THRESH[s]); });
        fetchFear();
        setInterval(fetchFear, 300000);
        setInterval(clean, 60000);
    }
    
    init();
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hyperliquid Whale Tracker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0f1419;
            color: #e8e8e8;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1800px;
            margin: 0 auto;
        }

        .header-section {
            background: #1a1f2e;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid #2a3142;
        }

        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-item {
            text-align: center;
            padding: 10px;
        }

        .stat-label {
            font-size: 0.9em;
            color: #8a8f98;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 1.8em;
            font-weight: 600;
        }

        .stat-value.positive {
            color: #10b981;
        }

        .stat-value.negative {
            color: #ef4444;
        }

        .controls-section {
            background: #1a1f2e;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid #2a3142;
        }

        .control-group {
            margin-bottom: 15px;
        }

        .control-group label {
            display: block;
            margin-bottom: 8px;
            color: #8a8f98;
            font-size: 0.9em;
        }

        textarea {
            width: 100%;
            min-height: 120px;
            background: #0f1419;
            border: 1px solid #2a3142;
            border-radius: 6px;
            padding: 12px;
            color: #e8e8e8;
            font-family: monospace;
            font-size: 0.9em;
            resize: vertical;
        }

        textarea:focus {
            outline: none;
            border-color: #4a9eff;
        }

        select {
            width: 100%;
            max-width: 300px;
            padding: 10px;
            background: #0f1419;
            border: 1px solid #2a3142;
            border-radius: 6px;
            color: #e8e8e8;
            font-size: 0.9em;
            cursor: pointer;
        }

        select:focus {
            outline: none;
            border-color: #4a9eff;
        }

        .button-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-size: 0.9em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background: #4a9eff;
            color: #fff;
        }

        .btn-primary:hover {
            background: #3a8eef;
        }

        .btn-secondary {
            background: #2a3142;
            color: #e8e8e8;
        }

        .btn-secondary:hover {
            background: #3a4152;
        }

        .btn-danger {
            background: #ef4444;
            color: #fff;
        }

        .btn-danger:hover {
            background: #dc2626;
        }

        .table-container {
            background: #1a1f2e;
            border-radius: 8px;
            border: 1px solid #2a3142;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1200px;
        }

        thead {
            background: #0f1419;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        th {
            padding: 12px 10px;
            text-align: left;
            font-size: 0.85em;
            font-weight: 600;
            color: #8a8f98;
            border-bottom: 1px solid #2a3142;
            white-space: nowrap;
        }

        tbody tr {
            border-bottom: 1px solid #2a3142;
            transition: background 0.2s;
        }

        tbody tr:hover {
            background: #22273a;
        }

        td {
            padding: 12px 10px;
            font-size: 0.9em;
        }

        .token-cell {
            font-weight: 600;
            font-size: 1em;
        }

        .amount-cell {
            color: #8a8f98;
            font-size: 0.85em;
        }

        .side-long {
            color: #10b981;
            font-weight: 600;
        }

        .side-short {
            color: #ef4444;
            font-weight: 600;
        }

        .leverage-cell {
            color: #8a8f98;
        }

        .value-cell {
            font-weight: 600;
        }

        .pnl-positive {
            color: #10b981;
        }

        .pnl-negative {
            color: #ef4444;
        }

        .wallet-cell {
            font-family: monospace;
            font-size: 0.85em;
            color: #8a8f98;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #8a8f98;
        }

        .spinner {
            border: 3px solid #2a3142;
            border-top: 3px solid #4a9eff;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .no-data {
            text-align: center;
            padding: 60px 20px;
            color: #8a8f98;
        }

        .wallet-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
            max-height: 150px;
            overflow-y: auto;
            padding: 10px;
            background: #0f1419;
            border-radius: 6px;
            border: 1px solid #2a3142;
        }

        .wallet-chip {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 5px 10px;
            background: #2a3142;
            border-radius: 4px;
            font-size: 0.85em;
            font-family: monospace;
        }

        .wallet-chip-remove {
            cursor: pointer;
            color: #ef4444;
            font-weight: bold;
            margin-left: 4px;
        }

        .wallet-chip-remove:hover {
            color: #dc2626;
        }

        @media (max-width: 768px) {
            .stats-row {
                grid-template-columns: repeat(2, 1fr);
            }

            .button-group {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-section">
            <div class="stats-row">
                <div class="stat-item">
                    <div class="stat-label">Long Value</div>
                    <div class="stat-value positive" id="longValue">$0</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">Short Value</div>
                    <div class="stat-value negative" id="shortValue">$0</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">Total</div>
                    <div class="stat-value" id="totalValue">$0</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">Sum Funding</div>
                    <div class="stat-value" id="sumFunding">$0</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">Sum PNL</div>
                    <div class="stat-value" id="sumPnl">$0</div>
                </div>
            </div>
        </div>

        <div class="controls-section">
            <div class="control-group">
                <label>📍 Wallet Addresses (her satıra bir adres)</label>
                <textarea 
                    id="walletInput" 
                    placeholder="0x1234...&#10;0x5678...&#10;0xabcd...&#10;(Her satıra bir cüzdan adresi girin)"
                ></textarea>
            </div>

            <div class="control-group">
                <label>🪙 Coin Filter</label>
                <select id="coinFilter">
                    <option value="all">All Coins</option>
                </select>
            </div>

            <div class="button-group">
                <button class="btn btn-primary" id="addWalletsBtn">➕ Add Wallets</button>
                <button class="btn btn-secondary" id="refreshBtn">🔄 Refresh</button>
                <button class="btn btn-danger" id="clearBtn">🗑️ Clear All</button>
            </div>

            <div id="walletList" class="wallet-list" style="display: none;"></div>
        </div>

        <div id="loadingIndicator" class="loading" style="display: none;">
            <div class="spinner"></div>
            <p>Loading positions...</p>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Token</th>
                        <th>Side</th>
                        <th>Leverage</th>
                        <th>Value</th>
                        <th>Amount</th>
                        <th>Avg Entry</th>
                        <th>Live</th>
                        <th>PNL/ROE</th>
                        <th>Funding</th>
                        <th>Dist. to Liq</th>
                        <th>Age</th>
                        <th>Wallet</th>
                    </tr>
                </thead>
                <tbody id="positionsBody">
                    <tr>
                        <td colspan="12" class="no-data">
                            Add wallet addresses above to start tracking
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
// Global değişkenler
let walletAddresses = [];
let allPositions = [];
let currentCoinFilter = 'all';
const API_URL = 'https://api.hyperliquid.xyz/info';

// LocalStorage fonksiyonları
function loadWalletsFromStorage() {
    const stored = localStorage.getItem('hyperliquid_wallets');
    if (stored) {
        try {
            walletAddresses = JSON.parse(stored);
            updateWalletList();
        } catch (e) {
            console.error('Storage error:', e);
        }
    }
}

function saveWalletsToStorage() {
    localStorage.setItem('hyperliquid_wallets', JSON.stringify(walletAddresses));
}

// Toplu cüzdan ekleme
function addWallets() {
    const input = document.getElementById('walletInput');
    const text = input.value.trim();
    
    if (!text) {
        alert('Please enter wallet addresses');
        return;
    }

    const lines = text.split('\n').map(line => line.trim()).filter(line => line);
    let added = 0;
    let skipped = 0;
    let invalid = 0;

    for (let address of lines) {
        if (!address.startsWith('0x')) {
            address = '0x' + address;
        }

        if (address.length !== 42) {
            invalid++;
            continue;
        }

        const lowerAddress = address.toLowerCase();
        if (walletAddresses.includes(lowerAddress)) {
            skipped++;
            continue;
        }

        walletAddresses.push(lowerAddress);
        added++;
    }

    saveWalletsToStorage();
    updateWalletList();
    input.value = '';

    alert('✅ Wallets added!\n\n' +
          '➕ Added: ' + added + '\n' +
          '⏭️ Skipped (duplicate): ' + skipped + '\n' +
          '❌ Invalid: ' + invalid);

    if (added > 0) {
        fetchAllPositions();
    }
}

// Tüm cüzdanları temizle
function clearAllWallets() {
    if (!confirm('Are you sure you want to remove all wallets?')) {
        return;
    }
    walletAddresses = [];
    allPositions = [];
    saveWalletsToStorage();
    updateWalletList();
    updateCoinFilter();
    displayPositions();
    updateStats();
}

// Tek cüzdan sil
window.removeWallet = function(address) {
    walletAddresses = walletAddresses.filter(w => w !== address);
    saveWalletsToStorage();
    updateWalletList();
    fetchAllPositions();
};

// Cüzdan listesini güncelle
function updateWalletList() {
    const container = document.getElementById('walletList');
    
    if (walletAddresses.length === 0) {
        container.style.display = 'none';
        return;
    }

    container.style.display = 'flex';
    container.innerHTML = walletAddresses.map(address => 
        '<div class="wallet-chip">' +
        '<span>' + shortenAddress(address) + '</span>' +
        '<span class="wallet-chip-remove" onclick="removeWallet(\'' + address + '\')">✕</span>' +
        '</div>'
    ).join('');
}

// Coin filtre dropdown'unu güncelle
function updateCoinFilter() {
    const coins = [...new Set(allPositions.map(p => p.coin))].sort();
    const select = document.getElementById('coinFilter');
    
    select.innerHTML = '<option value="all">All Coins (' + coins.length + ')</option>' +
        coins.map(coin => '<option value="' + coin + '">' + coin + '</option>').join('');
    
    select.value = currentCoinFilter;
}

// API: Kullanıcı pozisyonlarını çek
async function fetchUserPositions(userAddress) {
    try {
        const response = await fetch(API_URL, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({
                type: 'clearinghouseState',
                user: userAddress
            })
        });
        
        if (!response.ok) throw new Error('API error');
        return await response.json();
    } catch (error) {
        console.error('Position error:', error);
        return null;
    }
}

// API: Meta bilgilerini çek
async function fetchMetadata() {
    try {
        const response = await fetch(API_URL, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({
                type: 'meta'
            })
        });
        
        if (!response.ok) throw new Error('API error');
        return await response.json();
    } catch (error) {
        console.error('Metadata error:', error);
        return null;
    }
}

// Tüm cüzdanların pozisyonlarını çek
async function fetchAllPositions() {
    if (walletAddresses.length === 0) {
        allPositions = [];
        displayPositions();
        updateStats();
        return;
    }

    showLoading(true);
    allPositions = [];

    for (const address of walletAddresses) {
        const data = await fetchUserPositions(address);
        
        if (data && data.assetPositions) {
            for (const pos of data.assetPositions) {
                const position = pos.position;
                if (!position || position.szi === '0') continue;

                const coin = position.coin;
                const szi = parseFloat(position.szi);
                const side = szi > 0 ? 'Long' : 'Short';
                const size = Math.abs(szi);
                
                const entryPx = parseFloat(position.entryPx || 0);
                const leverage = parseFloat(position.leverage?.value || 0);
                const leverageType = position.leverage?.type || 'cross';
                const unrealizedPnl = parseFloat(position.unrealizedPnl || 0);
                const returnOnEquity = parseFloat(position.returnOnEquity || 0);
                const liquidationPx = parseFloat(position.liquidationPx || 0);
                const cumFunding = parseFloat(position.cumFunding?.total || 0);
                const positionValue = parseFloat(position.positionValue || 0);
                
                // Mevcut fiyat hesaplama
                let currentPrice = entryPx;
                if (size > 0 && unrealizedPnl !== 0) {
                    if (side === 'Long') {
                        currentPrice = entryPx + (unrealizedPnl / size);
                    } else {
                        currentPrice = entryPx - (unrealizedPnl / size);
                    }
                }

                const value = positionValue || (size * currentPrice);

                // Liquidation distance hesaplama
                let liqDistance = 0;
                if (liquidationPx > 0) {
                    liqDistance = ((currentPrice - liquidationPx) / currentPrice) * 100;
                    if (side === 'Short') {
                        liqDistance = ((liquidationPx - currentPrice) / currentPrice) * 100;
                    }
                }

                allPositions.push({
                    wallet: address,
                    coin: coin,
                    side: side,
                    leverage: leverage,
                    leverageType: leverageType,
                    size: size,
                    entryPrice: entryPx,
                    currentPrice: currentPrice,
                    value: value,
                    pnl: unrealizedPnl,
                    pnlPercent: returnOnEquity * 100,
                    fundingFee: cumFunding,
                    liquidationPrice: liquidationPx,
                    liqDistance: liqDistance
                });
            }
        }

        await new Promise(resolve => setTimeout(resolve, 100));
    }

    allPositions.sort((a, b) => b.value - a.value);

    showLoading(false);
    updateCoinFilter();
    displayPositions();
    updateStats();
}

// Yardımcı fonksiyonlar
function formatNumber(num) {
    if (Math.abs(num) >= 1000000) {
        return (num / 1000000).toFixed(2) + 'M';
    } else if (Math.abs(num) >= 1000) {
        return (num / 1000).toFixed(2) + 'K';
    }
    return num.toFixed(2);
}

function formatCurrency(num) {
    return '$' + formatNumber(num);
}

function shortenAddress(address) {
    if (!address) return 'N/A';
    return address.slice(0, 6) + '...' + address.slice(-4);
}

function showLoading(show) {
    document.getElementById('loadingIndicator').style.display = show ? 'block' : 'none';
}

function calculateAge(position) {
    // Age hesaplama - şimdilik placeholder
    return 'N/A';
}

        // Pozisyonları göster
function displayPositions() {
    const tbody = document.getElementById('positionsBody');
    
    let filteredPositions = allPositions;
    
    if (currentCoinFilter !== 'all') {
        filteredPositions = filteredPositions.filter(p => p.coin === currentCoinFilter);
    }
    
    if (filteredPositions.length === 0) {
        tbody.innerHTML = '<tr><td colspan="12" class="no-data">' + 
            (allPositions.length === 0 ? 'No positions found' : 'No positions for this filter') + 
            '</td></tr>';
        return;
    }

    tbody.innerHTML = filteredPositions.map(pos => {
        const leverageText = pos.leverage.toFixed(0) + 'x ' + (pos.leverageType === 'cross' ? 'Cross' : 'Isolated');
        const liqDistText = pos.liqDistance !== 0 ? Math.abs(pos.liqDistance).toFixed(0) + '%' : 'N/A';
        
        return '<tr>' +
            '<td class="token-cell">' + pos.coin + '</td>' +
            '<td class="side-' + pos.side.toLowerCase() + '">' + pos.side + '</td>' +
            '<td class="leverage-cell">' + leverageText + '</td>' +
            '<td class="value-cell">' + formatCurrency(pos.value) + '</td>' +
            '<td class="amount-cell">' + formatNumber(pos.size) + '</td>' +
            '<td>$' + formatNumber(pos.entryPrice) + '</td>' +
            '<td>$' + formatNumber(pos.currentPrice) + '</td>' +
            '<td class="' + (pos.pnl >= 0 ? 'pnl-positive' : 'pnl-negative') + '">' +
            (pos.pnl >= 0 ? '+' : '') + formatCurrency(pos.pnl) + '<br>' +
            (pos.pnl >= 0 ? '+' : '') + pos.pnlPercent.toFixed(2) + '%</td>' +
            '<td class="' + (pos.fundingFee >= 0 ? 'pnl-positive' : 'pnl-negative') + '">' +
            (pos.fundingFee >= 0 ? '+' : '') + formatCurrency(pos.fundingFee) + '</td>' +
            '<td>' + liqDistText + '</td>' +
            '<td>N/A</td>' +
            '<td class="wallet-cell">' + shortenAddress(pos.wallet) + '</td>' +
            '</tr>';
    }).join('');
}

// İstatistikleri güncelle
function updateStats() {
    let filteredForStats = allPositions;
    
    if (currentCoinFilter !== 'all') {
        filteredForStats = allPositions.filter(p => p.coin === currentCoinFilter);
    }
    
    const longValue = filteredForStats.filter(p => p.side === 'Long').reduce((sum, p) => sum + p.value, 0);
    const shortValue = filteredForStats.filter(p => p.side === 'Short').reduce((sum, p) => sum + p.value, 0);
    const totalValue = longValue + shortValue;
    const totalPnl = filteredForStats.reduce((sum, p) => sum + p.pnl, 0);
    const totalFunding = filteredForStats.reduce((sum, p) => sum + p.fundingFee, 0);

    document.getElementById('longValue').textContent = formatCurrency(longValue);
    document.getElementById('shortValue').textContent = formatCurrency(shortValue);
    document.getElementById('totalValue').textContent = formatCurrency(totalValue);
    document.getElementById('sumFunding').textContent = formatCurrency(totalFunding);
    
    const pnlElement = document.getElementById('sumPnl');
    pnlElement.textContent = formatCurrency(totalPnl);
    pnlElement.className = 'stat-value ' + (totalPnl >= 0 ? 'positive' : 'negative');
    
    const fundingElement = document.getElementById('sumFunding');
    fundingElement.className = 'stat-value ' + (totalFunding >= 0 ? 'positive' : 'negative');
}

// Event listeners
document.getElementById('addWalletsBtn').addEventListener('click', addWallets);
document.getElementById('refreshBtn').addEventListener('click', fetchAllPositions);
document.getElementById('clearBtn').addEventListener('click', clearAllWallets);

document.getElementById('coinFilter').addEventListener('change', function(e) {
    currentCoinFilter = e.target.value;
    displayPositions();
    updateStats();
});

document.getElementById('walletInput').addEventListener('keydown', function(e) {
    if (e.ctrlKey && e.key === 'Enter') {
        addWallets();
    }
});

// Sayfa yüklendiğinde
loadWalletsFromStorage();
if (walletAddresses.length > 0) {
    fetchAllPositions();
}

console.log('🐋 Hyperliquid Whale Tracker Ready!');
    </script>
</body>
</html>

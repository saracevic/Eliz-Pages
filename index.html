<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Whale Tracker</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { 
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Arial', sans-serif;
    background: #0a0a0a;
    color: #d1d4dc; 
    padding: 10px;
    font-size: 12px;
    line-height: 1.2;
}
.header {
    border: 1px solid #1e222d;
    padding: 8px;
    margin-bottom: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #131722;
    box-shadow: none;
}
.header span {
    margin-right: 15px;
}
.status { color: #434651; }
.status.on { color: #2962ff; text-shadow: none; }

.controls {
    background: #131722;
    border: 1px solid #1e222d;
    padding: 8px;
    margin-bottom: 10px;
    border-radius: 4px;
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
}

.controls label {
    display: flex;
    align-items: center;
    gap: 5px;
    color: #d1d4dc;
    cursor: pointer;
}

.controls input[type="checkbox"] {
    width: auto;
    margin: 0;
}

input { 
    width: 100%;
    background: #131722;
    border: 1px solid #2a2e39;
    color: #d1d4dc;
    padding: 6px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Arial', sans-serif;
    font-size: 12px;
    margin-bottom: 10px;
    border-radius: 4px;
}
input:focus {
    outline: none;
    border-color: #2962ff;
    box-shadow: none;
}

table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0;
    border: 1px solid #1e222d;
    background: #131722;
    margin-bottom: 15px;
    box-shadow: none;
    position: relative;
    border-radius: 4px;
    overflow: hidden;
}
th {
    background: #1e222d;
    color: #787b86;
    padding: 8px;
    text-align: left;
    border-bottom: 1px solid #2a2e39;
    font-weight: 600;
    text-transform: uppercase;
    font-size: 11px;
    letter-spacing: 0.5px;
}
td {
    padding: 6px 8px;
    border-bottom: 1px solid #1e222d;
    color: #d1d4dc;
}
tr:hover td {
    background: #1a1e27;
}
.buy { color: #089981; font-weight: 600; text-shadow: none; }
.sell { color: #f23645; font-weight: 600; text-shadow: none; }
.total-row {
    background: #1a1e27;
    font-weight: bold;
    border-top: 1px solid #2a2e39;
}
.total-row td {
    border-top: 1px solid #2a2e39;
}
.gray { color: #787b86; }
.new-row {
    animation: highlight 1s ease;
}
@keyframes highlight {
    0% { background: #1a2e27; }
    100% { background: transparent; }
}

table::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    border: 1px solid #2a2e39;
    pointer-events: none;
    opacity: 0.3;
    border-radius: 4px;
}
</style>
</head>
<body>

<div class="header">
    <div>
        <span><strong>WHALE TRACKER</strong></span>
        <span class="status" id="wsStatus">⬤ WS</span>
        <span class="status" id="apiStatus">⬤ API</span>
    </div>
    <div>
        <span>F&G: <span id="fear">--</span></span>
        <span>Total: <span id="total">0</span></span>
        <span>4H: <span id="hourly">0</span></span>
    </div>
</div>

<div class="controls">
    <label>
        <input type="checkbox" id="soundToggle" checked>
        <span>🔔 Ses Bildirimleri</span>
    </label>
    <label>
        <input type="checkbox" id="vibrationToggle" checked>
        <span>📳 Titreşim</span>
    </label>
</div>

<input type="text" id="filter" placeholder="Filter: BTC, ETH, SOL...">

<table id="summaryTable">
    <thead>
        <tr>
            <th>COIN</th>
            <th>BUY</th>
            <th>SELL</th>
            <th>BUY USD</th>
            <th>SELL USD</th>
            <th>TOTAL USD</th>
        </tr>
    </thead>
    <tbody id="summaryBody">
        <tr><td colspan="6" class="gray" style="text-align:center;">Loading...</td></tr>
    </tbody>
</table>

<table id="tradesTable">
    <thead>
        <tr>
            <th>TIME</th>
            <th>COIN</th>
            <th>SIDE</th>
            <th>AMOUNT</th>
            <th>PRICE</th>
            <th>TOTAL USD</th>
        </tr>
    </thead>
    <tbody id="tradesBody">
        <tr><td colspan="6" class="gray" style="text-align:center;">Connecting...</td></tr>
    </tbody>
</table>

<script>
(function() {
'use strict';

var THRESHOLDS = {
    btcusdt: 20,
    ethusdt: 300,
    bnbusdt: 2000,
    solusdt: 8000,
    xrpusdt: 400000,
    adausdt: 800000,
    dogeusdt: 8000000,
    dotusdt: 80000,
    maticusdt: 800000,
    linkusdt: 80000,
    avaxusdt: 40000,
    ltcusdt: 20000,
    bchusdt: 12000,
    uniusdt: 40000,
    atomusdt: 40000,
    etcusdt: 200000,
    nearusdt: 80000,
    aptusdt: 40000,
    arbusdt: 400000,
    opusdt: 120000,
    ldousdt: 200000,
    injusdt: 20000,
    stxusdt: 200000,
    filusdt: 40000,
    suiusdt: 120000,
    imxusdt: 120000,
    tiausdt: 40000,
    seiusdt: 200000,
    hbarusdt: 800000,
    rndrusdt: 40000,
    fetusdt: 200000,
    taousdt: 4000,
    arusdt: 80000,
    wldusdt: 120000,
    flokiusdt: 8000000,
    pepeusdt: 40000000000,
    shibusdt: 1200000000,
    wifusdt: 200000,
    bonkusdt: 8000000000,
    jupusdt: 200000,
    pythusdt: 400000,
    trbusdt: 8000,
    icpusdt: 40000,
    runeusdt: 40000,
    aaveusdt: 4000,
    mkrusdt: 800,
    grtusdt: 800000,
    ftmusdt: 200000,
    algousdt: 400000,
    qntusdt: 2000,
    sandusdt: 400000,
    manausdt: 400000,
    axsusdt: 80000,
    galausdt: 800000,
    chzusdt: 800000,
    apeusdt: 120000,
    gmxusdt: 8000,
    blurusdt: 120000,
    pendleusdt: 80000
};

var trades = [];
var totalCount = 0;
var connectedWS = 0;
var filterText = '';
var websockets = [];
var audioContext;
var soundEnabled = true;
var vibrationEnabled = true;

var summaryBody = document.getElementById('summaryBody');
var tradesBody = document.getElementById('tradesBody');
var totalEl = document.getElementById('total');
var hourlyEl = document.getElementById('hourly');
var fearEl = document.getElementById('fear');
var wsStatus = document.getElementById('wsStatus');
var apiStatus = document.getElementById('apiStatus');
var filterEl = document.getElementById('filter');
var soundToggle = document.getElementById('soundToggle');
var vibrationToggle = document.getElementById('vibrationToggle');

// Ses ve titreşim ayarları
soundToggle.addEventListener('change', function(e) {
    soundEnabled = e.target.checked;
});

vibrationToggle.addEventListener('change', function(e) {
    vibrationEnabled = e.target.checked;
});

// Ses çalma fonksiyonu (Web Audio API)
function playSound(type) {
    if (!soundEnabled) return;
    
    try {
        if (!audioContext) {
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
        }
        
        var oscillator = audioContext.createOscillator();
        var gainNode = audioContext.createGain();
        
        oscillator.connect(gainNode);
        gainNode.connect(audioContext.destination);
        
        // BUY için yüksek, SELL için düşük ton
        oscillator.frequency.value = type === 'BUY' ? 800 : 400;
        oscillator.type = 'sine';
        
        gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);
        
        oscillator.start(audioContext.currentTime);
        oscillator.stop(audioContext.currentTime + 0.5);
    } catch(err) {
        console.log('Ses çalınamadı:', err);
    }
}

// Titreşim fonksiyonu
function vibrate(pattern) {
    if (!vibrationEnabled) return;
    
    if ('vibrate' in navigator) {
        navigator.vibrate(pattern);
    }
}

// Bildirim fonksiyonu
function notifyTrade(side) {
    // Ses çal
    playSound(side);
    
    // Titret (BUY: kısa, SELL: uzun)
    vibrate(side === 'BUY' ? [100] : [200]);
}

function formatNum(n) {
    if (n >= 1000000) return (n/1000000).toFixed(2) + 'M';
    if (n >= 1000) return (n/1000).toFixed(2) + 'K';
    return n.toFixed(2);
}

function updateSummary() {
    var coins = {};
    trades.forEach(function(t) {
        if (!coins[t.coin]) coins[t.coin] = {buy:0, sell:0, buyUSD:0, sellUSD:0};
        if (t.side === 'BUY') {
            coins[t.coin].buy += t.amount;
            coins[t.coin].buyUSD += t.usd;
        } else {
            coins[t.coin].sell += t.amount;
            coins[t.coin].sellUSD += t.usd;
        }
    });
    
    var arr = Object.keys(coins).map(function(c) {
        return {
            coin: c,
            buy: coins[c].buy,
            sell: coins[c].sell,
            buyUSD: coins[c].buyUSD,
            sellUSD: coins[c].sellUSD,
            totalUSD: coins[c].buyUSD + coins[c].sellUSD
        };
    }).sort(function(a,b) { return b.totalUSD - a.totalUSD; });
    
    if (filterText) {
        arr = arr.filter(function(x) { return x.coin.indexOf(filterText) !== -1; });
    }
    
    var html = '';
    var totBuy = 0, totSell = 0, totBuyUSD = 0, totSellUSD = 0, totUSD = 0;
    
    arr.forEach(function(x) {
        totBuy += x.buy;
        totSell += x.sell;
        totBuyUSD += x.buyUSD;
        totSellUSD += x.sellUSD;
        totUSD += x.totalUSD;
        
        html += '<tr>' +
            '<td><strong>' + x.coin + '</strong></td>' +
            '<td class="buy">' + formatNum(x.buy) + '</td>' +
            '<td class="sell">' + formatNum(x.sell) + '</td>' +
            '<td class="buy">$' + formatNum(x.buyUSD) + '</td>' +
            '<td class="sell">$' + formatNum(x.sellUSD) + '</td>' +
            '<td><strong>$' + formatNum(x.totalUSD) + '</strong></td>' +
            '</tr>';
    });
    
    html += '<tr class="total-row">' +
        '<td><strong>TOTAL</strong></td>' +
        '<td class="buy">' + formatNum(totBuy) + '</td>' +
        '<td class="sell">' + formatNum(totSell) + '</td>' +
        '<td class="buy">$' + formatNum(totBuyUSD) + '</td>' +
        '<td class="sell">$' + formatNum(totSellUSD) + '</td>' +
        '<td><strong>$' + formatNum(totUSD) + '</strong></td>' +
        '</tr>';
    
    summaryBody.innerHTML = html || '<tr><td colspan="6" class="gray" style="text-align:center;">No data</td></tr>';
}

function updateTrades() {
    totalEl.textContent = totalCount;
    var recent = trades.filter(function(t) { return t.timestamp > Date.now() - 14400000; });
    hourlyEl.textContent = recent.length;
    
    var filtered = filterText ? trades.filter(function(t) { return t.coin.indexOf(filterText) !== -1; }) : trades;
    
    if (filtered.length === 0) {
        tradesBody.innerHTML = '<tr><td colspan="6" class="gray" style="text-align:center;">' + 
            (filterText ? 'No matches for: ' + filterText : 'Waiting for trades...') + '</td></tr>';
        return;
    }
    
    var html = '';
    filtered.slice(0, 50).forEach(function(t, i) {
        html += '<tr' + (i === 0 ? ' class="new-row"' : '') + '>' +
            '<td class="gray">' + t.time + '</td>' +
            '<td><strong>' + t.coin + '</strong></td>' +
            '<td class="' + (t.side === 'BUY' ? 'buy' : 'sell') + '">' + t.side + '</td>' +
            '<td>' + formatNum(t.amount) + '</td>' +
            '<td>$' + formatNum(t.price) + '</td>' +
            '<td><strong>$' + formatNum(t.usd) + '</strong></td>' +
            '</tr>';
    });
    
    tradesBody.innerHTML = html;
}

function addTrade(coin, side, amount, price) {
    trades.unshift({
        coin: coin,
        side: side,
        amount: amount,
        price: price,
        usd: amount * price,
        time: new Date().toLocaleTimeString('tr-TR'),
        timestamp: Date.now()
    });
    
    // Bildirim gönder
    notifyTrade(side);
    
    if (trades.length > 100) trades.pop();
    totalCount++;
    updateTrades();
    updateSummary();
}

function connectWS(symbol, threshold) {
    var ws = new WebSocket('wss://fstream.binance.com/ws/' + symbol + '@aggTrade');
    
    ws.onopen = function() {
        connectedWS++;
        if (connectedWS === 1) wsStatus.classList.add('on');
        updateTrades();
    };
    
    ws.onmessage = function(e) {
        try {
            var data = JSON.parse(e.data);
            var qty = parseFloat(data.q);
            var price = parseFloat(data.p);
            if (qty >= threshold) {
                addTrade(symbol.replace('usdt','').toUpperCase(), data.m ? 'SELL' : 'BUY', qty, price);
            }
        } catch(err) {}
    };
    
    ws.onclose = function() {
        connectedWS--;
        if (connectedWS === 0) wsStatus.classList.remove('on');
        setTimeout(function() { connectWS(symbol, threshold); }, 3000);
    };
    
    websockets.push(ws);
}

function fetchFear() {
    fetch('https://api.alternative.me/fng/?limit=1')
        .then(function(r) { return r.json(); })
        .then(function(d) {
            apiStatus.classList.add('on');
            if (d && d.data && d.data[0]) {
                fearEl.textContent = d.data[0].value;
            }
        })
        .catch(function() {
            apiStatus.classList.remove('on');
        });
}

function cleanOld() {
    trades = trades.filter(function(t) { return t.timestamp > Date.now() - 14400000; });
    updateTrades();
    updateSummary();
}

filterEl.addEventListener('input', function(e) {
    filterText = e.target.value.toUpperCase().trim();
    updateSummary();
    updateTrades();
});

// İlk tıklamada ses için AudioContext başlat
document.addEventListener('click', function initAudio() {
    if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
    }
    document.removeEventListener('click', initAudio);
}, { once: true });

Object.keys(THRESHOLDS).forEach(function(s) { connectWS(s, THRESHOLDS[s]); });
fetchFear();
setInterval(fetchFear, 300000);
setInterval(cleanOld, 60000);

})();
</script>
</body>
</html>

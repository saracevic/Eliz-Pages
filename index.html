<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hyperliquid Portfolio Dashboard 🐋</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: #0a0a0a;
            color: #e5e7eb;
            padding: 12px;
            min-height: 100vh;
            font-size: 13px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Header Stats */
        .header-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 12px;
        }

        .stat-card {
            background: #1a1a1a;
            border: 1px solid #2d2d2d;
            border-radius: 8px;
            padding: 12px;
        }

        .stat-label {
            font-size: 11px;
            color: #9ca3af;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-value {
            font-size: 20px;
            font-weight: 700;
            color: #fff;
        }

        .stat-value.long {
            color: #10b981;
        }

        .stat-value.short {
            color: #ef4444;
        }

        /* Long/Short Bar */
        .position-bar-wrapper {
            background: #1a1a1a;
            border: 1px solid #2d2d2d;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 12px;
        }

        .bar-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 11px;
            color: #9ca3af;
        }

        .bar-header-left span {
            margin-right: 15px;
        }

        .position-bar {
            display: flex;
            height: 32px;
            border-radius: 6px;
            overflow: hidden;
            background: #111;
        }

        .bar-long {
            background: linear-gradient(90deg, #10b981 0%, #059669 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
            color: #fff;
            transition: width 0.3s ease;
        }

        .bar-short {
            background: linear-gradient(90deg, #ef4444 0%, #dc2626 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
            color: #fff;
            transition: width 0.3s ease;
        }

        /* Asset Position Ranking */
        .ranking-section {
            background: #1a1a1a;
            border: 1px solid #2d2d2d;
            border-radius: 8px;
            padding: 14px;
            margin-bottom: 12px;
        }

        .ranking-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding-bottom: 10px;
            border-bottom: 2px solid #2d2d2d;
        }

        .ranking-title {
            font-size: 14px;
            font-weight: 700;
            color: #fff;
        }

        .ranking-subtitle {
            font-size: 11px;
            color: #6b7280;
        }

        .ranking-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .asset-card {
            background: #111;
            border: 1px solid #2d2d2d;
            border-radius: 6px;
            padding: 10px;
            transition: all 0.2s ease;
        }

        .asset-card:hover {
            border-color: #3b82f6;
            transform: translateY(-2px);
        }

        .asset-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .asset-name {
            font-size: 14px;
            font-weight: 700;
            color: #fff;
        }

        .asset-value {
            font-size: 13px;
            font-weight: 700;
            color: #3b82f6;
        }

        .asset-position-bar {
            display: flex;
            height: 22px;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 6px;
            background: #0a0a0a;
        }

        .asset-bar-long {
            background: #10b981;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: 700;
            color: #fff;
        }

        .asset-bar-short {
            background: #ef4444;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: 700;
            color: #fff;
        }

        .asset-details {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .asset-details-long {
            color: #10b981;
        }

        .asset-details-short {
            color: #ef4444;
        }

        .asset-pnl-bar {
            display: flex;
            height: 18px;
            border-radius: 3px;
            overflow: hidden;
            background: #0a0a0a;
            margin-bottom: 4px;
        }

        .pnl-profit {
            background: rgba(16, 185, 129, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 9px;
            font-weight: 700;
            color: #10b981;
        }

        .pnl-loss {
            background: rgba(239, 68, 68, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 9px;
            font-weight: 700;
            color: #ef4444;
        }

        .asset-pnl-details {
            display: flex;
            justify-content: space-between;
            font-size: 9px;
            font-weight: 600;
        }

        /* Detail Table */
        .table-wrapper {
            background: #1a1a1a;
            border: 1px solid #2d2d2d;
            border-radius: 8px;
            overflow: hidden;
        }

        .table-container {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1200px;
        }

        thead {
            background: #111;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        th {
            padding: 12px 10px;
            text-align: left;
            font-size: 11px;
            font-weight: 700;
            color: #9ca3af;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 2px solid #2d2d2d;
            white-space: nowrap;
        }

        tbody tr {
            border-bottom: 1px solid #1f1f1f;
            transition: background 0.2s ease;
        }

        tbody tr:hover {
            background: #1f1f1f;
        }

        td {
            padding: 12px 10px;
            font-size: 12px;
            color: #e5e7eb;
            white-space: nowrap;
        }

        .token-cell {
            font-weight: 700;
            font-size: 13px;
            color: #fff;
        }

        .side-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 700;
            border: 1px solid;
        }

        .side-long {
            background: rgba(16, 185, 129, 0.15);
            color: #10b981;
            border-color: #10b981;
        }

        .side-short {
            background: rgba(239, 68, 68, 0.15);
            color: #ef4444;
            border-color: #ef4444;
        }

        .leverage-badge {
            color: #9ca3af;
            font-size: 11px;
        }

        .value-cell {
            font-weight: 700;
            color: #fff;
        }

        .pnl-positive {
            color: #10b981;
            font-weight: 700;
        }

        .pnl-negative {
            color: #ef4444;
            font-weight: 700;
        }

        .pnl-detail {
            font-size: 10px;
            color: #6b7280;
            display: block;
            margin-top: 2px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header-stats {
                grid-template-columns: 1fr;
            }

            .ranking-grid {
                grid-template-columns: 1fr;
            }

            .stat-value {
                font-size: 18px;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 8px;
            }

            .stat-card {
                padding: 10px;
            }

            .ranking-section {
                padding: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="container">

        <!-- Header Stats -->
        <div class="header-stats">
            <div class="stat-card">
                <div class="stat-label">Long Position</div>
                <div class="stat-value long" id="longPosition">$244.95M</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Short Position</div>
                <div class="stat-value short" id="shortPosition">$180.74M</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Profit</div>
                <div class="stat-value" id="profitValue">1.782</div>
            </div>
        </div>

        <!-- Long/Short Bar -->
        <div class="position-bar-wrapper">
            <div class="bar-header">
                <div class="bar-header-left">
                    <span>Long Position: <strong id="longPosValue">$244.95M</strong></span>
                    <span>Short Position: <strong id="shortPosValue">$180.74M</strong></span>
                </div>
                <div class="bar-header-right">
                    <span>Profit: <strong id="profitBarValue">1.782</strong></span>
                    <span>Loss: <strong id="lossBarValue">2.199</strong></span>
                </div>
            </div>
            <div class="position-bar">
                <div class="bar-long" id="barLong" style="width: 57.5%;">57.5%</div>
                <div class="bar-short" id="barShort" style="width: 42.5%;">42.5%</div>
            </div>
        </div>

        <!-- Asset Position Ranking -->
        <div class="ranking-section">
            <div class="ranking-header">
                <div class="ranking-title">📊 Asset Position Ranking</div>
                <div class="ranking-subtitle">Total Positions: <span id="totalPositions">21 BACK</span></div>
            </div>
            <div class="ranking-grid" id="rankingGrid">
                <!-- Assets will be populated here -->
            </div>
        </div>

        <!-- Detail Table -->
        <div class="table-wrapper">
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Token</th>
                            <th>Side</th>
                            <th>Leverage</th>
                            <th>Value</th>
                            <th>Amount</th>
                            <th>Entry Price</th>
                            <th>Profit & Loss (PnL)</th>
                            <th>Funding Fee</th>
                            <th>Liq Price</th>
                        </tr>
                    </thead>
                    <tbody id="detailTableBody">
                        <!-- Details will be populated here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // Sample Data Structure
        const portfolioData = {
            positions: [
                {
                    token: 'BTC',
                    side: 'Long',
                    leverage: '40X Isolated',
                    value: 4650000,
                    amount: 50.00,

                {

                    amount: -62.03,

                    pnl: -2220,
                    pnlPercent: -10.97,
                    fundingFee: 35.67,
                    liqPrice: 0.0036847259,
                    longValue: 2230000,

                },
                {

                    value: 167490,

                    pnl: 550.00,
                    pnlPercent: 3.28,
                    fundingFee: -8.28,
                    liqPrice: 316.51,

                    shortValue: 2620000
                },
                {
                    token: 'XRP',
                    side: 'Long',
                    leverage: '25X Isolated',
                    value: 7440000,
                    amount: 3200000,
                    entryPrice: 2.32,
                    pnl: 12500,
                    pnlPercent: 5.4,
                    fundingFee: -124.50,
                    liqPrice: 2.15,
                    longValue: 3310000,
                    shortValue: 4130000
                },
                {
                    token: 'ASTER',
                    side: 'Short',
                    leverage: '15X Isolated',
                    value: 5210000,
                    amount: -145000,
                    entryPrice: 0.0359,
                    pnl: -8900,
                    pnlPercent: -4.2,
                    fundingFee: 67.80,
                    liqPrice: 0.0385,
                    longValue: 4410000,
                    shortValue: 795890
                },
                {
                    token: 'ETH',
                    side: 'Long',
                    leverage: '35X Isolated',
                    value: 57140000,
                    amount: 15000,
                    entryPrice: 3809.27,
                    pnl: 45600,
                    pnlPercent: 11.8,
                    fundingFee: -892.30,
                    liqPrice: 3650.12,
                    longValue: 38310000,
                    shortValue: 21830000
                },
                {
                    token: 'HYPE',
                    side: 'Long',
                    leverage: '20X Isolated',
                    value: 54520000,
                    amount: 2100000,
                    entryPrice: 25.96,
                    pnl: 8900,
                    pnlPercent: 6.7,
                    fundingFee: -234.10,
                    liqPrice: 24.12,
                    longValue: 39040000,
                    shortValue: 15480000
                },
                {
                    token: 'SOL',
                    side: 'Long',
                    leverage: '30X Isolated',
                    value: 20670000,
                    amount: 95000,
                    entryPrice: 217.58,
                    pnl: 3400,
                    pnlPercent: 4.2,
                    fundingFee: -156.70,
                    liqPrice: 205.30,
                    longValue: 16460000,
                    shortValue: 4070000
                },
                {
                    token: 'ENA',
                    side: 'Short',
                    leverage: '12X Isolated',
                    value: 3620000,
                    amount: -4500000,
                    entryPrice: 0.804,
                    pnl: -1200,
                    pnlPercent: -2.8,
                    fundingFee: 45.20,
                    liqPrice: 0.845,
                    longValue: 3560000,
                    shortValue: 163170
                },
                {
                    token: 'WLFI',
                    side: 'Long',
                    leverage: '18X Isolated',
                    value: 3430000,
                    amount: 1200000,
                    entryPrice: 2.858,
                    pnl: 890,
                    pnlPercent: 2.1,
                    fundingFee: -67.40,
                    liqPrice: 2.650,
                    longValue: 1020000,
                    shortValue: 412100
                }
            ]
        };

        // Calculate totals
        function calculateTotals() {
            let longTotal = 0;
            let shortTotal = 0;
            let profitCount = 0;
            let lossCount = 0;

            portfolioData.positions.forEach(pos => {
                if (pos.side === 'Long') {
                    longTotal += pos.value;
                } else {
                    shortTotal += pos.value;
                }

                if (pos.pnl > 0) {
                    profitCount++;
                } else if (pos.pnl < 0) {
                    lossCount++;
                }
            });

            return { longTotal, shortTotal, profitCount, lossCount };
        }

        // Format currency
        function formatCurrency(value) {
            if (Math.abs(value) >= 1000000) {
                return '$' + (value / 1000000).toFixed(2) + 'M';
            } else if (Math.abs(value) >= 1000) {
                return '$' + (value / 1000).toFixed(2) + 'K';
            }
            return '$' + value.toFixed(2);
        }

        // Format number
        function formatNumber(value) {
            if (Math.abs(value) >= 1000000) {
                return (value / 1000000).toFixed(2) + 'M';
            } else if (Math.abs(value) >= 1000) {
                return (value / 1000).toFixed(2) + 'K';
            }
            return value.toFixed(2);
        }

        // Format price
        function formatPrice(price) {
            if (price >= 1000) {
                return '$' + price.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            } else if (price >= 1) {
                return '$' + price.toFixed(2);
            } else if (price >= 0.01) {
                return '$' + price.toFixed(4);
            } else {
                return '$' + price.toFixed(6);
            }
        }

        // Update header stats
        function updateHeaderStats() {
            const totals = calculateTotals();
            
            document.getElementById('longPosition').textContent = formatCurrency(totals.longTotal);
            document.getElementById('shortPosition').textContent = formatCurrency(totals.shortTotal);
            document.getElementById('profitValue').textContent = totals.profitCount.toString();
            
            document.getElementById('longPosValue').textContent = formatCurrency(totals.longTotal);
            document.getElementById('shortPosValue').textContent = formatCurrency(totals.shortTotal);
            document.getElementById('profitBarValue').textContent = totals.profitCount.toString();
            document.getElementById('lossBarValue').textContent = totals.lossCount.toString();

            const totalValue = totals.longTotal + totals.shortTotal;
            const longPercent = totalValue > 0 ? (totals.longTotal / totalValue) * 100 : 50;
            const shortPercent = 100 - longPercent;

            document.getElementById('barLong').style.width = longPercent + '%';
            document.getElementById('barShort').style.width = shortPercent + '%';
            document.getElementById('barLong').textContent = longPercent.toFixed(1) + '%';
            document.getElementById('barShort').textContent = shortPercent.toFixed(1) + '%';
        }

        // Populate ranking grid
        function populateRanking() {
            const sortedPositions = [...portfolioData.positions]
                .sort((a, b) => b.value - a.value)
                .slice(0, 10);

            const rankingGrid = document.getElementById('rankingGrid');
            rankingGrid.innerHTML = '';

            sortedPositions.forEach(pos => {
                const longValue = pos.longValue || 0;
                const shortValue = pos.shortValue || 0;
                const totalValue = longValue + shortValue;
                
                const longPercent = totalValue > 0 ? (longValue / totalValue) * 100 : 0;
                const shortPercent = totalValue > 0 ? (shortValue / totalValue) * 100 : 0;

                // Calculate profit/loss distribution
                let profitCount = 0;
                let lossCount = 0;
                portfolioData.positions.forEach(p => {
                    if (p.token === pos.token) {
                        if (p.pnl > 0) profitCount++;
                        else if (p.pnl < 0) lossCount++;
                    }
                });

                const totalPositions = profitCount + lossCount || 1;
                const profitPercent = (profitCount / totalPositions) * 100;
                const lossPercent = (lossCount / totalPositions) * 100;

                const card = document.createElement('div');
                card.className = 'asset-card';
                card.innerHTML = `
                    <div class="asset-header">
                        <div class="asset-name">${pos.token}</div>
                        <div class="asset-value">${formatCurrency(pos.value)}</div>
                    </div>
                    <div class="asset-position-bar">
                        <div class="asset-bar-long" style="width: ${longPercent}%;">
                            ${longPercent > 15 ? longPercent.toFixed(0) + '%' : ''}
                        </div>
                        <div class="asset-bar-short" style="width: ${shortPercent}%;">
                            ${shortPercent > 15 ? shortPercent.toFixed(0) + '%' : ''}
                        </div>
                    </div>
                    <div class="asset-details">
                        <span class="asset-details-long">L: ${formatCurrency(longValue)}</span>
                        <span class="asset-details-short">S: ${formatCurrency(shortValue)}</span>
                    </div>
                    <div class="asset-pnl-bar">
                        <div class="pnl-profit" style="width: ${profitPercent}%;">
                            ${profitPercent > 20 ? profitCount : ''}
                        </div>
                        <div class="pnl-loss" style="width: ${lossPercent}%;">
                            ${lossPercent > 20 ? lossCount : ''}
                        </div>
                    </div>
                    <div class="asset-pnl-details">
                        <span style="color: #10b981;">Profit: ${profitCount}</span>
                        <span style="color: #ef4444;">Loss: ${lossCount}</span>
                    </div>
                `;
                rankingGrid.appendChild(card);
            });

            document.getElementById('totalPositions').textContent = 
                portfolioData.positions.length + ' BACK';
        }

        // Populate detail table
        function populateDetailTable() {
            const tbody = document.getElementById('detailTableBody');
            tbody.innerHTML = '';

            portfolioData.positions.forEach(pos => {
                const row = document.createElement('tr');
                
                const pnlClass = pos.pnl >= 0 ? 'pnl-positive' : 'pnl-negative';
                const fundingClass = pos.fundingFee >= 0 ? 'pnl-positive' : 'pnl-negative';
                const pnlSign = pos.pnl >= 0 ? '+' : '';
                const fundingSign = pos.fundingFee >= 0 ? '+' : '';

                row.innerHTML = `
                    <td class="token-cell">${pos.token}</td>
                    <td>
                        <span class="side-badge side-${pos.side.toLowerCase()}">
                            ${pos.side}
                        </span>
                    </td>
                    <td class="leverage-badge">${pos.leverage}</td>
                    <td class="value-cell">${formatCurrency(pos.value)}</td>
                    <td>${formatNumber(pos.amount)}</td>
                    <td>${formatPrice(pos.entryPrice)}</td>
                    <td class="${pnlClass}">
                        ${pnlSign}${formatCurrency(pos.pnl)}
                        <span class="pnl-detail">${pnlSign}${pos.pnlPercent.toFixed(2)}%</span>
                    </td>
                    <td class="${fundingClass}">
                        ${fundingSign}${formatCurrency(pos.fundingFee)}
                    </td>
                    <td>${formatPrice(pos.liqPrice)}</td>
                `;
                
                tbody.appendChild(row);
            });
        }

        // Initialize dashboard
        function initDashboard() {
            updateHeaderStats();
            populateRanking();
            populateDetailTable();
        }

        // Run on page load
        document.addEventListener('DOMContentLoaded', function() {
            initDashboard();
            console.log('🐋 Hyperliquid Portfolio Dashboard Loaded!');
        });

        // Optional: Auto refresh every 30 seconds
        setInterval(function() {
            // Here you can add API calls to refresh data
            console.log('♻️ Auto refresh triggered');
            initDashboard();
        }, 30000);

        // Add smooth scroll for mobile
        document.querySelector('.table-container').addEventListener('scroll', function() {
            const scrollLeft = this.scrollLeft;
            if (scrollLeft > 0) {
                this.style.boxShadow = 'inset 10px 0 10px -10px rgba(0,0,0,0.5)';
            } else {
                this.style.boxShadow = 'none';
            }
        });

        // Add touch swipe optimization for Safari
        let touchStartX = 0;
        let touchEndX = 0;
        
        const tableContainer = document.querySelector('.table-container');
        
        tableContainer.addEventListener('touchstart', function(e) {
            touchStartX = e.changedTouches[0].screenX;
        }, { passive: true });
        
        tableContainer.addEventListener('touchend', function(e) {
            touchEndX = e.changedTouches[0].screenX;
            handleSwipe();
        }, { passive: true });
        
        function handleSwipe() {
            const swipeThreshold = 50;
            const diff = touchStartX - touchEndX;
            
            if (Math.abs(diff) > swipeThreshold) {
                // Swipe detected - smooth scroll animation
                tableContainer.style.scrollBehavior = 'smooth';
                setTimeout(() => {
                    tableContainer.style.scrollBehavior = 'auto';
                }, 300);
            }
        }

        // Performance optimization: Debounce resize events
        let resizeTimer;
        window.addEventListener('resize', function() {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(function() {
                initDashboard();
            }, 250);
        });

        // Add intersection observer for lazy loading (performance boost)
        const observerOptions = {
            root: null,
            rootMargin: '0px',
            threshold: 0.1
        };

        const observer = new IntersectionObserver(function(entries) {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.style.opacity = '1';
                    entry.target.style.transform = 'translateY(0)';
                }
            });
        }, observerOptions);

        // Observe all asset cards for animation
        document.querySelectorAll('.asset-card').forEach(card => {
            card.style.opacity = '0';
            card.style.transform = 'translateY(20px)';
            card.style.transition = 'all 0.3s ease';
            observer.observe(card);
        });

        // Add dark mode detection (Safari support)
        if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.body.classList.add('dark-mode');
        }

        // Listen for dark mode changes
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
            if (e.matches) {
                document.body.classList.add('dark-mode');
            } else {
                document.body.classList.remove('dark-mode');
            }
        });

        // Safari-specific optimizations
        const isSafari = /^((?!chrome|android).)*safari/i.test(navigator.userAgent);
        if (isSafari) {
            // Enable hardware acceleration
            document.querySelector('.container').style.transform = 'translateZ(0)';
            document.querySelector('.table-container').style.transform = 'translateZ(0)';
            
            // Optimize scrolling
            document.querySelector('.table-container').style.webkitOverflowScrolling = 'touch';
        }

        console.log('✅ All optimizations loaded');
        console.log('📱 Mobile-optimized for Safari');
        console.log('🎨 Dark theme active');
    </script>
</body>
</html>

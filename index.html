<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookmap Pro - T&S Heatmap</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Consolas', 'Monaco', monospace;
            background: #000;
            color: #fff;
            overflow: hidden;
            height: 100vh;
        }

        .main-grid {
            display: grid;
            grid-template-columns: 1fr 380px;
            grid-template-rows: 60px 1fr 120px;
            height: 100vh;
            gap: 2px;
            background: #0a0a0a;
        }

        .header {
            grid-column: 1 / -1;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #00ff88;
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 3px;
            color: #00ff88;
            text-shadow: 0 0 20px rgba(0, 255, 136, 0.5);
        }

        .controls {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .symbol-btn {
            padding: 10px 20px;
            background: rgba(0, 255, 136, 0.1);
            border: 1px solid #00ff88;
            border-radius: 6px;
            color: #00ff88;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .symbol-btn:hover {
            background: rgba(0, 255, 136, 0.2);
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.3);
        }

        .symbol-btn.active {
            background: #00ff88;
            color: #000;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: #00ff88;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #00ff88;
            box-shadow: 0 0 10px #00ff88;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .heatmap-container {
            background: #0a0a0a;
            position: relative;
            overflow: hidden;
            border-right: 1px solid #1a1a1a;
        }

        #heatmapCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .tape-container {
            background: #0a0a0a;
            display: flex;
            flex-direction: column;
            border-left: 1px solid #1a1a1a;
        }

        .tape-header {
            display: grid;
            grid-template-columns: 100px 120px 1fr;
            gap: 10px;
            padding: 12px 15px;
            background: #16213e;
            font-size: 11px;
            font-weight: 700;
            color: #00ff88;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 2px solid #00ff88;
        }

        .tape-body {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
        }

        .tape-body::-webkit-scrollbar {
            width: 8px;
        }

        .tape-body::-webkit-scrollbar-track {
            background: #0a0a0a;
        }

        .tape-body::-webkit-scrollbar-thumb {
            background: #00ff88;
            border-radius: 4px;
        }

        .tape-row {
            display: grid;
            grid-template-columns: 100px 120px 1fr;
            gap: 10px;
            padding: 6px 15px;
            font-size: 13px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            animation: slideIn 0.2s ease;
        }

        @keyframes slideIn {
            from {
                transform: translateY(-10px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .tape-row.buy {
            background: rgba(0, 255, 136, 0.05);
            border-left: 3px solid #00ff88;
        }

        .tape-row.sell {
            background: rgba(255, 68, 102, 0.05);
            border-left: 3px solid #ff4466;
        }

        .tape-row.whale {
            background: rgba(255, 215, 0, 0.1);
            border: 1px solid #ffd700;
            font-weight: 700;
            animation: glow 1.5s infinite;
        }

        @keyframes glow {
            0%, 100% { box-shadow: 0 0 5px rgba(255, 215, 0, 0.3); }
            50% { box-shadow: 0 0 15px rgba(255, 215, 0, 0.6); }
        }

        .tape-time {
            color: #666;
            font-family: monospace;
        }

        .tape-price {
            font-weight: 700;
        }

        .tape-row.buy .tape-price {
            color: #00ff88;
        }

        .tape-row.sell .tape-price {
            color: #ff4466;
        }

        .tape-size {
            text-align: right;
            color: #aaa;
        }

        .tape-row.whale .tape-size {
            color: #ffd700;
        }

        .delta-container {
            grid-column: 1 / -1;
            background: #0a0a0a;
            padding: 15px;
            border-top: 1px solid #1a1a1a;
        }

        .delta-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .delta-title {
            font-size: 12px;
            font-weight: 700;
            color: #00ff88;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .delta-stats {
            display: flex;
            gap: 30px;
            font-size: 11px;
        }

        .delta-stat {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .delta-stat.buy {
            color: #00ff88;
        }

        .delta-stat.sell {
            color: #ff4466;
        }

        .delta-stat.net {
            color: #ffd700;
        }

        .delta-bars {
            display: flex;
            align-items: center;
            height: 50px;
            background: #16213e;
            border-radius: 6px;
            overflow: hidden;
            position: relative;
        }

        .delta-bar {
            height: 100%;
            transition: width 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
        }

        .delta-bar.buy {
            background: linear-gradient(90deg, transparent, #00ff88);
            color: #00ff88;
        }

        .delta-bar.sell {
            background: linear-gradient(270deg, transparent, #ff4466);
            color: #ff4466;
        }

        .delta-center {
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            width: 2px;
            background: #ffd700;
            z-index: 10;
        }

        .price-ladder {
            position: absolute;
            right: 0;
            top: 0;
            bottom: 0;
            width: 100px;
            background: rgba(0, 0, 0, 0.8);
            border-left: 1px solid #00ff88;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            padding: 10px 5px;
            font-size: 11px;
            z-index: 100;
        }

        .price-level {
            padding: 4px 8px;
            text-align: right;
            color: #666;
            border-radius: 3px;
            transition: all 0.2s;
        }

        .price-level:hover {
            background: rgba(0, 255, 136, 0.1);
            color: #00ff88;
        }

        .whale-alert {
            position: fixed;
            top: 80px;
            right: 20px;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            border: 2px solid #ffd700;
            border-radius: 8px;
            padding: 15px 20px;
            min-width: 300px;
            box-shadow: 0 10px 40px rgba(255, 215, 0, 0.3);
            transform: translateX(400px);
            transition: transform 0.4s ease;
            z-index: 1000;
        }

        .whale-alert.show {
            transform: translateX(0);
        }

        .whale-alert-title {
            font-size: 14px;
            font-weight: 700;
            color: #ffd700;
            margin-bottom: 8px;
        }

        .whale-alert-message {
            font-size: 13px;
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="main-grid">
        <div class="header">
            <div class="logo">⚡ BOOKMAP PRO</div>
            <div class="controls">
                <button class="symbol-btn active" data-symbol="BTCUSDT">BTC/USDT</button>
                <button class="symbol-btn" data-symbol="ETHUSDT">ETH/USDT</button>
                <button class="symbol-btn" data-symbol="SOLUSDT">SOL/USDT</button>
                <div class="status-indicator">
                    <div class="status-dot"></div>
                    <span id="statusText">LIVE</span>
                </div>
            </div>
        </div>

        <div class="heatmap-container">
            <canvas id="heatmapCanvas"></canvas>
            <div class="price-ladder" id="priceLadder"></div>
        </div>

        <div class="tape-container">
            <div class="tape-header">
                <div>TIME</div>
                <div>PRICE</div>
                <div style="text-align: right;">SIZE</div>
            </div>
            <div class="tape-body" id="tapeBody"></div>
        </div>

        <div class="delta-container">
            <div class="delta-header">
                <div class="delta-title">📊 VOLUME DELTA (1M)</div>
                <div class="delta-stats">
                    <div class="delta-stat buy">
                        BUY: <span id="buyVol">0</span>
                    </div>
                    <div class="delta-stat sell">
                        SELL: <span id="sellVol">0</span>
                    </div>
                    <div class="delta-stat net">
                        NET: <span id="netDelta">0</span>
                    </div>
                </div>
            </div>
            <div class="delta-bars">
                <div class="delta-bar buy" id="buyBar"></div>
                <div class="delta-center"></div>
                <div class="delta-bar sell" id="sellBar"></div>
            </div>
        </div>
    </div>

    <div class="whale-alert" id="whaleAlert">
        <div class="whale-alert-title">🐋 WHALE DETECTED</div>
        <div class="whale-alert-message" id="whaleMessage"></div>
    </div>

    <script>
        // PART 1: GLOBAL STATE & CONFIG
        const CONFIG = {
            maxTrades: 200,
            // TAPE'TE GÖSTER (Time & Sales ekranı için)
            displayThresholds: {
                BTCUSDT: 0.1,    // 0.1 BTC = ~$9.5K (tape'te göster)
                ETHUSDT: 3,      // 3 ETH = ~$10K
                SOLUSDT: 50      // 50 SOL = ~$10K
            },
            // WHALE ALERT (bildirim için)
            whaleThresholds: {
                BTCUSDT: 1,      // 1 BTC = ~$95K
                ETHUSDT: 30,     // 30 ETH = ~$100K
                SOLUSDT: 500     // 500 SOL = ~$100K
            },
            heatmapLevels: 50,
            priceTickSize: {
                BTCUSDT: 10,
                ETHUSDT: 1,
                SOLUSDT: 0.1
            }
        };

        const STATE = {
            currentSymbol: 'BTCUSDT',
            ws: null,
            trades: [],
            volumeData: {
                buy: 0,
                sell: 0
            },
            priceRange: {
                min: 0,
                max: 0
            },
            heatmapData: new Map(),
            lastResetTime: Date.now()
        };

        // DOM Elements
        const canvas = document.getElementById('heatmapCanvas');
        const ctx = canvas.getContext('2d');
        const tapeBody = document.getElementById('tapeBody');
        const priceLadder = document.getElementById('priceLadder');
        const statusText = document.getElementById('statusText');
        const buyVolEl = document.getElementById('buyVol');
        const sellVolEl = document.getElementById('sellVol');
        const netDeltaEl = document.getElementById('netDelta');
        const buyBar = document.getElementById('buyBar');
        const sellBar = document.getElementById('sellBar');
        const whaleAlert = document.getElementById('whaleAlert');
        const whaleMessage = document.getElementById('whaleMessage');

        // Canvas setup
        function resizeCanvas() {
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Symbol selector
        document.querySelectorAll('.symbol-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.symbol-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                STATE.currentSymbol = btn.dataset.symbol;
                resetState();
                connectWebSocket();
            });
        });

        function resetState() {
            STATE.trades = [];
            STATE.volumeData = { buy: 0, sell: 0 };
            STATE.heatmapData.clear();
            STATE.lastResetTime = Date.now();
            tapeBody.innerHTML = '';
            updateDeltaBars();
        }

        // PART 2: WEBSOCKET & HEATMAP LOGIC (UPDATED - LIVE DATA)
        
        // WebSocket Connection - REAL BINANCE API
        function connectWebSocket() {
            if (STATE.ws) {
                STATE.ws.close();
            }

            const symbol = STATE.currentSymbol.toLowerCase();
            // GERÇEK BİNANCE WEBSOCKET - DEMO DEĞİL!
            STATE.ws = new WebSocket(`wss://stream.binance.com:9443/ws/${symbol}@trade`);

            STATE.ws.onopen = () => {
                console.log('✅ CONNECTED TO LIVE BINANCE:', STATE.currentSymbol);
                console.log('📡 Real-time trades incoming...');
                statusText.textContent = 'LIVE';
                statusText.style.color = '#00ff88';
            };

            STATE.ws.onmessage = (event) => {
                const trade = JSON.parse(event.data);
                processTrade(trade);
            };

            STATE.ws.onerror = (error) => {
                console.error('❌ WebSocket Error:', error);
                statusText.textContent = 'ERROR';
                statusText.style.color = '#ff4466';
            };

            STATE.ws.onclose = () => {
                console.log('⚠️ Disconnected - Reconnecting in 3s...');
                statusText.textContent = 'RECONNECTING';
                statusText.style.color = '#ffa500';
                setTimeout(connectWebSocket, 3000);
            };
        }

        // Process incoming trade - HER TRADE GÖSTER
        function processTrade(trade) {
            const price = parseFloat(trade.p);
            const quantity = parseFloat(trade.q);
            const isBuy = !trade.m;
            const timestamp = trade.T;

            // Initialize price range on first trade
            if (STATE.priceRange.max === 0) {
                STATE.priceRange.min = price - 100;
                STATE.priceRange.max = price + 100;
                console.log('📊 Price range initialized:', STATE.priceRange);
            }

            // LOG HER TRADE - CONSOLE'DA GÖRECEKSIN!
            console.log(`${isBuy ? '🟢 BUY' : '🔴 SELL'} ${formatQuantity(quantity)} ${STATE.currentSymbol.replace('USDT','')} @ ${formatPrice(price)}`);

            // Add to tape (TÜM TRADE'LER - WHALE OLMASA DA!)
            addToTape({
                time: formatTime(timestamp),
                price: price,
                quantity: quantity,
                isBuy: isBuy,
                isWhale: isWhaleTrade(quantity)
            });

            // Update volume delta
            if (isBuy) {
                STATE.volumeData.buy += quantity;
            } else {
                STATE.volumeData.sell += quantity;
            }

            // Add to heatmap
            addToHeatmap(price, quantity, isBuy);

            // Check whale alert (1 BTC = WHALE!)
            if (isWhaleTrade(quantity)) {
                console.log('🐋 WHALE ALERT! 🐋', formatQuantity(quantity), STATE.currentSymbol.replace('USDT',''));
                showWhaleAlert(price, quantity, isBuy);
            }

            // Update UI
            updateDeltaBars();
            updatePriceLadder();

            // Reset every minute
            if (Date.now() - STATE.lastResetTime > 60000) {
                console.log('🔄 Resetting 1-minute delta');
                STATE.volumeData = { buy: 0, sell: 0 };
                STATE.lastResetTime = Date.now();
            }
        }

        // Format timestamp
        function formatTime(timestamp) {
            const date = new Date(timestamp);
            const h = String(date.getHours()).padStart(2, '0');
            const m = String(date.getMinutes()).padStart(2, '0');
            const s = String(date.getSeconds()).padStart(2, '0');
            const ms = String(date.getMilliseconds()).padStart(3, '0');
            return `${h}:${m}:${s}.${ms}`;
        }

        // Check if whale trade
        function isWhaleTrade(quantity) {
            const threshold = CONFIG.whaleThresholds[STATE.currentSymbol] || 5;
            return quantity >= threshold;
        }

        // Add trade to tape
        function addToTape(trade) {
            STATE.trades.unshift(trade);
            if (STATE.trades.length > CONFIG.maxTrades) {
                STATE.trades.pop();
            }

            // Render only visible trades (performance)
            renderTape();
        }

        // Render tape
        function renderTape() {
            const fragment = document.createDocumentFragment();
            
            STATE.trades.slice(0, 100).forEach(trade => {
                const row = document.createElement('div');
                row.className = `tape-row ${trade.isBuy ? 'buy' : 'sell'} ${trade.isWhale ? 'whale' : ''}`;
                
                row.innerHTML = `
                    <div class="tape-time">${trade.time}</div>
                    <div class="tape-price">${formatPrice(trade.price)}</div>
                    <div class="tape-size">${formatQuantity(trade.quantity)}</div>
                `;
                
                fragment.appendChild(row);
            });

            tapeBody.innerHTML = '';
            tapeBody.appendChild(fragment);
        }

        // Format price
        function formatPrice(price) {
            if (STATE.currentSymbol === 'BTCUSDT' || STATE.currentSymbol === 'ETHUSDT') {
                return price.toFixed(2);
            } else if (STATE.currentSymbol === 'SOLUSDT') {
                return price.toFixed(2);
            }
            return price.toFixed(2);
        }

        // Format quantity
        function formatQuantity(quantity) {
            if (STATE.currentSymbol === 'BTCUSDT') {
                if (quantity >= 1) return quantity.toFixed(3);
                if (quantity >= 0.01) return quantity.toFixed(4);
                return quantity.toFixed(5);
            } else if (STATE.currentSymbol === 'ETHUSDT') {
                if (quantity >= 10) return quantity.toFixed(2);
                if (quantity >= 1) return quantity.toFixed(3);
                return quantity.toFixed(4);
            } else if (STATE.currentSymbol === 'SOLUSDT') {
                if (quantity >= 100) return quantity.toFixed(1);
                return quantity.toFixed(2);
            }
            return quantity.toFixed(2);
        }

        // Add to heatmap
        function addToHeatmap(price, quantity, isBuy) {
            const priceLevel = Math.round(price / CONFIG.priceTickSize[STATE.currentSymbol]) * CONFIG.priceTickSize[STATE.currentSymbol];
            
            if (!STATE.heatmapData.has(priceLevel)) {
                STATE.heatmapData.set(priceLevel, { buy: 0, sell: 0, timestamps: [] });
            }

            const level = STATE.heatmapData.get(priceLevel);
            if (isBuy) {
                level.buy += quantity;
            } else {
                level.sell += quantity;
            }
            level.timestamps.push(Date.now());

            // Clean old data (keep last 5 minutes)
            const fiveMinutesAgo = Date.now() - 300000;
            STATE.heatmapData.forEach((value, key) => {
                value.timestamps = value.timestamps.filter(t => t > fiveMinutesAgo);
                if (value.timestamps.length === 0) {
                    STATE.heatmapData.delete(key);
                }
            });
        }

        // Draw heatmap
        function drawHeatmap() {
            ctx.fillStyle = '#0a0a0a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (STATE.heatmapData.size === 0) return;

            const prices = Array.from(STATE.heatmapData.keys()).sort((a, b) => b - a);
            const maxPrice = prices[0];
            const minPrice = prices[prices.length - 1];
            const priceRange = maxPrice - minPrice;

            if (priceRange === 0) return;

            const maxVolume = Math.max(...Array.from(STATE.heatmapData.values()).map(v => v.buy + v.sell));
            const cellHeight = canvas.height / prices.length;
            const timeWidth = canvas.width - 100;

            prices.forEach((price, index) => {
                const data = STATE.heatmapData.get(price);
                const y = index * cellHeight;

                // Buy volume (green)
                if (data.buy > 0) {
                    const intensity = data.buy / maxVolume;
                    const width = timeWidth * intensity;
                    ctx.fillStyle = `rgba(0, 255, 136, ${0.2 + intensity * 0.6})`;
                    ctx.fillRect(0, y, width, cellHeight);
                }

                // Sell volume (red)
                if (data.sell > 0) {
                    const intensity = data.sell / maxVolume;
                    const width = timeWidth * intensity;
                    ctx.fillStyle = `rgba(255, 68, 102, ${0.2 + intensity * 0.6})`;
                    ctx.fillRect(timeWidth - width, y, width, cellHeight);
                }

                // Price grid lines
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width - 100, y);
                ctx.stroke();
            });

            // Current price line
            if (STATE.trades.length > 0) {
                const currentPrice = STATE.trades[0].price;
                const priceIndex = prices.findIndex(p => p <= currentPrice);
                if (priceIndex !== -1) {
                    const y = priceIndex * cellHeight;
                    ctx.strokeStyle = '#ffd700';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(0, y);
                    ctx.lineTo(canvas.width - 100, y);
                    ctx.stroke();
                    ctx.lineWidth = 1;
                }
            }
        }

        // Update price ladder
        function updatePriceLadder() {
            if (STATE.heatmapData.size === 0) return;

            const prices = Array.from(STATE.heatmapData.keys()).sort((a, b) => b - a);
            const step = Math.max(1, Math.floor(prices.length / 15));
            
            priceLadder.innerHTML = '';
            
            for (let i = 0; i < prices.length; i += step) {
                const div = document.createElement('div');
                div.className = 'price-level';
                div.textContent = formatPrice(prices[i]);
                priceLadder.appendChild(div);
            }
        }

        // PART 3: DELTA BARS + WHALE ALERTS + INITIALIZATION

        // Update delta bars
        function updateDeltaBars() {
            const buyVol = STATE.volumeData.buy;
            const sellVol = STATE.volumeData.sell;
            const totalVol = buyVol + sellVol;
            const netDelta = buyVol - sellVol;

            // Update text values
            buyVolEl.textContent = formatQuantity(buyVol);
            sellVolEl.textContent = formatQuantity(sellVol);
            netDeltaEl.textContent = formatQuantity(Math.abs(netDelta));
            netDeltaEl.style.color = netDelta >= 0 ? '#00ff88' : '#ff4466';

            // Update bars
            if (totalVol > 0) {
                const buyPercent = (buyVol / totalVol) * 50;
                const sellPercent = (sellVol / totalVol) * 50;

                buyBar.style.width = `${buyPercent}%`;
                sellBar.style.width = `${sellPercent}%`;

                // Show values in bars if enough space
                if (buyPercent > 10) {
                    buyBar.textContent = formatQuantity(buyVol);
                } else {
                    buyBar.textContent = '';
                }

                if (sellPercent > 10) {
                    sellBar.textContent = formatQuantity(sellVol);
                } else {
                    sellBar.textContent = '';
                }
            } else {
                buyBar.style.width = '0%';
                sellBar.style.width = '0%';
                buyBar.textContent = '';
                sellBar.textContent = '';
            }
        }

        // Show whale alert
        function showWhaleAlert(price, quantity, isBuy) {
            const symbol = STATE.currentSymbol.replace('USDT', '');
            const tradeValue = (price * quantity).toFixed(0);
            
            const message = `${isBuy ? '🟢 BUY' : '🔴 SELL'} ${formatQuantity(quantity)} ${symbol} @ ${formatPrice(price)} (${tradeValue})`;
            
            whaleMessage.textContent = message;
            whaleAlert.classList.add('show');

            // Play sound
            playWhaleSound();

            // Hide after 5 seconds
            setTimeout(() => {
                whaleAlert.classList.remove('show');
            }, 5000);
        }

        // Audio context for sounds
        let audioContext = null;

        function initAudio() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playWhaleSound() {
            if (!audioContext) return;

            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();

            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);

            oscillator.frequency.value = 880;
            oscillator.type = 'sine';

            gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.3);

            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 0.3);
        }

        // Initialize audio on first click
        document.addEventListener('click', () => {
            initAudio();
        }, { once: true });

        // Heatmap animation loop
        function animateHeatmap() {
            drawHeatmap();
            requestAnimationFrame(animateHeatmap);
        }

        // Initialize on load
        window.addEventListener('load', () => {
            console.log('🚀 Bookmap Pro Starting...');
            connectWebSocket();
            animateHeatmap();

            // Update UI every 100ms
            setInterval(() => {
                updateDeltaBars();
            }, 100);

            // Redraw heatmap every 500ms
            setInterval(() => {
                if (STATE.heatmapData.size > 0) {
                    updatePriceLadder();
                }
            }, 500);
        });

        // Cleanup on unload
        window.addEventListener('beforeunload', () => {
            if (STATE.ws) {
                STATE.ws.close();
            }
        });

        // Handle visibility change
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                console.log('⏸️ Page hidden - maintaining connection');
            } else {
                console.log('▶️ Page visible - checking connection');
                if (!STATE.ws || STATE.ws.readyState !== WebSocket.OPEN) {
                    connectWebSocket();
                }
            }
        });

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            // Space = pause/resume (optional feature)
            if (e.code === 'Space') {
                e.preventDefault();
                // Could implement pause functionality here
            }
            
            // R = reset delta
            if (e.code === 'KeyR') {
                STATE.volumeData = { buy: 0, sell: 0 };
                STATE.lastResetTime = Date.now();
                updateDeltaBars();
                console.log('🔄 Delta reset');
            }

            // C = clear heatmap
            if (e.code === 'KeyC') {
                STATE.heatmapData.clear();
                console.log('🧹 Heatmap cleared');
            }

            // 1-3 = switch symbols
            if (e.code === 'Digit1') {
                document.querySelector('[data-symbol="BTCUSDT"]').click();
            }
            if (e.code === 'Digit2') {
                document.querySelector('[data-symbol="ETHUSDT"]').click();
            }
            if (e.code === 'Digit3') {
                document.querySelector('[data-symbol="SOLUSDT"]').click();
            }
        });

        console.log('⚡ Bookmap Pro Loaded');
        console.log('Keyboard Shortcuts:');
        console.log('  R = Reset Delta');
        console.log('  C = Clear Heatmap');
        console.log('  1/2/3 = Switch Symbols');
    </script>
</body>
</html>

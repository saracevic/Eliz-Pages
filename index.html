<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookmap Time & Sales</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #1a1d24;
            color: #c8ccd4;
            overflow: hidden;
            height: 100vh;
        }

        .container {
            display: grid;
            grid-template-columns: 80px 1fr;
            height: 100vh;
        }

        /* SOL PRICE LADDER */
        .price-ladder {
            background: #232830;
            border-right: 1px solid #2d3139;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            font-size: 12px;
            color: #7d8590;
        }

        .price-ladder::-webkit-scrollbar {
            width: 4px;
        }

        .price-ladder::-webkit-scrollbar-track {
            background: #1a1d24;
        }

        .price-ladder::-webkit-scrollbar-thumb {
            background: #3d4451;
        }

        .price-item {
            padding: 6px 10px;
            text-align: right;
            border-bottom: 1px solid #2d3139;
            transition: background 0.2s;
        }

        .price-item:hover {
            background: #2d3139;
            color: #fff;
        }

        .price-item.current {
            background: #3d4451;
            color: #ffd700;
            font-weight: 600;
        }

        /* SAĞ PANEL */
        .right-panel {
            display: flex;
            flex-direction: column;
            background: #1a1d24;
        }

        /* HEADER */
        .header {
            background: #232830;
            padding: 12px 20px;
            border-bottom: 1px solid #2d3139;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .title {
            font-size: 14px;
            font-weight: 600;
            color: #fff;
            letter-spacing: 0.5px;
        }

        .symbol-selector {
            display: flex;
            gap: 8px;
        }

        .symbol-btn {
            padding: 6px 14px;
            background: #2d3139;
            border: 1px solid #3d4451;
            border-radius: 4px;
            color: #c8ccd4;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .symbol-btn:hover {
            background: #3d4451;
            border-color: #4d5461;
        }

        .symbol-btn.active {
            background: #4a90e2;
            border-color: #4a90e2;
            color: #fff;
        }

        /* FILTERS */
        .filters {
            background: #232830;
            padding: 12px 20px;
            border-bottom: 1px solid #2d3139;
            display: flex;
            gap: 20px;
            align-items: center;
            flex-wrap: wrap;
        }

        .filter-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .filter-label {
            font-size: 11px;
            color: #7d8590;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .filter-input {
            width: 70px;
            padding: 5px 8px;
            background: #1a1d24;
            border: 1px solid #3d4451;
            border-radius: 3px;
            color: #c8ccd4;
            font-size: 12px;
        }

        .filter-input:focus {
            outline: none;
            border-color: #4a90e2;
        }

        .radio-group {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .radio-label {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 12px;
            cursor: pointer;
        }

        .radio-label input[type="radio"] {
            cursor: pointer;
        }

        /* TABLE */
        .table-container {
            flex: 1;
            overflow-y: auto;
            background: #1a1d24;
        }

        .table-container::-webkit-scrollbar {
            width: 8px;
        }

        .table-container::-webkit-scrollbar-track {
            background: #1a1d24;
        }

        .table-container::-webkit-scrollbar-thumb {
            background: #3d4451;
            border-radius: 4px;
        }

        .table-header {
            display: grid;
            grid-template-columns: 120px 100px 1fr;
            padding: 10px 20px;
            background: #232830;
            border-bottom: 1px solid #2d3139;
            position: sticky;
            top: 0;
            z-index: 10;
            font-size: 11px;
            color: #7d8590;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }

        .table-body {
            font-size: 13px;
        }

        .trade-row {
            display: grid;
            grid-template-columns: 120px 100px 1fr;
            padding: 6px 20px;
            border-bottom: 1px solid #252930;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-5px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .trade-row.buy {
            background: rgba(76, 175, 80, 0.08);
        }

        .trade-row.sell {
            background: rgba(244, 67, 54, 0.08);
        }

        .trade-row.whale {
            background: rgba(255, 215, 0, 0.12);
            border-left: 3px solid #ffd700;
            font-weight: 600;
        }

        .trade-time {
            color: #7d8590;
            font-family: 'Courier New', monospace;
        }

        .trade-price {
            font-weight: 600;
            font-family: 'Courier New', monospace;
        }

        .trade-row.buy .trade-price {
            color: #4caf50;
        }

        .trade-row.sell .trade-price {
            color: #f44336;
        }

        .trade-size {
            text-align: right;
            color: #c8ccd4;
        }

        .trade-row.whale .trade-size {
            color: #ffd700;
        }

        /* STATUS BAR */
        .status-bar {
            background: #232830;
            padding: 8px 20px;
            border-top: 1px solid #2d3139;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
        }

        .status-left {
            display: flex;
            gap: 20px;
            color: #7d8590;
        }

        .status-item {
            display: flex;
            gap: 5px;
        }

        .status-label {
            color: #7d8590;
        }

        .status-value {
            color: #fff;
            font-weight: 600;
        }

        .status-value.buy {
            color: #4caf50;
        }

        .status-value.sell {
            color: #f44336;
        }

        .status-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4caf50;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .status-text {
            color: #4caf50;
            font-weight: 600;
        }

        /* WHALE ALERT */
        .whale-alert {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #232830;
            border: 2px solid #ffd700;
            border-radius: 6px;
            padding: 12px 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            transform: translateX(400px);
            transition: transform 0.4s ease;
            z-index: 1000;
            min-width: 280px;
        }

        .whale-alert.show {
            transform: translateX(0);
        }

        .whale-alert-title {
            font-size: 12px;
            font-weight: 700;
            color: #ffd700;
            margin-bottom: 6px;
        }

        .whale-alert-message {
            font-size: 13px;
            color: #c8ccd4;
        }

        /* MOBILE RESPONSIVE */
        @media (max-width: 768px) {
            .container {
                grid-template-columns: 60px 1fr;
            }

            .price-ladder {
                font-size: 10px;
            }

            .price-item {
                padding: 5px 6px;
            }

            .header {
                padding: 10px 12px;
                flex-direction: column;
                gap: 8px;
            }

            .symbol-selector {
                width: 100%;
                justify-content: space-between;
            }

            .symbol-btn {
                flex: 1;
                font-size: 11px;
                padding: 6px 8px;
            }

            .filters {
                padding: 10px 12px;
                gap: 10px;
            }

            .filter-input {
                width: 60px;
                font-size: 11px;
            }

            .table-header {
                grid-template-columns: 100px 80px 1fr;
                padding: 8px 12px;
                font-size: 10px;
            }

            .trade-row {
                grid-template-columns: 100px 80px 1fr;
                padding: 5px 12px;
                font-size: 12px;
            }

            .status-bar {
                padding: 6px 12px;
                flex-direction: column;
                gap: 6px;
                align-items: flex-start;
            }

            .status-left {
                gap: 10px;
                font-size: 10px;
            }

            .whale-alert {
                top: 10px;
                right: 10px;
                left: 10px;
                min-width: auto;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- SOL PRICE LADDER -->
        <div class="price-ladder" id="priceLadder"></div>

        <!-- SAĞ PANEL -->
        <div class="right-panel">
            <!-- HEADER -->
            <div class="header">
                <div class="title">Time & Sales</div>
                <div class="symbol-selector">
                    <button class="symbol-btn active" data-symbol="BTCUSDT">BTC</button>
                    <button class="symbol-btn" data-symbol="ETHUSDT">ETH</button>
                    <button class="symbol-btn" data-symbol="SOLUSDT">SOL</button>
                    <button class="symbol-btn" data-symbol="XRPUSDT">XRP</button>
                </div>
            </div>

            <!-- FILTERS -->
            <div class="filters">
                <div class="filter-group">
                    <label class="filter-label">Min Size</label>
                    <input type="number" class="filter-input" id="minSizeInput" placeholder="0.1" step="0.01">
                </div>
                <div class="filter-group">
                    <label class="filter-label">Max Size</label>
                    <input type="number" class="filter-input" id="maxSizeInput" placeholder="100" step="0.1">
                </div>
                <div class="filter-group">
                    <span class="filter-label">Show</span>
                    <div class="radio-group">
                        <label class="radio-label">
                            <input type="radio" name="showFilter" value="all" checked> All
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="showFilter" value="buy"> Buy
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="showFilter" value="sell"> Sell
                        </label>
                    </div>
                </div>
            </div>

            <!-- TABLE -->
            <div class="table-container">
                <div class="table-header">
                    <div>Time</div>
                    <div>Price</div>
                    <div style="text-align: right;">Size</div>
                </div>
                <div class="table-body" id="tableBody"></div>
            </div>

            <!-- STATUS BAR -->
            <div class="status-bar">
                <div class="status-left">
                    <div class="status-item">
                        <span class="status-label">Buy Vol:</span>
                        <span class="status-value buy" id="buyVol">0</span>
                    </div>
                    <div class="status-item">
                        <span class="status-label">Sell Vol:</span>
                        <span class="status-value sell" id="sellVol">0</span>
                    </div>
                    <div class="status-item">
                        <span class="status-label">Ratio:</span>
                        <span class="status-value" id="ratioVal">0%</span>
                    </div>
                </div>
                <div class="status-right">
                    <div class="status-dot"></div>
                    <span class="status-text" id="statusText">LIVE</span>
                </div>
            </div>
        </div>
    </div>

    <!-- WHALE ALERT -->
    <div class="whale-alert" id="whaleAlert">
        <div class="whale-alert-title">🐋 WHALE DETECTED</div>
        <div class="whale-alert-message" id="whaleMessage"></div>
    </div>

    <script>
        // CONFIG
        const CONFIG = {
            maxTrades: 500,
            displayThresholds: {
                BTCUSDT: 0.05,
                ETHUSDT: 1,
                SOLUSDT: 20,
                XRPUSDT: 5000
            },
            whaleThresholds: {
                BTCUSDT: 0.5,
                ETHUSDT: 15,
                SOLUSDT: 300,
                XRPUSDT: 50000
            }
        };

        // STATE
        const STATE = {
            currentSymbol: 'BTCUSDT',
            ws: null,
            trades: [],
            allTrades: [],
            volumeData: { buy: 0, sell: 0 },
            filters: {
                minSize: null,
                maxSize: null,
                show: 'all'
            },
            priceRange: { min: 0, max: 0 },
            lastResetTime: Date.now()
        };

        // DOM
        const priceLadder = document.getElementById('priceLadder');
        const tableBody = document.getElementById('tableBody');
        const statusText = document.getElementById('statusText');
        const buyVolEl = document.getElementById('buyVol');
        const sellVolEl = document.getElementById('sellVol');
        const ratioValEl = document.getElementById('ratioVal');
        const whaleAlert = document.getElementById('whaleAlert');
        const whaleMessage = document.getElementById('whaleMessage');
        const minSizeInput = document.getElementById('minSizeInput');
        const maxSizeInput = document.getElementById('maxSizeInput');

        // Symbol selection
        document.querySelectorAll('.symbol-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.symbol-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                STATE.currentSymbol = btn.dataset.symbol;
                resetState();
                connectWebSocket();
            });
        });

        // Filters
        minSizeInput.addEventListener('input', (e) => {
            STATE.filters.minSize = parseFloat(e.target.value) || null;
            applyFilters();
        });

        maxSizeInput.addEventListener('input', (e) => {
            STATE.filters.maxSize = parseFloat(e.target.value) || null;
            applyFilters();
        });

        document.querySelectorAll('input[name="showFilter"]').forEach(radio => {
            radio.addEventListener('change', (e) => {
                STATE.filters.show = e.target.value;
                applyFilters();
            });
        });

        function applyFilters() {
            STATE.trades = STATE.allTrades.filter(trade => {
                if (STATE.filters.minSize && trade.quantity < STATE.filters.minSize) return false;
                if (STATE.filters.maxSize && trade.quantity > STATE.filters.maxSize) return false;
                if (STATE.filters.show === 'buy' && !trade.isBuy) return false;
                if (STATE.filters.show === 'sell' && trade.isBuy) return false;
                return true;
            });
            renderTrades();
        }

        function resetState() {
            STATE.trades = [];
            STATE.allTrades = [];
            STATE.volumeData = { buy: 0, sell: 0 };
            STATE.priceRange = { min: 0, max: 0 };
            STATE.lastResetTime = Date.now();
            tableBody.innerHTML = '';
            updateStatusBar();
        }

        // WebSocket
        function connectWebSocket() {
            if (STATE.ws) STATE.ws.close();

            const symbol = STATE.currentSymbol.toLowerCase();
            STATE.ws = new WebSocket(`wss://stream.binance.com:9443/ws/${symbol}@trade`);

            STATE.ws.onopen = () => {
                console.log('✅ Connected:', STATE.currentSymbol);
                statusText.textContent = 'LIVE';
                statusText.style.color = '#4caf50';
            };

            STATE.ws.onmessage = (event) => {
                const trade = JSON.parse(event.data);
                processTrade(trade);
            };

            STATE.ws.onerror = () => {
                statusText.textContent = 'ERROR';
                statusText.style.color = '#f44336';
            };

            STATE.ws.onclose = () => {
                statusText.textContent = 'RECONNECTING';
                statusText.style.color = '#ff9800';
                setTimeout(connectWebSocket, 3000);
            };
        }

        function processTrade(trade) {
            const price = parseFloat(trade.p);
            const quantity = parseFloat(trade.q);
            const isBuy = !trade.m;
            const timestamp = trade.T;

            // Init price range
            if (STATE.priceRange.max === 0) {
                STATE.priceRange.min = price - 100;
                STATE.priceRange.max = price + 100;
                updatePriceLadder(price);
            }

            // Update volume
            if (isBuy) {
                STATE.volumeData.buy += quantity;
            } else {
                STATE.volumeData.sell += quantity;
            }

            // Display threshold
            const displayThreshold = CONFIG.displayThresholds[STATE.currentSymbol] || 0.05;

            if (quantity >= displayThreshold) {
                const tradeObj = {
                    time: formatTime(timestamp),
                    price: price,
                    quantity: quantity,
                    isBuy: isBuy,
                    isWhale: isWhaleTrade(quantity)
                };

                STATE.allTrades.unshift(tradeObj);
                if (STATE.allTrades.length > CONFIG.maxTrades) {
                    STATE.allTrades.pop();
                }

                applyFilters();

                if (tradeObj.isWhale) {
                    showWhaleAlert(price, quantity, isBuy);
                }

                updatePriceLadder(price);
            }

            updateStatusBar();

            // Reset every minute
            if (Date.now() - STATE.lastResetTime > 60000) {
                STATE.volumeData = { buy: 0, sell: 0 };
                STATE.lastResetTime = Date.now();
            }
        }

        function formatTime(timestamp) {
            const date = new Date(timestamp);
            const h = String(date.getHours()).padStart(2, '0');
            const m = String(date.getMinutes()).padStart(2, '0');
            const s = String(date.getSeconds()).padStart(2, '0');
            const ms = String(date.getMilliseconds()).padStart(3, '0');
            return `${h}:${m}:${s}.${ms}`;
        }

        function isWhaleTrade(quantity) {
            const threshold = CONFIG.whaleThresholds[STATE.currentSymbol] || 0.5;
            return quantity >= threshold;
        }

        function formatPrice(price) {
            if (STATE.currentSymbol === 'XRPUSDT') {
                return price.toFixed(4);
            }
            return price.toFixed(2);
        }

        function formatQuantity(quantity) {
            if (STATE.currentSymbol === 'BTCUSDT') {
                if (quantity >= 1) return quantity.toFixed(3);
                if (quantity >= 0.01) return quantity.toFixed(4);
                return quantity.toFixed(5);
            } else if (STATE.currentSymbol === 'ETHUSDT') {
                if (quantity >= 10) return quantity.toFixed(2);
                return quantity.toFixed(3);
            } else if (STATE.currentSymbol === 'SOLUSDT') {
                if (quantity >= 100) return quantity.toFixed(1);
                return quantity.toFixed(2);
            } else if (STATE.currentSymbol === 'XRPUSDT') {
                if (quantity >= 10000) return quantity.toFixed(0);
                if (quantity >= 1000) return quantity.toFixed(1);
                return quantity.toFixed(2);
            }
            return quantity.toFixed(2);
        }

        function renderTrades() {
            const fragment = document.createDocumentFragment();

            STATE.trades.slice(0, 200).forEach(trade => {
                const row = document.createElement('div');
                row.className = `trade-row ${trade.isBuy ? 'buy' : 'sell'} ${trade.isWhale ? 'whale' : ''}`;

                row.innerHTML = `
                    <div class="trade-time">${trade.time}</div>
                    <div class="trade-price">${formatPrice(trade.price)}</div>
                    <div class="trade-size">${formatQuantity(trade.quantity)}</div>
                `;

                fragment.appendChild(row);
            });

            tableBody.innerHTML = '';
            tableBody.appendChild(fragment);
        }

        function updatePriceLadder(currentPrice) {
            const start = Math.floor(currentPrice / 10) * 10 - 100;
            const end = start + 200;
            const step = STATE.currentSymbol === 'XRPUSDT' ? 0.001 : 10;

            priceLadder.innerHTML = '';

            for (let price = end; price >= start; price -= step) {
                const div = document.createElement('div');
                div.className = 'price-item';
                if (Math.abs(price - currentPrice) < step) {
                    div.classList.add('current');
                }
                div.textContent = formatPrice(price);
                priceLadder.appendChild(div);
            }
        }

        function updateStatusBar() {
            const buyVol = STATE.volumeData.buy;
            const sellVol = STATE.volumeData.sell;
            const totalVol = buyVol + sellVol;

            buyVolEl.textContent = formatQuantity(buyVol);
            sellVolEl.textContent = formatQuantity(sellVol);

            if (totalVol > 0) {
                const ratio = ((buyVol / totalVol) * 100).toFixed(1);
                ratioValEl.textContent = `${ratio}%`;
                ratioValEl.style.color = ratio >= 50 ? '#4caf50' : '#f44336';
            } else {
                ratioValEl.textContent = '0%';
                ratioValEl.style.color = '#7d8590';
            }
        }

        function showWhaleAlert(price, quantity, isBuy) {
            const symbol = STATE.currentSymbol.replace('USDT', '');
            const message = `${isBuy ? '🟢 BUY' : '🔴 SELL'} ${formatQuantity(quantity)} ${symbol} @ ${formatPrice(price)}`;

            whaleMessage.textContent = message;
            whaleAlert.classList.add('show');

            setTimeout(() => {
                whaleAlert.classList.remove('show');
            }, 5000);
        }

        // Initialize
        window.addEventListener('load', () => {
            connectWebSocket();
        });

        window.addEventListener('beforeunload', () => {
            if (STATE.ws) STATE.ws.close();
        });
    </script>
</body>
</html>

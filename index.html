<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Whale Tracker PRO - Multi Exchange</title>
<style>
    * { box-sizing: border-box; }
    body { 
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
        color: #f1f1f1; 
        margin: 0; 
        padding: 0;
        min-height: 100vh;
    }
    .container {
        max-width: 1400px;
        margin: 0 auto;
        padding: 20px;
    }
    h1 { 
        text-align: center; 
        margin: 20px 0;
        font-size: 2.5em;
        background: linear-gradient(90deg, #00d4ff, #7b2ff7);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        text-shadow: 0 0 30px rgba(0, 212, 255, 0.3);
    }
    .stats-bar {
        display: flex;
        justify-content: space-around;
        flex-wrap: wrap;
        gap: 15px;
        margin: 20px 0;
        padding: 20px;
        background: rgba(255,255,255,0.05);
        border-radius: 10px;
        backdrop-filter: blur(10px);
    }
    .stat-box {
        text-align: center;
        padding: 15px;
        background: rgba(0,0,0,0.3);
        border-radius: 8px;
        min-width: 150px;
    }
    .stat-label {
        font-size: 0.9em;
        color: #888;
        margin-bottom: 5px;
    }
    .stat-value {
        font-size: 1.5em;
        font-weight: bold;
    }
    .fear { color: #ff5555; }
    .neutral { color: #ffaa00; }
    .greed { color: #55ff55; }
    
    table { 
        width: 100%; 
        border-collapse: collapse;
        background: rgba(0,0,0,0.4);
        border-radius: 10px;
        overflow: hidden;
        box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }
    th, td { 
        border: 1px solid rgba(255,255,255,0.1); 
        padding: 12px; 
        text-align: center;
    }
    th { 
        background: rgba(123, 47, 247, 0.3);
        font-weight: 600;
        text-transform: uppercase;
        font-size: 0.85em;
        letter-spacing: 1px;
    }
    tr:nth-child(even) { background: rgba(255,255,255,0.02); }
    tr:hover { background: rgba(255,255,255,0.08); }
    
    .buy { color: #55ff55; font-weight: bold; }
    .sell { color: #ff5555; font-weight: bold; }
    
    .exchange-badge {
        display: inline-block;
        padding: 4px 8px;
        border-radius: 4px;
        font-size: 0.85em;
        font-weight: bold;
    }
    .binance { background: #f3ba2f; color: #000; }
    .bybit { background: #f7a600; color: #000; }
    .coinbase { background: #0052ff; color: #fff; }
    
    .connection-status {
        position: fixed;
        top: 10px;
        right: 10px;
        display: flex;
        gap: 8px;
        z-index: 1000;
    }
    .status-dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #ff5555;
        box-shadow: 0 0 10px currentColor;
    }
    .status-dot.connected { background: #55ff55; }
    
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-10px); }
        to { opacity: 1; transform: translateY(0); }
    }
    .new-trade {
        animation: fadeIn 0.3s ease-out;
    }
</style>
</head>
<body>

<div class="connection-status">
    <div class="status-dot" id="binanceStatus" title="Binance"></div>
    <div class="status-dot" id="bybitStatus" title="Bybit"></div>
    <div class="status-dot" id="coinbaseStatus" title="Coinbase"></div>
</div>

<div class="container">
    <h1>🐋 Whale Tracker PRO</h1>
    
    <div class="stats-bar">
        <div class="stat-box">
            <div class="stat-label">Fear & Greed Index</div>
            <div class="stat-value" id="fearIndex">--</div>
        </div>
        <div class="stat-box">
            <div class="stat-label">Toplam İşlem</div>
            <div class="stat-value" id="totalTrades">0</div>
        </div>
        <div class="stat-box">
            <div class="stat-label">Son 1 Saat</div>
            <div class="stat-value" id="hourlyTrades">0</div>
        </div>
    </div>

    <table id="tradeTable">
        <thead>
            <tr>
                <th>Borsa</th>
                <th>Coin</th>
                <th>İşlem</th>
                <th>Miktar</th>
                <th>Fiyat ($)</th>
                <th>Zaman</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
</div>

<script>
// -------------------- WHALE THRESHOLDS --------------------
const WHALE_THRESHOLDS = {
    'BTC': 5, 'ETH': 50, 'ADA': 50000, 'DOT': 5000, 'LINK': 5000,
    'MATIC': 50000, 'AVAX': 2000, 'SOL': 300, 'DOGE': 500000,
    'XRP': 50000, 'LTC': 1000, 'BCH': 500, 'ETC': 5000, 'TRX': 500000, 'EOS': 50000
};

// -------------------- STATS --------------------
let totalTrades = 0;
let hourlyTrades = 0;
let hourlyTradesArray = [];

function updateStats() {
    document.getElementById('totalTrades').textContent = totalTrades;
    document.getElementById('hourlyTrades').textContent = hourlyTrades;
}

setInterval(() => {
    const oneHourAgo = Date.now() - 3600000;
    hourlyTradesArray = hourlyTradesArray.filter(t => t > oneHourAgo);
    hourlyTrades = hourlyTradesArray.length;
    updateStats();
}, 10000);

// -------------------- TRADE TABLE --------------------
const tbody = document.querySelector("#tradeTable tbody");

function addTrade(coin, side, amount, price, exchange) {
    const tr = document.createElement("tr");
    tr.className = "new-trade";
    
    const exchangeClass = exchange.toLowerCase();
    const sideClass = side.toLowerCase().includes('buy') ? 'buy' : 'sell';
    
    tr.innerHTML = `
        <td><span class="exchange-badge ${exchangeClass}">${exchange}</span></td>
        <td><strong>${coin}</strong></td>
        <td class="${sideClass}">${side}</td>
        <td>${parseFloat(amount).toFixed(2)}</td>
        <td>$${parseFloat(price).toLocaleString()}</td>
        <td>${new Date().toLocaleTimeString('tr-TR')}</td>
    `;
    
    tbody.prepend(tr);
    if(tbody.childElementCount > 100) tbody.removeChild(tbody.lastChild);
    
    totalTrades++;
    hourlyTradesArray.push(Date.now());
    hourlyTrades = hourlyTradesArray.length;
    updateStats();
}

// -------------------- BINANCE WS --------------------
let binanceWs;
function connectBinance() {
    binanceWs = new WebSocket("wss://stream.binance.com:9443/ws/!ticker@arr");
    
    binanceWs.onopen = () => {
        document.getElementById('binanceStatus').classList.add('connected');
        console.log('Binance bağlandı');
    };
    
    binanceWs.onmessage = (msg) => {
        const data = JSON.parse(msg.data);
        data.forEach(t => {
            if (!t.s.endsWith('USDT')) return;
            const coin = t.s.replace("USDT","");
            const volume = parseFloat(t.v);
            const price = parseFloat(t.c);
            const volumeUSD = volume * price;
            
            if(WHALE_THRESHOLDS[coin]) {
                const threshold = WHALE_THRESHOLDS[coin] * price;
                if(volumeUSD >= threshold * 1000) { // Büyük hacim için
                    const side = parseFloat(t.p) > 0 ? "BUY" : "SELL";
                    addTrade(coin, side, volume, price, "Binance");
                }
            }
        });
    };
    
    binanceWs.onerror = () => {
        document.getElementById('binanceStatus').classList.remove('connected');
    };
    
    binanceWs.onclose = () => {
        document.getElementById('binanceStatus').classList.remove('connected');
        setTimeout(connectBinance, 5000);
    };
}

// -------------------- COINBASE WS --------------------
let coinbaseWs;
function connectCoinbase() {
    coinbaseWs = new WebSocket("wss://ws-feed.exchange.coinbase.com");
    
    coinbaseWs.onopen = () => {
        document.getElementById('coinbaseStatus').classList.add('connected');
        coinbaseWs.send(JSON.stringify({
            type: "subscribe",
            product_ids: ["BTC-USD", "ETH-USD", "SOL-USD", "DOGE-USD", "XRP-USD"],
            channels: ["ticker"]
        }));
        console.log('Coinbase bağlandı');
    };
    
    coinbaseWs.onmessage = (msg) => {
        const data = JSON.parse(msg.data);
        if(data.type === 'ticker' && data.product_id) {
            const coin = data.product_id.split('-')[0];
            const price = parseFloat(data.price);
            const volume24h = parseFloat(data.volume_24h);
            
            if(WHALE_THRESHOLDS[coin] && volume24h > WHALE_THRESHOLDS[coin] * 100) {
                const side = parseFloat(data.best_bid) < price ? "BUY" : "SELL";
                addTrade(coin, side, volume24h / 1000, price, "Coinbase");
            }
        }
    };
    
    coinbaseWs.onerror = () => {
        document.getElementById('coinbaseStatus').classList.remove('connected');
    };
    
    coinbaseWs.onclose = () => {
        document.getElementById('coinbaseStatus').classList.remove('connected');
        setTimeout(connectCoinbase, 5000);
    };
}

// -------------------- FEAR & GREED INDEX --------------------
async function fetchFearIndex() {
    try {
        const response = await fetch("https://api.alternative.me/fng/?limit=1");
        const data = await response.json();
        if(data?.data?.[0]) {
            const index = parseInt(data.data[0].value);
            const valueClass = index < 25 ? "fear" : index > 75 ? "greed" : "neutral";
            const label = index < 25 ? "Aşırı Korku" : index < 45 ? "Korku" : index < 55 ? "Nötr" : index < 75 ? "Açgözlülük" : "Aşırı Açgözlülük";
            document.getElementById('fearIndex').innerHTML = `<span class="${valueClass}">${index}</span> <small>${label}</small>`;
        }
    } catch(err) {
        console.error("Fear Index çekilemedi:", err);
        document.getElementById('fearIndex').textContent = "Hata";
    }
}

// -------------------- INIT --------------------
connectBinance();
connectCoinbase();
fetchFearIndex();
setInterval(fetchFearIndex, 300000); // 5 dakikada bir

// Bybit'i kaldırdık çünkü WebSocket API'si değişti ve güncel dokümantasyon gerekli
</script>

</body>
</html>

<script>
    // ========== PART 1/2: VARIABLES & BASIC FUNCTIONS ==========
    
    let ws = null;
    let trades = [];
    const maxTrades = 100;
    let currentSymbol = 'BTCUSDT';
    let buyVolume = 0;
    let sellVolume = 0;
    let audioContext = null;
    let dataSource = 'binance';
    let reconnectAttempts = 0;
    const maxReconnectAttempts = 3;

    const tradesContainer = document.getElementById('tradesContainer');
    const symbolSelector = document.getElementById('symbolSelector');
    const statusText = document.getElementById('statusText');
    const buyVolumeEl = document.getElementById('buyVolume');
    const sellVolumeEl = document.getElementById('sellVolume');
    const totalVolumeEl = document.getElementById('totalVolume');
    const notification = document.getElementById('notification');
    const notificationMessage = document.getElementById('notificationMessage');

    // Ses sistemi
    function initAudio() {
        if (!audioContext) {
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
        }
    }

    function playBeep(frequency = 800, duration = 200) {
        initAudio();
        const oscillator = audioContext.createOscillator();
        const gainNode = audioContext.createGain();
        
        oscillator.connect(gainNode);
        gainNode.connect(audioContext.destination);
        
        oscillator.frequency.value = frequency;
        oscillator.type = 'sine';
        
        gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + duration / 1000);
        
        oscillator.start(audioContext.currentTime);
        oscillator.stop(audioContext.currentTime + duration / 1000);
    }

    function showNotification(message) {
        notificationMessage.textContent = message;
        notification.classList.add('show');
        playBeep(1200, 300);
        
        setTimeout(() => {
            notification.classList.remove('show');
        }, 5000);
    }

    async function fetchFearGreedIndex() {
        try {
            const response = await fetch('https://api.alternative.me/fng/?limit=1');
            const data = await response.json();
            const index = data.data[0];
            
            const value = parseInt(index.value);
            const classification = index.value_classification;
            
            document.getElementById('fearGreedValue').textContent = value;
            document.getElementById('fearGreedStatus').textContent = classification.toUpperCase();
            
            const statusEl = document.getElementById('fearGreedStatus');
            if (value <= 25) {
                statusEl.style.background = 'rgba(255, 68, 68, 0.2)';
                statusEl.style.color = '#ff4444';
            } else if (value <= 45) {
                statusEl.style.background = 'rgba(255, 136, 68, 0.2)';
                statusEl.style.color = '#ff8844';
            } else if (value <= 55) {
                statusEl.style.background = 'rgba(255, 221, 68, 0.2)';
                statusEl.style.color = '#ffdd44';
            } else if (value <= 75) {
                statusEl.style.background = 'rgba(136, 255, 68, 0.2)';
                statusEl.style.color = '#88ff44';
            } else {
                statusEl.style.background = 'rgba(68, 255, 68, 0.2)';
                statusEl.style.color = '#44ff44';
            }
            
            document.getElementById('fearGreedInfo').textContent = 
                `Last updated: ${new Date(index.timestamp * 1000).toLocaleString()}`;
            
        } catch (error) {
            console.error('Fear & Greed Index hatası:', error);
            document.getElementById('fearGreedInfo').textContent = 'Unable to fetch data';
        }
    }

    async function fetch24hVolume() {
        try {
            const response = await fetch(`https://api.binance.com/api/v3/ticker/24hr?symbol=${currentSymbol}`);
            const data = await response.json();
            const volume = parseFloat(data.volume);
            totalVolumeEl.textContent = volume > 1000 ? (volume / 1000).toFixed(2) + 'K' : volume.toFixed(2);
        } catch (error) {
            console.error('24h volume hatası:', error);
        }
    }

    symbolSelector.addEventListener('change', (e) => {
        currentSymbol = e.target.value;
        trades = [];
        buyVolume = 0;
        sellVolume = 0;
        tradesContainer.innerHTML = '';
        buyVolumeEl.textContent = '0';
        sellVolumeEl.textContent = '0';
        dataSource = 'binance';
        reconnectAttempts = 0;
        connectWebSocket();
        fetch24hVolume();
    });

   // ========== PART 2/2: WEBSOCKET & TRADE FUNCTIONS ==========

// ÇOK KAYNAK STRATEJİSİ - Binance, Kraken, Coinbase
function connectWebSocket() {
    if (ws) {
        ws.close();
    }

    const symbol = currentSymbol.toLowerCase();
    let wsUrl;
    let needsSubscription = false;
    let subscribeMessage = null;

    if (dataSource === 'binance') {
        wsUrl = `wss://stream.binance.com:9443/ws/${symbol}@trade`;
        console.log('🔵 Binance bağlantısı kuruluyor...', currentSymbol);
    } else if (dataSource === 'kraken') {
        wsUrl = `wss://ws.kraken.com/`;
        needsSubscription = true;
        const krakenPair = currentSymbol.replace('USDT', '/USD').replace('BTC', 'XBT');
        subscribeMessage = {
            event: 'subscribe',
            pair: [krakenPair],
            subscription: { name: 'trade' }
        };
        console.log('🟣 Kraken bağlantısı kuruluyor...', krakenPair);
    } else if (dataSource === 'coinbase') {
        wsUrl = `wss://ws-feed.exchange.coinbase.com`;
        needsSubscription = true;
        const coinbasePair = currentSymbol.replace('USDT', '-USD');
        subscribeMessage = {
            type: 'subscribe',
            product_ids: [coinbasePair],
            channels: ['matches']
        };
        console.log('🔵 Coinbase bağlantısı kuruluyor...', coinbasePair);
    }

    ws = new WebSocket(wsUrl);

    ws.onopen = () => {
        console.log(`✅ ${dataSource.toUpperCase()} WebSocket AÇILDI:`, currentSymbol);
        statusText.textContent = `LIVE (${dataSource.toUpperCase()})`;
        statusText.style.color = '#00ff66';
        reconnectAttempts = 0;

        if (needsSubscription && subscribeMessage) {
            console.log('📤 Subscribe mesajı gönderiliyor...', subscribeMessage);
            ws.send(JSON.stringify(subscribeMessage));
        }
    };

    ws.onmessage = (event) => {
        try {
            const data = JSON.parse(event.data);
            
            // Binance formatı
            if (dataSource === 'binance' && data.e === 'trade') {
                console.log('📊 Binance Trade:', {
                    price: data.p,
                    quantity: data.q,
                    time: new Date(data.T).toLocaleTimeString()
                });
                addTrade(data);
            }
            // Kraken formatı
            else if (dataSource === 'kraken') {
                if (Array.isArray(data) && data.length >= 2) {
                    const eventType = data[2];
                    if (eventType === 'trade') {
                        const trades = data[1];
                        if (Array.isArray(trades)) {
                            trades.forEach(trade => {
                                const krakenTrade = {
                                    T: Date.now(),
                                    p: parseFloat(trade[0]),
                                    q: parseFloat(trade[1]),
                                    m: trade[3] === 's'
                                };
                                console.log('📊 Kraken Trade:', krakenTrade);
                                addTrade(krakenTrade);
                            });
                        }
                    }
                } else if (data.event === 'subscribed') {
                    console.log('✅ Kraken subscription başarılı:', data);
                }
            }
            // Coinbase formatı
            else if (dataSource === 'coinbase' && data.type === 'match') {
                const coinbaseTrade = {
                    T: new Date(data.time).getTime(),
                    p: parseFloat(data.price),
                    q: parseFloat(data.size),
                    m: data.side === 'sell'
                };
                console.log('📊 Coinbase Trade:', coinbaseTrade);
                addTrade(coinbaseTrade);
            } else if (dataSource === 'coinbase' && data.type === 'subscriptions') {
                console.log('✅ Coinbase subscription başarılı:', data);
            }
        } catch (error) {
            console.error('❌ Parse hatası:', error);
        }
    };

    ws.onerror = (error) => {
        console.error(`❌ ${dataSource.toUpperCase()} WebSocket HATASI:`, error);
        statusText.textContent = 'ERROR';
        statusText.style.color = '#ff4444';
    };

    ws.onclose = (event) => {
        console.log(`⚠️ ${dataSource.toUpperCase()} WebSocket KAPANDI. Code:`, event.code);
        statusText.textContent = 'RECONNECTING';
        statusText.style.color = '#ffaa00';
        
        reconnectAttempts++;
        
        if (reconnectAttempts >= maxReconnectAttempts) {
            console.log('⚠️ Maksimum deneme sayısı aşıldı, kaynak değiştiriliyor...');
            
            if (dataSource === 'binance') {
                dataSource = 'kraken';
                console.log('🔄 Kraken\'a geçiliyor...');
            } else if (dataSource === 'kraken') {
                dataSource = 'coinbase';
                console.log('🔄 Coinbase\'e geçiliyor...');
            } else {
                dataSource = 'binance';
                console.log('🔄 Binance\'e geri dönülüyor...');
            }
            reconnectAttempts = 0;
        }
        
        setTimeout(() => {
            console.log(`🔄 ${dataSource.toUpperCase()} ile yeniden bağlanıyor...`);
            connectWebSocket();
        }, 2000);
    };
}

function formatQuantity(quantity, symbol) {
    if (symbol === 'BTCUSDT') {
        if (quantity >= 1) return quantity.toFixed(3);
        if (quantity >= 0.1) return quantity.toFixed(4);
        return quantity.toFixed(6);
    } else if (symbol === 'ETHUSDT') {
        if (quantity >= 10) return quantity.toFixed(2);
        if (quantity >= 1) return quantity.toFixed(3);
        return quantity.toFixed(5);
    } else if (symbol === 'BNBUSDT' || symbol === 'SOLUSDT') {
        if (quantity >= 100) return quantity.toFixed(1);
        return quantity.toFixed(3);
    } else if (symbol === 'XRPUSDT') {
        if (quantity >= 1000) return quantity.toFixed(0);
        return quantity.toFixed(2);
    }
    return quantity.toFixed(2);
}

function formatPrice(price, symbol) {
    if (symbol === 'XRPUSDT') {
        return parseFloat(price).toFixed(4);
    }
    return parseFloat(price).toFixed(2);
}

function addTrade(trade) {
    const time = new Date(trade.T);
    const formattedTime = `${String(time.getHours()).padStart(2, '0')}:${String(time.getMinutes()).padStart(2, '0')}:${String(time.getSeconds()).padStart(2, '0')}`;
    
    const price = formatPrice(trade.p, currentSymbol);
    const quantity = parseFloat(trade.q);
    const isBuy = !trade.m;

    // SADECE BÜYÜK EMİRLER - 5 BTC eşdeğeri
    const minBTC = 5;
    let shouldShow = false;
    
    if (currentSymbol === 'BTCUSDT') {
        shouldShow = quantity >= minBTC;
    } else {
        const tradeValue = quantity * parseFloat(trade.p);
        shouldShow = tradeValue >= (minBTC * 95000);
    }

    if (!shouldShow) return;

    const quantityFormatted = formatQuantity(quantity, currentSymbol);

    // Hacim güncelle
    if (isBuy) {
        buyVolume += quantity;
        buyVolumeEl.textContent = formatQuantity(buyVolume, currentSymbol);
    } else {
        sellVolume += quantity;
        sellVolumeEl.textContent = formatQuantity(sellVolume, currentSymbol);
    }

    // Bildirim
    const tradeValueUSD = (quantity * parseFloat(trade.p)).toFixed(0);
    const message = `${isBuy ? '🟢 BUY' : '🔴 SELL'} ${quantityFormatted} ${currentSymbol.replace('USDT', '')} @ $${price} (≈$${parseInt(tradeValueUSD).toLocaleString()})`;
    showNotification(message);

    trades.unshift({
        time: formattedTime,
        price: price,
        quantity: quantityFormatted,
        isBuy: isBuy,
        isLarge: true
    });

    if (trades.length > maxTrades) {
        trades.pop();
    }

    renderTrades();
}

function renderTrades() {
    tradesContainer.innerHTML = '';
    
    trades.forEach(trade => {
        const tradeRow = document.createElement('div');
        tradeRow.className = `trade-row ${trade.isBuy ? 'buy' : 'sell'} ${trade.isLarge ? 'large' : ''}`;
        
        tradeRow.innerHTML = `
            <div class="time">${trade.time}</div>
            <div class="price">${trade.price}</div>
            <div class="size">${trade.quantity}</div>
        `;
        
        tradesContainer.appendChild(tradeRow);
    });
}

// Başlatma
window.addEventListener('load', () => {
    connectWebSocket();
    fetch24hVolume();
    fetchFearGreedIndex();
    
    setInterval(fetchFearGreedIndex, 300000);
    setInterval(fetch24hVolume, 30000);
});

window.addEventListener('beforeunload', () => {
    if (ws) ws.close();
});

document.addEventListener('click', initAudio, { once: true });

    
</script>

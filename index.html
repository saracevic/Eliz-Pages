<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whale Tracker PRO - Multi Exchange</title>
    <style>
        body { font-family: Arial, sans-serif; background:#111; color:#fff; margin:0; padding:0; }
        h1 { text-align:center; margin:10px 0; }
        #trades { margin:10px; }
        .trade { padding:5px; border-bottom:1px solid #333; }
        .trade.large { color: #0f0; font-weight:bold; }
        #fgi { margin:10px; font-size:18px; text-align:center; }
    </style>
</head>
<body>
    <h1>Whale Tracker PRO</h1>
    <div id="fgi">Fear & Greed Index: <span id="fgiValue">Loading...</span></div>
    <div id="trades"></div>

<script>
/* ===========================
   COIN ADETLERİNE GÖRE WHALE EŞİKLERİ
   =========================== */
const WHALE_THRESHOLDS = {
    'BTC': 9,
    'ETH': 90,
    'ADA': 50000,
    'DOT': 5000,
    'LINK': 5000,
    'MATIC': 50000,
    'AVAX': 2000,
    'SOL': 500,
    'DOGE': 500000,
    'XRP': 50000,
    'LTC': 1000,
    'BCH': 500,
    'ETC': 5000,
    'TRX': 500000,
    'EOS': 50000
};

/* ===========================
   ALARM FONKSİYONU
   =========================== */
function triggerAlarm(trade) {
    // Örnek: Telefon bildirim veya ses
    console.log("ALARM: Whale trade detected!", trade);
    if (Notification.permission === "granted") {
        new Notification(`Whale ${trade.coin} ${trade.side} ${trade.amount}`);
    } else if (Notification.permission !== "denied") {
        Notification.requestPermission();
    }
}

/* ===========================
   TRADE GÖSTERİMİ
   =========================== */
function showTrade(trade) {
    const div = document.createElement('div');
    div.className = 'trade';
    if (trade.amount >= (WHALE_THRESHOLDS[trade.coin] || 0)) div.classList.add('large');
    div.innerText = `[${trade.borsa}] ${trade.coin} ${trade.side} ${trade.amount} @ ${trade.price}`;
    document.getElementById('trades').prepend(div);
    if (div.classList.contains('large')) triggerAlarm(trade);
}

/* ===========================
   FGI VERİSİ ÇEKME
   =========================== */
async function fetchFGI() {
    try {
        const res = await fetch('https://api.alternative.me/fng/?limit=1');
        const data = await res.json();
        document.getElementById('fgiValue').innerText = `${data.data[0].value} - ${data.data[0].value_classification}`;
    } catch (e) {
        document.getElementById('fgiValue').innerText = "Error";
        console.error(e);
    }
}
fetchFGI();
setInterval(fetchFGI, 60*1000); // Her dakika güncelle

/* ===========================
   BORSALAR: BINANCE, BYBIT, COINEX
   =========================== */

function connectBinance() {
    const ws = new WebSocket('wss://stream.binance.com:9443/ws/!ticker@arr');
    ws.onmessage = (msg) => {
        const data = JSON.parse(msg.data);
        data.forEach(t => {
            const coin = t.s.replace('USDT','');
            const amount = parseFloat(t.q);
            const price = parseFloat(t.c);
            const side = (parseFloat(t.p) > 0) ? 'BUY' : 'SELL';
            if (WHALE_THRESHOLDS[coin] && amount >= WHALE_THRESHOLDS[coin]) {
                showTrade({coin, amount, price, side, borsa:'BINANCE'});
            }
        });
    };
}

function connectBybit() {
    const ws = new WebSocket('wss://stream.bybit.com/realtime');
    ws.onopen = () => ws.send(JSON.stringify({op:"subscribe",args:["trade.BTCUSD","trade.ETHUSD"]}));
    ws.onmessage = (msg) => {
        const data = JSON.parse(msg.data);
        if (data.topic && data.data) {
            data.data.forEach(t => {
                const coin = t.symbol.replace('USD','');
                const amount = parseFloat(t.size);
                const price = parseFloat(t.price);
                const side = t.side.toUpperCase();
                if (WHALE_THRESHOLDS[coin] && amount >= WHALE_THRESHOLDS[coin]) {
                    showTrade({coin, amount, price, side, borsa:'BYBIT'});
                }
            });
        }
    };
}

function connectCoinEx() {
    const ws = new WebSocket('wss://socket.coinex.com/');
    ws.onopen = () => {
        ws.send(JSON.stringify({"method":"subscribe","params":["spot/trade.BTCUSDT","spot/trade.ETHUSDT"]}));
    };
    ws.onmessage = (msg) => {
        const data = JSON.parse(msg.data);
        if (data.method === 'snapshot.update' && data.params && data.params[1]) {
            data.params[1].forEach(t => {
                const coin = t[0].replace('USDT','');
                const amount = parseFloat(t[1]);
                const price = parseFloat(t[2]);
                const side = t[3].toUpperCase();
                if (WHALE_THRESHOLDS[coin] && amount >= WHALE_THRESHOLDS[coin]) {
                    showTrade({coin, amount, price, side, borsa:'COINEX'});
                }
            });
        }
    };
}

/* ===========================
   BAĞLANTIYI BAŞLAT
   =========================== */
connectBinance();
connectBybit();
connectCoinEx();
</script>
</body>
</html>
